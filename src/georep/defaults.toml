# Standardkonfiguration, stadtneutral: Kommunalwahl 2025 in Nordrhein-Westfalen, Ratsdokumente der
# Wahlperiode 2020–2025. Alles Stadtspezifische (Endpunkte, Spaltennamen, Gremien, Fremddaten,
# Urheber, Ausschlussliste, Lizenzen) steht im Profil der Stadt unter profiles/<slug>.toml; ohne
# --profile gilt default_profile.
# Jede Zahl trägt ihre Begründung. Überschreiben in ./settings.toml oder ./settings.local.toml
# (gitignored, rechnerspezifisch; tiefer Merge, es reicht der geänderte Schlüssel) oder per
# Umgebungsvariable GEOREP_<FELD>, verschachtelt mit __, z. B. GEOREP_SOURCES__OPARL__DELAY_S=2.
# Reihenfolge: Umgebung > settings.local.toml > settings.toml > diese Datei.

data_root = "./data"           # Laufzeitdaten und Zwischenergebnisse, relativ zum Arbeitsverzeichnis; gitignored
cache_root = ""                # leer = <data_root>/cache: PDFs, Texte, HTTP-Cache; bei Konrad auf xtraspace
reference_root = "./reference" # eingefrorener Datensatz der Arbeit; wird nur gelesen
profile = ""                   # Unterordner je Stadt oder Periode unter data_root und cache_root (das Profil setzt ihn); leer = die Hauptperiode, flach
default_profile = "duesseldorf" # Paketprofil, das ohne --profile und ohne GEOREP_PROFILE gilt (src/georep/profiles/<name>.toml)
contracts = "on"               # "off" schaltet die deal-Verträge ab (deal.disable beim Start); zählt nicht zum Fingerprint
log_level = "INFO"

[period]                       # Wahlperiode zwischen den Kommunalwahlen 2020 und 2025, beide Grenzen einschließlich
start = 2020-09-13
end = 2025-09-14               # end = "" für eine laufende Periode (der tiefe Merge ließe das Datum sonst stehen); dann ist election Pflicht
# election = 2025-09-14        # Wahltag, dessen Ergebnis Nenner und Zuschnitt liefert; Standard: end
label = ""                     # Option 02: Anzeigename der Periode auf der Seite; leer = „Wahlperiode <Startjahr> bis <Endjahr>"
dictionary = "own"             # Option 02: "base" liest Straßen und Orte der Hauptperiode (Profil ""), dann gibt es streets_osm und pois_wiki im Profil nicht

[http]
timeout_s = 180                # der OParl-Server brauchte am 2026-10-09 85 s pro Seite
retries = 5                    # 429 und 5xx mit exponentiellem Backoff
user_agent = "georep/0.2 (+https://github.com/konradvoelkel/geographic-representation-dus)"

[cache]                        # Lebensdauer gecachter HTTP-Antworten in cache_root/http.sqlite, Sekunden; 0 = nie
oparl_pages_s = 3600           # Metadatenseiten ändern sich täglich; eine Stunde hilft beim Entwickeln und Wiederaufnehmen
opendata_s = 2592000           # 30 Tage: Wahlergebnis und Stimmbezirke 2025 ändern sich nicht mehr
wikidata_s = 2592000
wikipedia_s = 2592000
overpass_s = 2592000           # Straßennamen ändern sich langsam; die Referenz stammt vom November 2025

[sources.oparl]
delay_s = 1.0                  # Pause zwischen Seiten und Dateien; der Server ist langsam, nicht wir
stop_when_older = true         # Liste ist neueste zuerst: abbrechen, sobald eine Seite nur noch Paper vor period.start hat (spart 270 von 365 Seiten)
incremental = true             # bei vorhandenem Store nur Paper mit modified_since (letztes modified minus ein Tag) holen
pdf_limit = 0                  # neue PDF-Downloads je Lauf; 0 = alle (`georep fetch pdfs --limit N` setzt es für einen Lauf)
max_pages = 0                  # Option 04: Metadatenseiten je Lauf; 0 = alle (`georep fetch papers --max-pages 1` ist die Probe, ob der Server Urheberfelder liefert)
first_page = 1                 # Option 02: erste Seite des Abrufs; ein Periodenprofil überspringt so die Seiten jüngerer Perioden (2014 bis 2020: ab Seite 90, Stand 2026-10)

[sources.wikidata]
sparql_endpoint = "https://query.wikidata.org/sparql"
wikipedia_api = "https://de.wikipedia.org/w/api.php"
language = "de"
geosearch_limit = 500          # Maximum der Wikipedia-GeoSearch je Bounding Box
delay_s = 1.0                  # Pause zwischen den 306 GeoSearch-Abfragen

[sources.osm]
overpass_endpoint = "https://overpass-api.de/api/interpreter"
delay_s = 1.0                  # Pause zwischen den 306 Polygonabfragen; der öffentliche Server antwortet sonst mit 504
simplify_m = 2.0               # Polygon vorher um 2 m vereinfachen (Douglas-Peucker), damit die Abfrage kurz bleibt

[geo]
working_crs = "EPSG:25832"     # metrisch rechnen (ETRS89 / UTM 32N); die Quellgeometrie kommt je Stadt in EPSG:4647 oder EPSG:25832, dasselbe Datum, 4647 mit Zonenpräfix
output_crs = "EPSG:4326"       # Overpass und Wikidata sprechen lon/lat; genau eine Reprojektionsstelle

[search]
hide_in_display = ["schulweg"] # wird aus der Begriffsliste der Auswertung entfernt, zählt aber in den Treffern (Verhalten der Arbeit, Kap. 4.3.5)

# Regel 1 „Einrichtung mit Stadtnamen" (docs/decisions.md Punkt 44a, gemessen in
# docs/methodik-review-2026-10.md): ein Ort aus Wikidata/Wikipedia, dessen Label den Stadtnamen
# des Profils am Ende trägt (die letzten Wörter, so viele wie der Stadtname hat) oder das
# Städteadjektiv irgendwo, ist eine Einrichtung mit stadtweiter Bedeutung und fällt aus dem
# Wörterbuch. Standard an, weil die Benennung in jeder Stadt dieselbe ist; false reproduziert die
# Arbeit exakt (Golden Master). place_words darf dann nicht leer sein, sonst wäre die Regel still
# „Stadtname zuletzt genügt" und träfe jeden Bahnhof mit.
city_facilities = true
# Gattungswörter, die einen Ort an einer Adresse anzeigen: endet ein Wort des Labels auf eines
# von ihnen, bleibt der Ort ein Ort, auch mit Stadtnamen („Düsseldorfer Stadtwald", „Bahnhof
# Düsseldorf-Rath"). Verglichen wird das Wortende, nicht das Vorkommen, weil „park" sonst in
# „Stadtsparkasse" steckt; deutsche Zusammensetzungen tragen ihren Kopf hinten. Stadtneutral,
# aber deutschsprachig: eine Stadt in einem anderen Sprachraum ersetzt die Liste im Profil.
# „halle" und „schule" stehen bewusst nicht darin: sonst bliebe die Tonhalle oder die Hochschule
# einer Stadt ein Ort, und genau das sind die Einrichtungen, um die es geht.
place_words = [
    "bahnhof", "bahnhöfe", "haltepunkt", "bahnsteig", "brücke",       # Verkehrsbauwerke
    "park", "garten", "gärten", "wald", "friedhof", "wiese",          # Grün
    "see", "weiher", "teich",                                         # Wasser
    "platz", "sportplatz", "stadion",                                 # Plätze und Anlagen
    "gymnasium", "gesamtschule", "realschule", "grundschule", "hauptschule", "berufskolleg",
    "krankenhaus", "hospital", "klinik", "klinikum",
]

# Regel 2 „stadtweite Begriffe" (decisions.md Punkt 44): Begriffe, die in auffällig vielen
# Dokumenten stehen, handeln meist nicht von ihrem Wahlbezirk („hofgarten" 172, „schulweg" 144 auf
# der Referenz). Die Seite nennt sie im Abschnitt „Begriffe" mit Dokumentzahl und Wahlbezirk,
# damit Leser die Grenze der Methode sehen; gezählt werden sie weiter, die Regel ändert keine
# Zahl (decisions.md, Punkt 44b). Schwelle ist entweder ein Quantil der Dokumenthäufigkeit oder
# ein Vielfaches des Medians, nie beides; 0 schaltet ab.
citywide_quantile = 0.99       # 1 % der Begriffe; auf der Referenz 55 von 5727 über 64 Dokumenten (ohne Regel 1: 58 von 5841). 0,95 wären 276 Begriffe und damit keine Liste zum Lesen mehr. Die Schwelle ist immer mindestens 1: sonst gilt in einem dünnen Index jeder Begriff mit einem Dokument als stadtweit
citywide_median_factor = 0.0   # Alternative zum Quantil, genau eine der beiden gilt: Vielfaches des Medians. Auf der Referenz ist der Median 1 Dokument, ein Vielfaches davon wäre willkürlich; in einem kleineren Korpus kann es die robustere Schwelle sein

# zählt je Wahlbezirk höchstens einmal (Maximum über seine Begriffe mal Dokumentart mal Thema).
[weights]
combined = ["idf", "antraege_halb"]  # Faktoren der Variante "kombiniert" als Produkt: feste Faktoren "idf", "bezirke" oder ein Regelsatz von unten; leer = keine Zeile

[[weights.paper_type]]         # Regelsatz = eine Variante: geordnete Regex-Regeln auf paper_type (ohne Groß/Klein), die erste passende gewinnt, sonst default
name = "antraege_halb"
label = "Anträge, Anfragen, Eingaben halb"  # nur die Beschriftung der Zeile auf der Seite; zählt nicht zum Fingerprint
default = 1.0
rules = [{ pattern = "^z?(antrag|anfrage|haushaltsantrag|eingabe)", weight = 0.5 }]  # deckt 30 Fraktionsvarianten ("Antrag SPD", "zAnfrage REP") mit einem Präfix; A+F Beschluss und Bedarfsbeschluss bleiben Vorlagen

[[weights.paper_type]]
name = "nur_vorlagen"
label = "nur Verwaltungsvorlagen"
default = 1.0
rules = [{ pattern = "^z?(antrag|anfrage|haushaltsantrag|eingabe)", weight = 0.0 }]  # dieselbe Grenze mit Gewicht null

[topics]                       # Themenmodell: TF-IDF und NMF (scikit-learn) über die Texte; je Thema eine Variante thema_NN
k = 20                         # Zahl der Themen; lesbar auf der Seite, 3,8 s auf 19 033 Texten (2026-10-11); 0 schaltet den Schritt topics ab, 99 ist die Obergrenze (die Varianten heißen thema_NN)
min_df = 5                     # ein Wort zählt erst ab 5 Dokumenten (Tippfehler, seltene Namen fallen weg)
max_df = 0.5                   # ein Wort in mehr als der Hälfte der Dokumente ist ein Formularwort
max_features = 20000           # die häufigsten Wörter; mehr ändert die Themen nicht und kostet Zeit
top_words = 10                 # Wörter je Themenlabel; die Wörter beschreiben das Thema, sie benennen es nicht
stop_words = "de"              # Funktionswörter aus der Paketdatei analysis/stopwords_de.txt (ohne sie entsteht ein Thema aus "auch, oder, sich"); "" = keine
max_iter = 200                 # Obergrenze der NMF-Iterationen; mit tol unten konvergiert das Modell nach 120 (2026-10-12)
tol = 0.001                    # Abbruchschwelle: mit 1e-4 läuft NMF in die Obergrenze (200 Iterationen, 6,9 s; konvergiert erst bei 412 und 13,4 s) und gewinnt dabei 0,03 % Rekonstruktionsfehler; 1e-3 konvergiert nach 120 Iterationen in 4,5 s (gemessen 2026-10-12 auf 19 033 Texten)
random_state = 0               # Startwert für NMF; nndsvda ist deterministisch, der Wert steht trotzdem hier

# Punkt 45 (docs/themenmodell-2026-10.md): woher die Stoppwörter neben der Paketliste kommen.
# "fraktionen" liest Namen, Kürzel und Muster der Parteien, Gruppen und Fraktions-, Gemeinschafts-
# und Personenmarker aus [originators] (Option 04), "gremien" die Kürzel aus [bodies] (Option 05) —
# nur die Kürzel, nicht die Namen: "Verkehrsausschuss" ist ein Themenwort. "namen" nimmt die
# Wörter, die fast nur in einem Namensfenster stehen (unten). Keine zweite Liste: alles steht schon
# im Profil. Ohne die Quellen prägen Fraktions- und Personennamen die Themen (gemessen 2026-10-12
# auf der Referenz: Thema 3 "antrag, gez, fraktion, cdu, grünen", Thema 16 "linke, sönke, voigt,
# julia"); leer = nur die Paketliste, also der Stand von Option 06.
# Aus einem Muster werden die Buchstabenfolgen genommen; Bruchstücke eines Regex ("frak" aus
# "frak\w{0,2}ion") sind harmlos, weil sie allein kein Token bilden.
stop_sources = ["fraktionen", "gremien", "namen"]
# Wörter, die trotz einer Quelle bleiben: das Profil nennt die Sachwörter, die zufällig in einem
# Gruppennamen oder Gremienkürzel stehen ("Klima" in "Die PARTEI-Klima-Fraktion", "BAU" als
# Kürzel des Bauausschusses). Abgezogen wird am Ende von der ganzen Vereinigung, also auch von
# der deutschen Paketliste und von den Namen aus dem Korpus -- wer hier ein Funktionswort nennt,
# holt es zurück ins Vokabular. Genau eine Liste, damit es nicht zwei Wahrheiten gibt.
stop_keep = []
# Fenster, in denen ein Personenname steht: hinter einer Unterschrift oder einer Amtsbezeichnung.
# Deutschsprachig und stadtneutral wie search.place_words; eine Stadt in einem anderen Sprachraum
# ersetzt die Liste im Profil. Die Personenmarker aus [originators] kommen dazu, damit dieselbe
# Liste nicht zweimal gepflegt wird. Ohne die Amtsbezeichnungen bleiben die Namen der Dezernenten
# in den Themen stehen (gemessen 2026-10-12: 196 statt 254 Namen, "jochen", "kral", "doroth").
name_markers = ["gez.", "mit freundlichen grüßen", "oberbürgermeister", "bürgermeister", "beigeordnete", "stadtdirektor", "stadtkämmer", "dezernent", "amtsleiter", "vorsitzende"]
name_window = 60               # Zeichen hinter dem Marker; das letzte, abgeschnittene Wort zählt nicht mit
name_min_documents = 5         # in so vielen Fenstern muss ein Wort stehen; darunter ist es ein Tippfehler der Quelle, kein Name
name_share = 0.8               # und so viel seiner Dokumente müssen Fenster sein: 0,8 trifft 254 Wörter, 0,5 wären 578 und nähme Sachwörter mit (gemessen 2026-10-12)

# Gesäte Themen: je Ausschuss ein Thema, dessen Wortprofil aus den dort beratenen Dokumenten kommt
# (Gremium je Dokument aus Option 05). Die Wortmatrix der gesäten Themen ist fest, die freien
# Themen rechnen auf dem Rest; so tragen die Themen einen Namen statt einer Nummer. Gemessen am
# 2026-10-12 auf der Referenz: 17 gesäte Themen, 71 bis 99 % der Dokumente eines Ausschusses haben
# sein Thema als stärkstes. Mit "none" rechnet die Kette freie NMF wie Option 06.
seed = "committees"
free = 3                       # Themen ohne Saat; sie nehmen auf, was kein Ausschuss erklärt (Anträge, Anfragen, Bauvorhaben)
seed_words = 30                # Saatwörter je Ausschuss, nach Log-Odds mit Dirichlet-Prior gegen die anderen Ausschüsse; 10 davon stehen als Label auf der Seite
seed_min_documents = 10        # ein Ausschuss mit weniger beratenen Dokumenten bekommt kein eigenes Thema (zwei je Faltung im Messskript)
seed_prior = 1000.0            # Stärke des Dirichlet-Priors in Pseudo-Token; dämpft Wörter, die nur ein paar Mal vorkommen

# --- Punkt 45: der passende Ausschuss je Dokument (docs/themenmodell-2026-10.md) -------------------
[classify]                     # TF-IDF (Parameter aus [topics]) und logistische Regression auf den Dokumenten, deren Gremium ein Ausschuss ist
enabled = true                 # false nimmt den Schritt committees aus dem Register; ohne [bodies.committees] fehlt er ohnehin
min_documents = 10             # eine Klasse braucht so viele beratene Dokumente: zwei je Faltung bei fünf Faltungen
min_probability = 0.4          # darunter zählt ein Dokument als querschnittlich und landet in der Restklasse; bei 20 Klassen sind 0,4 das Achtfache des Zufalls (1/20)
regularisation = 1.0           # C der logistischen Regression; kleiner heißt stärker geglättet
max_iterations = 1000          # lbfgs; damit konvergiert das Modell auf der Referenz (2026-10-12)
random_state = 0               # fester Startwert, damit zwei Läufe dieselbe Zuordnung schreiben

# --- Option 03: Kontrollvariablen (docs/plans/03-kontrollvariablen.md) -----------------------------
[crosswalk]                    # Umrechnung eines älteren Zuschnitts auf die Wahlbezirke der Hauptperiode (Profil "")
enabled = false                # true nur in einem Periodenprofil (profiles/duesseldorf-2014.toml): Schritt precincts, Wähler über Flächenanteile der Stimmbezirke
target_file = "Stimmbezirke_2025.geojson"  # Stimmbezirksdatei der Hauptperiode, aus der die Zielbezirke vereinigt werden
precinct_id = ""               # Eigenschaft der Stimmbezirksnummer im Stimmbezirks-GeoJSON der Periode (2020: "Stimmbezchar"); [columns] beschreibt weiter den Zielzuschnitt
district_id = ""               # Eigenschaft der Wahlbezirksnummer in Kommunalwahlbezirke.geojson (2020: "Kommunalwahlbezirk")
district_name = ""             # Eigenschaft des Wahlbezirksnamens dort (2020: "Name")
min_coverage = 0.95            # kleinste zulässige Abdeckung einer Quellfläche durch die Zielbezirke; 2020 auf 2025 liegt sie bei 97,8 % bis 100 % (Stadtgrenze, Rhein), weniger heißt falsches CRS

[compare]                      # Vergleich zweier Perioden, Schritt compare auf der Hauptperiode
period = ""                    # Profil der älteren Periode (Ordner unter data_root); leer = kein Vergleich; profiles/duesseldorf-vergleich.toml setzt "2014-2020"
label = ""                     # Anzeigename der älteren Periode in der Vergleichstabelle und auf der Seite; leer = der Profilname

# --- Option 07: Monitoring der laufenden Wahlperiode (profiles/duesseldorf-2025.toml setzt sie)
[bootstrap]
seed_corpus = true             # false in einem Profil mit laufender Periode: bootstrap kopiert nur die Eingaben, papers.jsonl und Textstore bleiben leer; sonst stünden die Paper der Hauptperiode im Monitoring-Store und pdfs lüde deren PDFs

[report]                       # Anzeigeschalter der Seite; Option 01 setzt Quellen und Hinweise je Profil
regression = true              # Option 07: false, wenn es zur Periode keine Wahlbeteiligung gibt (laufende Periode): kein Streudiagramm, keine Tabelle 5, kein Umschalter auf der Karte
monitoring_url = ""            # Option 07: relativer Link auf die Seite der laufenden Periode, auf dem VPS "2025/"; leer = kein Abschnitt, Pages bleibt ohne toten Link

# --- Punkt 46: Klassengrenzen der Varianten "relativ zum Mittel" (docs/skalierung-2026-10.md) -----
[report.diverging]             # vier feste Grenzen je Variante ergeben fuenf Klassen, die mittlere heisst "etwa im Mittel"; Quantile waeren hier dieselbe Einteilung wie bei der Quote, nur anders gefaerbt
district_percent = [-0.25, -0.10, 0.10, 0.25]  # Abweichung der Trefferquote vom Stadtmittel; auf der Referenz 2026-10-13 fuellen sich die Klassen mit 6, 12, 11, 8, 4 Wahlbezirken (Spannweite -57,8 % bis +144,8 %), mit +-20 % oder +-15 % draengt zu viel in die Randklassen
party_points = [-0.02, -0.005, 0.005, 0.02]    # Abweichung eines Parteianteils vom Mittel aller Parteien im Bezirk, als Anteil (mal 100 sind es Prozentpunkte): 23, 67, 64, 72, 20 der 246 Zellen
party_ratio = [0.5, 0.8, 1.25, 2.0]            # Verhaeltnis zum Mittel, log-symmetrisch um 1 (1/2, 1/1,25, 1,25, 2): 61, 32, 60, 78, 15 Zellen; ein Logarithmus geht nicht, 20 Zellen sind exakt 0
