# Standardkonfiguration, stadtneutral: Kommunalwahl 2025 in Nordrhein-Westfalen, Ratsdokumente der
# Wahlperiode 2020–2025. Alles Stadtspezifische (Endpunkte, Spaltennamen, Gremien, Fremddaten,
# Urheber, Ausschlussliste, Lizenzen) steht im Profil der Stadt unter profiles/<slug>.toml; ohne
# --profile gilt default_profile.
# Jede Zahl trägt ihre Begründung. Überschreiben in ./settings.toml oder ./settings.local.toml
# (gitignored, rechnerspezifisch; tiefer Merge, es reicht der geänderte Schlüssel) oder per
# Umgebungsvariable GEOREP_<FELD>, verschachtelt mit __, z. B. GEOREP_SOURCES__OPARL__DELAY_S=2.
# Reihenfolge: Umgebung > settings.local.toml > settings.toml > diese Datei.

data_root = "./data"           # Laufzeitdaten und Zwischenergebnisse, relativ zum Arbeitsverzeichnis; gitignored
cache_root = ""                # leer = <data_root>/cache: PDFs, Texte, HTTP-Cache; bei Konrad auf xtraspace
reference_root = "./reference" # eingefrorener Datensatz der Arbeit; wird nur gelesen
profile = ""                   # Unterordner je Stadt oder Periode unter data_root und cache_root; jedes Profil setzt ihn (eine Stadt ihren Slug, eine Periode ihren Namen), leer heißt flach und ist nur noch die Notlösung von Hand
default_profile = "duesseldorf" # Paketprofil, das ohne --profile und ohne GEOREP_PROFILE gilt (src/georep/profiles/<name>.toml)
contracts = "on"               # "off" schaltet die deal-Verträge ab (deal.disable beim Start); zählt nicht zum Fingerprint
log_level = "INFO"

[period]                       # Wahlperiode zwischen den Kommunalwahlen 2020 und 2025, beide Grenzen einschließlich
start = 2020-09-13
end = 2025-09-14               # end = "" für eine laufende Periode (der tiefe Merge ließe das Datum sonst stehen); dann ist election Pflicht
# election = 2025-09-14        # Wahltag, dessen Ergebnis Nenner und Zuschnitt liefert; Standard: end
label = ""                     # Option 02: Anzeigename der Periode auf der Seite; leer = „Wahlperiode <Startjahr> bis <Endjahr>"
dictionary = "own"             # Option 02: "base" liest Straßen und Orte der Hauptperiode (Profil ""), dann gibt es streets_osm und pois_wiki im Profil nicht

[http]
timeout_s = 180                # der OParl-Server brauchte am 2026-10-09 85 s pro Seite
retries = 5                    # 429 und 5xx mit exponentiellem Backoff
user_agent = "georep/0.2 (+https://github.com/konradvoelkel/geographic-representation-dus)"

[cache]                        # Lebensdauer gecachter HTTP-Antworten in cache_root/http.sqlite, Sekunden; 0 = nie
oparl_pages_s = 3600           # Metadatenseiten ändern sich täglich; eine Stunde hilft beim Entwickeln und Wiederaufnehmen
opendata_s = 2592000           # 30 Tage: Wahlergebnis und Stimmbezirke 2025 ändern sich nicht mehr
wikidata_s = 2592000
wikipedia_s = 2592000
overpass_s = 2592000           # Straßennamen ändern sich langsam; die Referenz stammt vom November 2025

[sources.oparl]
delay_s = 1.0                  # Pause zwischen Seiten und Dateien; der Server ist langsam, nicht wir
stop_when_older = true         # Liste ist neueste zuerst: abbrechen, sobald eine Seite nur noch Paper vor period.start hat (spart 270 von 365 Seiten)
incremental = true             # bei vorhandenem Store nur Paper mit modified_since (letztes modified minus ein Tag) holen
pdf_limit = 0                  # neue PDF-Downloads je Lauf; 0 = alle (`georep fetch pdfs --limit N` setzt es für einen Lauf)
max_pages = 0                  # Option 04: Metadatenseiten je Lauf; 0 = alle (`georep fetch papers --max-pages 1` ist die Probe, ob der Server Urheberfelder liefert)
first_page = 1                 # Option 02: erste Seite des Abrufs; ein Periodenprofil überspringt so die Seiten jüngerer Perioden (2014 bis 2020: ab Seite 90, Stand 2026-10)

[sources.wikidata]
sparql_endpoint = "https://query.wikidata.org/sparql"
wikipedia_api = "https://de.wikipedia.org/w/api.php"
language = "de"
geosearch_limit = 500          # Maximum der Wikipedia-GeoSearch je Bounding Box
delay_s = 1.0                  # Pause zwischen den 306 GeoSearch-Abfragen

[sources.osm]
overpass_endpoint = "https://overpass-api.de/api/interpreter"
delay_s = 1.0                  # Pause zwischen den 306 Polygonabfragen; der öffentliche Server antwortet sonst mit 504
simplify_m = 2.0               # Polygon vorher um 2 m vereinfachen (Douglas-Peucker), damit die Abfrage kurz bleibt
# Das Rechenbudget, das Overpass der Abfrage gibt ([timeout:N] im Kopf), nicht der Netz-Timeout.
# Gemessen am 2026-10-13: mit [timeout:90] wiesen alle vier öffentlichen Instanzen
# (overpass-api.de, lz4, z, maps.mail.ru) dieselbe Stimmbezirksabfrage unter Last nach wenigen
# Sekunden mit 504 ab, mit [timeout:25] antwortete sie in 2 s mit 124 Elementen. Der Server
# schätzt die Kosten vorab und lehnt ab, was sein Slot-Budget überschreitet; ein kleines Budget
# ist für eine Abfrage, die 2 s braucht, also kein Risiko, sondern die Eintrittskarte.
query_timeout_s = 25
# Wiederholungen je Stimmbezirk bei 504 und 429, mit wachsender Pause (delay_s, dann 2x, 4x).
# Nicht http.retries: die Retry-Regel der Session erlaubt GET und HEAD, die Abfrage ist ein POST,
# sie wird dort also nicht wiederholt. Am 2026-10-13 kamen je Versuch rund 27 Abfragen durch,
# bevor der naechste 504 kam; ohne Wiederholung endete damit der ganze Schritt.
retries = 3

[geo]
working_crs = "EPSG:25832"     # metrisch rechnen (ETRS89 / UTM 32N); die Quellgeometrie kommt je Stadt in EPSG:4647 oder EPSG:25832, dasselbe Datum, 4647 mit Zonenpräfix
output_crs = "EPSG:4326"       # Overpass und Wikidata sprechen lon/lat; genau eine Reprojektionsstelle

[search]
hide_in_display = ["schulweg"] # wird aus der Begriffsliste der Auswertung entfernt, zählt aber in den Treffern (Verhalten der Arbeit, Kap. 4.3.5)

# Regel 1 „Einrichtung mit Stadtnamen" (docs/decisions.md Punkt 44a, gemessen in
# docs/methodik-review-2026-10.md): ein Ort aus Wikidata/Wikipedia, dessen Label den Stadtnamen
# des Profils am Ende trägt (die letzten Wörter, so viele wie der Stadtname hat) oder das
# Städteadjektiv irgendwo, ist eine Einrichtung mit stadtweiter Bedeutung und fällt aus dem
# Wörterbuch. Standard an, weil die Benennung in jeder Stadt dieselbe ist; false reproduziert die
# Arbeit exakt (Golden Master). place_words darf dann nicht leer sein, sonst wäre die Regel still
# „Stadtname zuletzt genügt" und träfe jeden Bahnhof mit.
city_facilities = true
# Gattungswörter, die einen Ort an einer Adresse anzeigen: endet ein Wort des Labels auf eines
# von ihnen, bleibt der Ort ein Ort, auch mit Stadtnamen („Düsseldorfer Stadtwald", „Bahnhof
# Düsseldorf-Rath"). Verglichen wird das Wortende, nicht das Vorkommen, weil „park" sonst in
# „Stadtsparkasse" steckt; deutsche Zusammensetzungen tragen ihren Kopf hinten. Stadtneutral,
# aber deutschsprachig: eine Stadt in einem anderen Sprachraum ersetzt die Liste im Profil.
# „halle" und „schule" stehen bewusst nicht darin: sonst bliebe die Tonhalle oder die Hochschule
# einer Stadt ein Ort, und genau das sind die Einrichtungen, um die es geht.
place_words = [
    "bahnhof", "bahnhöfe", "haltepunkt", "bahnsteig", "brücke",       # Verkehrsbauwerke
    "park", "garten", "gärten", "wald", "friedhof", "wiese",          # Grün
    "see", "weiher", "teich",                                         # Wasser
    "platz", "sportplatz", "stadion",                                 # Plätze und Anlagen
    "gymnasium", "gesamtschule", "realschule", "grundschule", "hauptschule", "berufskolleg",
    "krankenhaus", "hospital", "klinik", "klinikum",
]

# Regel 2 „stadtweite Begriffe" (decisions.md Punkt 44): Begriffe, die in auffällig vielen
# Dokumenten stehen, handeln meist nicht von ihrem Wahlbezirk („hofgarten" 172, „schulweg" 144 auf
# der Referenz). Die Seite nennt sie im Abschnitt „Begriffe" mit Dokumentzahl und Wahlbezirk,
# damit Leser die Grenze der Methode sehen; gezählt werden sie weiter, die Regel ändert keine
# Zahl (decisions.md, Punkt 44b). Schwelle ist entweder ein Quantil der Dokumenthäufigkeit oder
# ein Vielfaches des Medians, nie beides; 0 schaltet ab.
citywide_quantile = 0.99       # 1 % der Begriffe; auf der Referenz 55 von 5727 über 64 Dokumenten (ohne Regel 1: 58 von 5841). 0,95 wären 276 Begriffe und damit keine Liste zum Lesen mehr. Die Schwelle ist immer mindestens 1: sonst gilt in einem dünnen Index jeder Begriff mit einem Dokument als stadtweit
citywide_median_factor = 0.0   # Alternative zum Quantil, genau eine der beiden gilt: Vielfaches des Medians. Auf der Referenz ist der Median 1 Dokument, ein Vielfaches davon wäre willkürlich; in einem kleineren Korpus kann es die robustere Schwelle sein

# zählt je Wahlbezirk höchstens einmal (Maximum über seine Begriffe mal Dokumentart mal Thema).
[weights]
combined = ["idf", "antraege_halb"]  # Faktoren der Variante "kombiniert" als Produkt: feste Faktoren "idf", "bezirke" oder ein Regelsatz von unten; leer = keine Zeile

[[weights.paper_type]]         # Regelsatz = eine Variante: geordnete Regex-Regeln auf paper_type (ohne Groß/Klein), die erste passende gewinnt, sonst default
name = "antraege_halb"
label = "Anträge, Anfragen, Eingaben halb"  # nur die Beschriftung der Zeile auf der Seite; zählt nicht zum Fingerprint
default = 1.0
rules = [{ pattern = "^z?(antrag|anfrage|haushaltsantrag|eingabe)", weight = 0.5 }]  # deckt 30 Fraktionsvarianten ("Antrag SPD", "zAnfrage REP") mit einem Präfix; A+F Beschluss und Bedarfsbeschluss bleiben Vorlagen

[[weights.paper_type]]
name = "nur_vorlagen"
label = "nur Verwaltungsvorlagen"
default = 1.0
rules = [{ pattern = "^z?(antrag|anfrage|haushaltsantrag|eingabe)", weight = 0.0 }]  # dieselbe Grenze mit Gewicht null

[topics]                       # Themenmodell: TF-IDF und NMF (scikit-learn) über die Texte; je Thema eine Variante thema_NN
k = 20                         # Zahl der Themen; lesbar auf der Seite, 3,8 s auf 19 033 Texten (2026-10-11); 0 schaltet den Schritt topics ab, 99 ist die Obergrenze (die Varianten heißen thema_NN)
min_df = 5                     # ein Wort zählt erst ab 5 Dokumenten (Tippfehler, seltene Namen fallen weg)
max_df = 0.5                   # ein Wort in mehr als der Hälfte der Dokumente ist ein Formularwort
max_features = 20000           # die häufigsten Wörter; mehr ändert die Themen nicht und kostet Zeit
top_words = 10                 # Wörter je Themenlabel; die Wörter beschreiben das Thema, sie benennen es nicht
stop_words = "de"              # Funktionswörter aus der Paketdatei analysis/stopwords_de.txt (ohne sie entsteht ein Thema aus "auch, oder, sich"); "" = keine
max_iter = 200                 # Obergrenze der NMF-Iterationen; mit tol unten konvergiert das Modell nach 120 (2026-10-12)
tol = 0.001                    # Abbruchschwelle: mit 1e-4 läuft NMF in die Obergrenze (200 Iterationen, 6,9 s; konvergiert erst bei 412 und 13,4 s) und gewinnt dabei 0,03 % Rekonstruktionsfehler; 1e-3 konvergiert nach 120 Iterationen in 4,5 s (gemessen 2026-10-12 auf 19 033 Texten)
random_state = 0               # Startwert für NMF; nndsvda ist deterministisch, der Wert steht trotzdem hier

# Punkt 45 (docs/themenmodell-2026-10.md): woher die Stoppwörter neben der Paketliste kommen.
# "fraktionen" liest Namen, Kürzel und Muster der Parteien, Gruppen und Fraktions-, Gemeinschafts-
# und Personenmarker aus [originators] (Option 04), "gremien" die Kürzel aus [bodies] (Option 05) —
# nur die Kürzel, nicht die Namen: "Verkehrsausschuss" ist ein Themenwort. "namen" nimmt die
# Wörter, die fast nur in einem Namensfenster stehen (unten). Keine zweite Liste: alles steht schon
# im Profil. Ohne die Quellen prägen Fraktions- und Personennamen die Themen (gemessen 2026-10-12
# auf der Referenz: Thema 3 "antrag, gez, fraktion, cdu, grünen", Thema 16 "linke, sönke, voigt,
# julia"); leer = nur die Paketliste, also der Stand von Option 06.
# Aus einem Muster werden die Buchstabenfolgen genommen; Bruchstücke eines Regex ("frak" aus
# "frak\w{0,2}ion") sind harmlos, weil sie allein kein Token bilden.
stop_sources = ["fraktionen", "gremien", "namen"]
# Wörter, die trotz einer Quelle bleiben: das Profil nennt die Sachwörter, die zufällig in einem
# Gruppennamen oder Gremienkürzel stehen ("Klima" in "Die PARTEI-Klima-Fraktion", "BAU" als
# Kürzel des Bauausschusses). Abgezogen wird am Ende von der ganzen Vereinigung, also auch von
# der deutschen Paketliste und von den Namen aus dem Korpus -- wer hier ein Funktionswort nennt,
# holt es zurück ins Vokabular. Genau eine Liste, damit es nicht zwei Wahrheiten gibt.
stop_keep = []
# Fenster, in denen ein Personenname steht: hinter einer Unterschrift oder einer Amtsbezeichnung.
# Deutschsprachig und stadtneutral wie search.place_words; eine Stadt in einem anderen Sprachraum
# ersetzt die Liste im Profil. Die Personenmarker aus [originators] kommen dazu, damit dieselbe
# Liste nicht zweimal gepflegt wird. Ohne die Amtsbezeichnungen bleiben die Namen der Dezernenten
# in den Themen stehen (gemessen 2026-10-12: 196 statt 254 Namen, "jochen", "kral", "doroth").
name_markers = ["gez.", "mit freundlichen grüßen", "oberbürgermeister", "bürgermeister", "beigeordnete", "stadtdirektor", "stadtkämmer", "dezernent", "amtsleiter", "vorsitzende"]
name_window = 60               # Zeichen hinter dem Marker; das letzte, abgeschnittene Wort zählt nicht mit
name_min_documents = 5         # in so vielen Fenstern muss ein Wort stehen; darunter ist es ein Tippfehler der Quelle, kein Name
name_share = 0.8               # und so viel seiner Dokumente müssen Fenster sein: 0,8 trifft 254 Wörter, 0,5 wären 578 und nähme Sachwörter mit (gemessen 2026-10-12)

# Gesäte Themen: je Ausschuss ein Thema, dessen Wortprofil aus den dort beratenen Dokumenten kommt
# (Gremium je Dokument aus Option 05). Die Wortmatrix der gesäten Themen ist fest, die freien
# Themen rechnen auf dem Rest; so tragen die Themen einen Namen statt einer Nummer. Gemessen am
# 2026-10-12 auf der Referenz: 17 gesäte Themen, 71 bis 99 % der Dokumente eines Ausschusses haben
# sein Thema als stärkstes. Mit "none" rechnet die Kette freie NMF wie Option 06.
seed = "committees"
free = 3                       # Themen ohne Saat; sie nehmen auf, was kein Ausschuss erklärt (Anträge, Anfragen, Bauvorhaben)
seed_words = 30                # Saatwörter je Ausschuss, nach Log-Odds mit Dirichlet-Prior gegen die anderen Ausschüsse; 10 davon stehen als Label auf der Seite
seed_min_documents = 10        # ein Ausschuss mit weniger beratenen Dokumenten bekommt kein eigenes Thema (zwei je Faltung im Messskript)
seed_prior = 1000.0            # Stärke des Dirichlet-Priors in Pseudo-Token; dämpft Wörter, die nur ein paar Mal vorkommen

# --- Punkt 45: der passende Ausschuss je Dokument (docs/themenmodell-2026-10.md) -------------------
[classify]                     # TF-IDF (Parameter aus [topics]) und logistische Regression auf den Dokumenten, deren Gremium ein Ausschuss ist
enabled = true                 # false nimmt den Schritt committees aus dem Register; ohne [bodies.committees] fehlt er ohnehin
min_documents = 10             # eine Klasse braucht so viele beratene Dokumente: zwei je Faltung bei fünf Faltungen
min_probability = 0.4          # darunter zählt ein Dokument als querschnittlich und landet in der Restklasse; bei 20 Klassen sind 0,4 das Achtfache des Zufalls (1/20)
regularisation = 1.0           # C der logistischen Regression; kleiner heißt stärker geglättet
max_iterations = 1000          # lbfgs; damit konvergiert das Modell auf der Referenz (2026-10-12)
random_state = 0               # fester Startwert, damit zwei Läufe dieselbe Zuordnung schreiben

# --- Option 03: Kontrollvariablen (docs/plans/03-kontrollvariablen.md) -----------------------------
[crosswalk]                    # Umrechnung eines älteren Zuschnitts auf die Wahlbezirke der Hauptperiode (Profil "")
enabled = false                # true nur in einem Periodenprofil (profiles/duesseldorf-2014.toml): Schritt precincts, Wähler über Flächenanteile der Stimmbezirke
target_file = "Stimmbezirke_2025.geojson"  # Stimmbezirksdatei der Hauptperiode, aus der die Zielbezirke vereinigt werden
precinct_id = ""               # Eigenschaft der Stimmbezirksnummer im Stimmbezirks-GeoJSON der Periode (2020: "Stimmbezchar"); [columns] beschreibt weiter den Zielzuschnitt
district_id = ""               # Eigenschaft der Wahlbezirksnummer in Kommunalwahlbezirke.geojson (2020: "Kommunalwahlbezirk")
district_name = ""             # Eigenschaft des Wahlbezirksnamens dort (2020: "Name")
min_coverage = 0.95            # kleinste zulässige Abdeckung einer Quellfläche durch die Zielbezirke; 2020 auf 2025 liegt sie bei 97,8 % bis 100 % (Stadtgrenze, Rhein), weniger heißt falsches CRS
min_share = 1e-9               # Punkt 51: kleinster Anteil der Quellfläche, der als Schnittstück zählt; darunter gilt ein Schnittstück als Splitter aus der Fließkomma-Arithmetik (zwei Flächen mit gemeinsamer Grenze schneiden sich nicht in 0, sondern in etwa 4,44e-16) und fällt vor der Normierung weg. Ein Anteil, also dimensionslos und unabhängig von der Einheit der Karte; 1e-9 eines Stimmbezirks sind auf der Referenz rund 3 cm². 0 schaltet die Schwelle ab

[compare]                      # Vergleich zweier Perioden, Schritt compare auf der Hauptperiode
period = ""                    # Profil der älteren Periode (Ordner unter data_root); leer = kein Vergleich; profiles/duesseldorf-vergleich.toml setzt "2014-2020"
label = ""                     # Anzeigename der älteren Periode in der Vergleichstabelle und auf der Seite; leer = der Profilname

# --- Option 07: Monitoring der laufenden Wahlperiode (profiles/duesseldorf-2025.toml setzt sie)
[bootstrap]
seed_corpus = true             # false in einem Profil mit laufender Periode: bootstrap kopiert nur die Eingaben, papers.jsonl und Textstore bleiben leer; sonst stünden die Paper der Hauptperiode im Monitoring-Store und pdfs lüde deren PDFs
texts = ""                     # Punkt 68: Pfad eines Textpakets aus `georep pack --texts`, dessen Store nach dem Füllen den der Referenz ersetzt -- für eine Periode, deren Paper aus einem älteren Datensatz kommen und deren Texte ein eigener Lauf neu gelesen hat. Übernommen wird es nur, wenn es genau die Hauptdateien dieser Paper trägt, sonst bleiben die Texte der Referenz (mit einer Zeile im Bericht). Stadtneutral leer = die Texte der Referenz
raw_texts = ""                 # Fundament F1: Pfad eines Rohtextpakets aus `georep pack --raw-texts`, das bootstrap als Rohtextstore anlegt (cache/<profil>/text/rohtexte.parquet) -- damit eine Kette ohne PDFs (GitHub Pages) den Rohtext trotzdem hat. Übernommen wird es nur, wenn jeder Name eine Hauptdatei der Paper dieses Datensatzes ist. Der Schlüssel steht hier und nicht in einem Block am Ende, weil TOML [bootstrap] nur einmal erlaubt. Stadtneutral leer = kein Paket

[report]                       # Anzeigeschalter der Seite; Option 01 setzt Quellen und Hinweise je Profil
page_budget_bytes = 1000000    # Punkt 50: so viele Byte darf index.html haben. Der Schritt report sagt es, wenn die Seite darueber liegt, und der slow-Test liest dieselbe Zahl; 0 schaltet die Pruefung ab. 1,0 MB nach dem Nachladen der Begriffslisten (vorher 1,5 MB bei 1,28 MB Seite): die Luft ist knapp gewaehlt, weil die Seite in zwei Tagen um 594 KB gewachsen ist, ohne dass ein Test gezuckt haette (docs/seitengroesse-2026-10.md, § 7)
table_preview_rows = 3         # Punkt 48: so viele Zeilen zeigt eine lange Tabelle, dann kommt die Schaltflaeche "alle n Zeilen zeigen". Zwei wirken mit Kopfzeile gedraengt, fuenf sind schon eine halbe Seite; 0 oder eine Zahl ueber der Zeilenzahl heisst "nichts einklappen" (docs/seitengroesse-2026-10.md, § 3)
regression = true              # Option 07: false, wenn es zur Periode keine Wahlbeteiligung gibt (laufende Periode): kein Streudiagramm, keine Tabelle 5, kein Umschalter auf der Karte
monitoring_url = ""            # Option 07: relativer Link auf die Seite der laufenden Periode, relativ zur Stadtseite ("2025/"); leer = kein Abschnitt. Stadtneutral leer, weil nicht jede Stadt eine laufende Periode fortschreibt; Duesseldorf setzt ihn im Profil, seit snapshots/2025 im Repo liegt und Pages die Unterseite baut (Punkt 56, 2026-10-14). Ein Periodenprofil setzt ihn wieder leer, sonst zeigte eine Unterseite auf sich selbst oder ins Nichts

# --- Punkt 46: Klassengrenzen der Varianten "relativ zum Mittel" (docs/skalierung-2026-10.md) -----
[report.diverging]             # vier feste Grenzen je Variante ergeben fuenf Klassen, die mittlere umschliesst das Mittel (der Validator prueft das); Quantile waeren hier dieselbe Einteilung wie bei der Quote, nur anders gefaerbt. Achtung: [report] zaehlt nicht zum Settings-Fingerprint, darum meldet georep status den Schritt report nach einer geaenderten Grenze als "aktuell" -- die Seite braucht dann ein georep run report --force (STATUS.md, "Bekannt")
district_percent = [-0.25, -0.10, 0.10, 0.25]  # Abweichung der Trefferquote vom Stadtmittel; auf der Referenz 2026-10-13 fuellen sich die Klassen mit 6, 12, 11, 8, 4 Wahlbezirken (Spannweite -57,8 % bis +144,8 %), mit +-20 % oder +-15 % draengt zu viel in die Randklassen
party_points = [-0.02, -0.005, 0.005, 0.02]    # Abweichung eines Parteianteils vom Mittel aller Parteien im Bezirk, als Anteil (mal 100 sind es Prozentpunkte): 23, 67, 64, 72, 20 der 246 Zellen
party_ratio = [0.5, 0.8, 1.25, 2.0]            # Verhaeltnis zum Mittel, log-symmetrisch um 1 (1/2, 1/1,25, 1,25, 2): 61, 32, 60, 78, 15 Zellen; ein Logarithmus geht nicht, 20 Zellen sind exakt 0

# --- Fundament F6: OParl Sitzungen und Personen (docs/runbook-sitzungen.md) -------------------------
[council]                      # drei Listen des OParl-Bodys, je ein Netzschritt; Ausgaben unter raw/ (meetings, agenda_items, consultations, persons, memberships als JSONL)
enabled = false                # Schalter der drei Schritte: aus, bis Konrad den vollen Abruf startet (docs/runbook-sitzungen.md, § 5; in settings.local.toml oder als GEOREP_COUNCIL__ENABLED=true). Ohne ihn fehlen die Schritte, auch in einem bloßen georep fetch
meetings_endpoint = ""         # Liste der Sitzungen mit eingebetteter Tagesordnung (Schritt meetings); leer = der Schritt fehlt. Stadtneutral leer, das Profil nennt den Endpunkt
consultations_endpoint = ""    # Liste der Beratungen (Schritt consultations): Paper, Sitzung, Tagesordnungspunkt, Rolle. Damit verbindet sich ein Paper mit seinem Ergebnis, ohne die Paper neu abzurufen
persons_endpoint = ""          # Liste der Personen mit eingebetteten Mitgliedschaften (Schritt persons); Kontaktdaten liest das Modell nicht. Die Liste memberships braucht es nicht, ihre Objekte sind dieselben
incremental = ["consultations"]  # Schritte, die bei vorhandenem Bestand nur Geändertes holen (modified_since = jüngstes modified minus ein Tag). Nicht meetings und persons: ihr modified folgt den eingebetteten Objekten nicht (gemessen 2026-11-23: 69 von 314 Sitzungen mit jüngerem Tagesordnungspunkt, bis 245 Tage; 91 von 198 Personen mit jüngerer Mitgliedschaft), ein Lauf mit Filter verpasste nachgetragene Ergebnisse
stop_when_older = true         # Sitzungen: den Abruf beenden, sobald eine Seite nur noch lange vor period.start angelegt wurde (created_margin_days); behalten wird ab period.start ohne Obergrenze, weil eine Vorlage vom Periodenende oft erst danach beraten wird
created_margin_days = 500      # die Liste ist nach Anlage sortiert (ID absteigend), nicht nach Beginn; start minus created reichte am 2026-11-23 in 400 Sitzungen von -418 bis +447 Tagen. Liegt das jüngste created einer Seite mehr als 500 Tage vor period.start, beginnen ihre Sitzungen und die aller späteren Seiten vor der Periode. Ein Abbruch nach der ersten Seite ganz vor dem Beginn (die alte Regel) verlöre früh angelegte Sitzungen hinter einer nachgetragenen alten


# --- Fundament F4: Validierung (docs/validierung.md) -----------------------------------------------
[validation]                   # Codebuecher und Labels im Repo, Kodierauftraege lokal; zaehlt nicht zum Fingerprint
root = "validierung"           # je Vorhaben ein Ordner mit codebuch.toml, stichprobe.csv, labels.csv, README.md, guete.json; relativ zum Arbeitsverzeichnis wie reference_root
coding_root = ""               # Kodierauftraege und Antworten der Agenten, je Vorhaben ein Ordner; sie tragen Text aus Ratsdokumenten und gehoeren nie ins Repo. Leer = <data_root>/kodierung (gitignored); rechnerspezifisch gehoert der Ordner in settings.local.toml (bei Konrad messdaten/kodierung auf xtraspace)
min_alpha = 0.8                # Krippendorffs alpha zwischen den beiden Kodier-Agenten, das Stufe 3 verlangt (plan-vorverarbeitung-2026-11.md, § 2.6); darunter ist das Codebuch zu unscharf, und das Vorhaben geht zurueck in Stufe 1

# --- Fundament F5: Modelle (docs/plan-vorverarbeitung-2026-11.md, § 7; docs/decisions.md, Modellnaht)
[ml]                           # lokale Modelle ueber einen ollama-Server; Schritte mit Modell laufen nur mit `georep run --models`, sonst kommt ihr Ergebnis aus einem Paket. Nichts aus [ml] steht im Settings-Fingerprint: was ein Ergebnis bestimmt (Modell, Digest, Optionen, Fenster), steht als Kennung im Stamp des Modellschritts, dazu die offenen Eingaben eines Teillaufs
base_url = "http://localhost:11434"  # der lokale Server (`ollama serve`). Kein externer Dienst: die Dokumente verlassen den Rechner nicht (Plan § 2.8); ein Host, der nicht localhost oder eine Loopback-Adresse ist, braucht allow_remote. Die Session des Backends liest keine Proxys aus der Umgebung
allow_remote = false           # true schaltet einen Modellserver auf einem anderen Rechner frei; nur ausdruecklich und nur fuer Daten, die den Rechner verlassen duerfen
timeout_s = 300.0              # je Anfrage; ein 27-B-Modell braucht beim ersten Aufruf rund 10 s zum Laden, eine Antwort mit 512 Token bei 33 Token/s rund 16 s (gemessen 2026-11-23). Ein Lese-Timeout wird nicht wiederholt
retries = 2                    # Wiederholungen bei 408, 409, 425, 429, 5xx und abgelehnter Verbindung, wenn der Server schon einmal antwortete; Pause backoff_s, dann das Doppelte. Ein fehlender Server wird einmal ohne Wiederholung gefragt; ein Lese-Timeout, 400, 413, 422 (Abweisung), 401, 403 (Zugriff) und 404 kommen sofort heraus
backoff_s = 2.0
keep_alive = "10m"             # so lange haelt ollama ein Modell nach dem letzten Aufruf im Grafikspeicher; Laufzeit
batch_size = 32                # Texte je Einbettungsaufruf und je Transaktion im Modellcache. Laufzeit: ein anderer Stapel kann die letzten Bits einer Einbettung aendern, doch was im Cache liegt, wird nicht neu gerechnet
limit = 0                      # hoechstens so viele neue Eingaben je Stapellauf, also je Aufruf von embed_texts oder generate_texts (ein Schritt mit zwei Stapellaeufen rechnet bis zu zweimal so viele); 0 = alle. `georep run --models --limit N` setzt es fuer einen Lauf; was offen bleibt, steht im Stamp des Schritts, und `georep status` zeigt ihn danach als offen
retry_rejected = false         # true: Eingaben, die das Modell einmal abwies (4xx, Grund im Modellcache), erneut fragen; sonst ueberspringt jeder Lauf sie, und der Schritt gilt mit ihnen als aktuell ("aktuell, n Eingaben abgewiesen"). `georep run --models --retry-rejected` setzt es fuer einen Lauf

[ml.embedding]                 # Vorhaben 18
model = "nomic-embed-text-v2-moe"  # mehrsprachig, 475 M Parameter, F16, 958 MB; ohne Tag heisst es :latest
dimension = 768                # Laenge jedes Vektors; eine Antwort mit anderer Laenge ist ein Fehler
num_ctx = 512                  # Fenster in Token: das Modell liest hoechstens 512 (context_length laut /api/show), laengere Texte schneidet ollama hinten ab. Wer mehr braucht, zerteilt den Text vorher. Fenster und truncate stehen im Cache-Schluessel und in der Kennung des Schritts
truncate = true                # false: ein Text ueber dem Fenster ist ein Fehler des Servers statt still abgeschnitten (der Stapellauf merkt ihn sich als abgewiesen und fragt ihn nicht wieder, ausser mit retry_rejected)

[ml.generation]                # Vorhaben 19 und 20; ein Vorhaben darf in seinem Block ein anderes Modell nennen, die Optionen kommen von hier
model = "qwen3.6:27b"          # 27,8 B Parameter, Q4_K_M, 17,4 GB auf der Platte, mit num_ctx = 8192 aber 22,9 GB Grafikspeicher (/api/ps, 2026-11-23): das Einbettungsmodell passt NICHT daneben in 24 GB, ollama laedt um. Einbettung und qwen nacheinander, nicht zugleich
temperature = 0.0              # mit festem seed je Rechner reproduzierbar
seed = 0
num_ctx = 8192                 # Fenster in Token (Prompt und Antwort); qwen3.6 koennte 262 144, aber der Speicher je Token waechst mit
num_predict = 512              # hoechstens so viele Token Antwort; eine Antwort, die daran stoesst, liegt markiert im Modellcache (truncated), der Stapellauf zaehlt sie, und der Schritt entscheidet, ob er sie verwirft
think = false                  # die Denkspur von qwen3.6 und gemma4 aus: sie kostet Token und steht nicht in der Antwort. Nur Modelle mit der Faehigkeit "thinking" bekommen den Schalter; true bei einem anderen ist ein Fehler

# --- Vorhaben 15: Dokumentfunktion und gemeinsame Anträge (docs/plans/15-funktion.md) -------------
[functions]                    # Funktion je Ratsdokument (Schritt functions) und Antragsteller je Fraktionsdokument (Schritt cosponsors). Hier steht nur die Sprache der Ratsdokumente, an beiden Stadtprofilen ohne Änderung gemessen (Messdokument § 3.3); Dokumentarten, Sammelarten mit ihren Textregeln, Briefkopf und Fraktionen aus mehreren Parteien stehen im Stadtprofil. Alle Muster kleingeschrieben, eine Liste ist eine Alternative
enabled = false                # Schalter beider Schritte; ein Stadtprofil schaltet ihn ein, wenn es die Tabellen trägt. Ohne Urheber (Option 04, [originators]) fehlen beide Schritte ohnehin
variant = "B"                  # B liest den Beschlusstext eines Antrags (Erklärung -> symbol) und zählt den Berichtsantrag als Kontrolle; gewählt nach der Kodierung (kappa 0,905 gegen A 0,829, Messdokument § 5). A bleibt als Schalter
head_chars = 700               # Textkopf, in dem die Regeln der Sammelarten suchen (Instrumentwort, Kenntnis gegen Beschluss, Briefkopf)
wide_chars = 3000              # zweiter Blick in eine Sammelart der Verwaltung, wenn Kopf und Titel nichts sagen
decision_chars = 1200          # Variante B: so viel Beschlusstext eines Antrags wird gelesen
letterhead_chars = 240         # Fenster hinter dem Briefkopf, in dem der Verfasserblock steht (dahinter folgt der Betreff)
types = {}                     # paperType (ganzer Wert) -> "funktion/instrument"; im Stadtprofil
type_prefixes = {}             # Präfix der Dokumentart (klein) -> "funktion/instrument", längstes zuerst; im Stadtprofil
collection_political = []      # Sammelarten der Politik: Titel, dann das erste Instrumentwort im Textkopf; im Stadtprofil
collection_admin = []          # Sammelarten der Verwaltung: Kenntnisnahme gegen Entscheidung; im Stadtprofil
# Symbolpolitik: eine Erklärung des Gremiums, die keine Sache der Stadt entscheidet (Resolution,
# Appell, Solidarität, Verurteilung, Bündnisbeitritt). Macht nur eine Initiative aus der Politik
# zum Symbol; eine Informationsvorlage „Resolution zur Stärkung der Kommunalfinanzen" bleibt
# Information, eine Anfrage zu einer Resolution Kontrolle (Messdokument § 3.1, Schritt 4).
symbol_title = [
    'resolution', '(?<![a-zäöüß])appell', 'solidarität mit', 'verurteil', 'bekennt sich', 'gegen hass',
    'sichere[rn]? häfen?', 'seebrücke', 'mayors for peace', 'städtebündnis', 'städte-?koalition',
]
request_title = ['(?<![a-zäöüß])(z?anfrage|nachfrage|rückfrage)']  # Anfrage im Titel einer Sammelart: Kontrolle, wenn kein Antrag daneben steht
motion_title = ['(?<![a-zäöüß])(änderungs-?|ergänzungs-?|haushalts-?|haushaltsbegleit|prüf|dringlichkeits-?|zusatz-?)?antrag']
followup_title = ['nachfrage', 'rückfrage', 'zusatzfrage', 'folgeanfrage']  # Instrument Nachfrage statt Anfrage
amendment_title = ['änderungs-?\s?antrag', 'ergänzungs-?\s?antrag', 'zusatzantrag', 'änderungs- und ergänzungsantrag']
budget_motion_title = ['haushalts(begleit)?-?antrag']
review_title = ['prüfauftrag', 'prüf-?antrag', '(?<![a-zäöüß])prüfung (der|des|von|einer|eines|ob)', 'zu prüfen']  # Schreibfehler einer Quelle ergänzt das Stadtprofil
# Berichtsantrag: ein Antrag, der nur Auskunft verlangt. Variante B zählt ihn als Kontrolle; die
# Kodierung las sieben von zehn so (Messdokument § 4.1).
report_title = ['sachstand', '(?<![a-zäöüß])bericht(?!s?vorlage)(?!igung)', 'berichterstattung']
not_instruments = ['bauantrag', 'bauvoranfrage', 'voranfrage', 'zuwendungsantrag', 'förderantrag', 'förderungsantrag', 'bürgerantrag']  # Wörter auf -antrag/-anfrage, die kein Instrument des Gremiums sind
# Variante B: der Beschlusstext eines Antrags erklärt eine Haltung oder fordert Bund und Land auf
# (Symbol), oder er verlangt nur einen Bericht (Kontrolle).
symbol_text = [
    '(rat|bezirksvertretung|ausschuss|integrationsrat)[^.]{0,80}?(verurteilt|appelliert|bekräftigt|bekennt sich|solidarisiert sich|erklärt (seine|ihre) (volle )?solidarität|fordert [^.]{0,40}?(bundes|landes)regierung|fordert [^.]{0,30}?(den bund|den bundestag|den landtag|das land))',
]
report_text = ['(gebeten|beauftragt|aufgefordert)[^.]{0,120}?(zu berichten|bericht zu erstatten|sachstandsbericht|einen bericht)']
# Autorenteil eines Titels: vom ersten Instrumentwort bis zum ersten Trenner. Was davor oder dahinter
# steht, ist Gegenstand oder Bezug („Änderungsantrag der SPD-Ratsfraktion zum Antrag der
# Ratsfraktionen von CDU und Grünen" stellt nur die SPD, Messdokument § 3.8).
author_start = ['(?<![a-zäöüß])(?:[a-zäöüß]*antrag|[a-zäöüß]*anfrage|resolution|äa)(?![a-zäöüß])']
author_stop = [':', ';', ' zu[mr]? ', ' zu der ', ' hier', ' vom ', ' betr', ' bzgl', ' wegen ', ' - ', ' – ']
text_instrument = []           # Instrumentwörter im Textkopf einer Sammelart der Politik; im Stadtprofil
text_words = []                # erstes passendes Instrumentwort -> "funktion/instrument"; im Stadtprofil
text_notice = []               # Kenntnisnahme im Textkopf einer Sammelart der Verwaltung; im Stadtprofil
text_decision = []             # Entscheidung im Textkopf; das erste Merkmal gewinnt; im Stadtprofil
text_decision_head = []        # eine Überschrift, die eine Entscheidung ankündigt; im Stadtprofil
title_information = []         # Titel einer Sammelart der Verwaltung, der eine Information nennt; im Stadtprofil
title_decision = []            # dito eine Entscheidung; im Stadtprofil
letterhead = []                # Briefkopf eines Dokuments aus der Politik in einer alten Vorlagenform; im Stadtprofil
letterhead_end = []            # Ende des Verfasserblocks dahinter (Gremium, Anrede, Datum); im Stadtprofil
fractions = []                 # [[functions.fractions]]: eine Fraktion aus mehreren Parteien mit Zeitraum; im Stadtprofil

# Vollzug: was eine Beschlussvorlage entscheidet, nur als Instrument (Unterart); die erste Regel
# mit Treffer im Titel gewinnt, sonst das Instrument der Tabelle.
[[functions.enforcement]]
instrument = "haushalt"
patterns = ['haushaltssatzung', 'haushaltsplan', 'nachtragshaushalt', 'jahresabschluss', 'gesamtabschluss', 'wirtschaftsplan', 'stellenplan']
[[functions.enforcement]]
instrument = "satzung"
patterns = ['satzung', 'ordnung der', 'gebührenordnung', 'verordnung']
[[functions.enforcement]]
instrument = "bauleitplanung"
patterns = ['bebauungsplan', 'flächennutzungsplan', '(?<![a-zäöüß])plan nr', 'vorhabenbezogene']
[[functions.enforcement]]
instrument = "besetzung"
patterns = ['(?<![a-zäöüß])(neu|nach|um)?wahl (von|der|des|eines|einer|zum|zur)', 'bestellung (von|eines|einer|der|des)', 'benennung', 'entsendung', 'abberufung', 'besetzung']
[[functions.enforcement]]
instrument = "dringlichkeit"
patterns = ['dringlichkeitsentscheidung', 'dringliche[rn]? entscheidung', 'dringlichkeitsbeschluss']  # was ein Land eigens nennt (in NRW der Beschluss nach § 60 GO), ergänzt das Stadtprofil

# --- Vorhaben 15: Ratsmehrheiten, stadtweit (docs/plans/15-funktion.md, § 3.9 und § 10) ----------
[majorities]                   # die Mehrheit im Rat je Zeitraum, mit Vereinbarung (Vorhaben 25) und Belegen im Korpus; eine Annahme, die das Lager eines Fraktionsdokuments trägt (Schritt cosponsors) und die 24 und 28 mitlesen. Stadtneutral leer: ohne Zeile hat kein Dokument ein Lager
body_kinds = ["rat", "ausschuss"]  # Gremienarten (gremium_art), in denen die Mehrheit des Rates gilt; die Bezirksvertretungen haben eigene Mehrheiten, die im Datensatz nicht stehen (Vorhaben 27)
terms = []                     # [[majorities.terms]] im Stadtprofil: period, parties, valid_from, valid_to, agreement, agreement_date, evidence

# --- Vorhaben 14: Vorgänge (docs/plans/14-vorgaenge.md, § 6 und § 10)
[procedures]                   # Kanten zwischen Drucksachen, Vorgänge als Baum, Antworten auf Anfragen; gebaut ist die Rückfallregel (Messdokument § 5.1): stark nur aus Titel, Anlagenname, Nachtragsnummer und Sammelbericht, reine Textverweise bleiben schwach (die Regelfassung .2 trug an der Bestätigung nur 0,850, die Rückfallregel 104 von 106). Formen der Nummer, Dokumentarten, Antwortanlagen und Pakete stehen im Stadtprofil, kein Stadtwort im Code
enabled = false                # ein Stadtprofil schaltet ein, wenn es Formen und Dokumentarten nennt; ohne Schalter fehlen die Schritte references und procedures
max_code_length = 6            # ein unbekanntes Kürzel vor einer Nummer ist höchstens so lang; länger ist es ein Wort („vorlage 61/ 12/2014"), sonst standen 6 801 Scheintreffer „ORLAGE" unter den unbekannten (Messdokument § 3.1)
amendment_markers = 'änderungsantrag|ergänzungsantrag|zur vorlage|zu vorlage|zur drucksache|zur beratungsvorlage|zu beratungsvorlage|zu top|zum tagesordnungspunkt'  # Typ aenderung nur mit einem Änderungszeichen im Titel der nennenden Drucksache oder kurz vor einer Fundstelle (Typen .2, Messdokument § 3.9); ohne Zeichen ist dieselbe Kante bezug
amendment_window = 120         # so viele Zeichen vor einer Fundstelle in Text oder Anlagennamen zählen für das Änderungszeichen (§ 3.9)
interim_attachment = 'zwischen'  # eine Zwischennachricht ist keine Antwort (fünf unter den Anlagen der Anfragen, § 3.6)
collective_titles = 'beschlusskontrolle|veränderungsverzeichnis|ergebnis der haushaltsberatungen|stand der umsetzung|umsetzungsstand|erledigung'  # Sammelberichte (R3, Messdokument § 3.9): eine Verwaltungsvorlage mit einem dieser Titelwörter hält jeden Verweis stark, als Typ kontrolle. Verwaltungsdeutsch und keine Stadt: so heißen sie in Düsseldorf (Beschlusskontrolle) und in Mönchengladbach („Nachweis deren Erledigung", „Umsetzungsstand der im Rat beschlossenen Fraktionsanträge"), und die Rückfallregel ist an beiden gemessen
answer_attachment = ''         # Stadtprofil: Muster im Namen einer Anlage, die die Antwort auf eine Anfrage ist; leer = keine Antwortanlagen
attachment_dates_invalid = []  # Stadtprofil: Anlagendaten, die kein Antwortdatum sind (der Umstellungstag eines Ratsinformationssystems)
attachments = ''               # Paket mit den Anlagen je Drucksache (`georep pack --attachments`); bootstrap kopiert es nach raw/anlagen.parquet. Leer = keine Anlagen: dann gibt es weder Anlagenkanten noch Antwortanlagen
person_titles = 'Herrn?|Frau|Ratsherrn?|Ratsfrau|(?:Ober|Bezirks)?[Bb]ürgermeister(?:in)?|Dr\.|Prof\.'  # Review K1 (2026-11-24): Anrede oder Titel vor einem Namen. `pack --attachments` ersetzt den Namen dahinter (ein, zwei groß geschriebene Wörter) durch „…“, damit das Paket keine Namen trägt, die der Name einer Anlage nennt („Schreiben von Herrn … vom …“). „OB“ steht nicht darin: in den Anlagennamen folgt ihm nie ein Name, sondern ein Gegenstand oder eine Anschrift („OB Graf-Engelbert-Straße 29-33“). Leer = nichts maskieren

# Der Titel schlägt die Dokumentart, wo beide sich widersprechen („Antrag der Ratsfraktionen …" als
# Anfrage eingestellt: 8 Dokumente, umgekehrt 19; Messdokument § 3.9). Gelesen am Anfang des
# kleingeschriebenen Titels ohne führende Leerzeichen und Doppelpunkte; die erste Regel gilt.
[[procedures.title_overrides]]
role = "anfrage"
title = '(antrag|änderungsantrag|ergänzungsantrag)'
to = "antrag"
[[procedures.title_overrides]]
role = "antrag"
title = 'anfrage'
to = "anfrage"

# --- Vorhaben 12: Kennungen und Beträge (docs/plans/12-kennungen.md, § 6 und § 10) ---------------
[identifiers]                  # Spannen im Rohtext (F1, F3): Bauleitplanung und Betrag in Fassung 1, Termin und Verwaltungseinheit in Fassung 2 der Messung, so wie validiert (Messdokument § 4 und § 5). Hier steht die Sprache der Ratsdokumente, an beiden Stadtprofilen gemessen (§ 3.4); Nummernformate und Kopffelder stehen im Stadtprofil. Muster sind reguläre Ausdrücke mit Groß- und Kleinschreibung, eine Liste ist eine Alternative
enabled = false                # Schalter des Schritts identifiers; ein Stadtprofil schaltet ihn ein
kinds = ["bplan", "fnp", "betrag", "termin", "amt", "dezernat"]  # die Arten, die das Kriterium erreicht haben (§ 5); Haushalt und Rechtsgrundlage fielen

[identifiers.plans]            # Art 1: „Bebauungsplan Nr. 03/017", „Flächennutzungsplanänderung Nr. 178"; die Spanne ist nur die Nummer. Präzision 1,000 (n 100), Recall 64/71 (§ 4.1)
keyword = '(?:[Vv]orhabenbezogene[nrs]?[ \t]+)?(?:Bebauungspl(?:an|äne)\w*|B-?Pl(?:an|äne)\w*|(?:Fluchtlinien|Durchführungs)pl(?:an|äne)\w*)(?:[ \t]*[-–]?[ \t]*(?:Vor)?[Ee]ntwurf(?:s|es)?|[ \t]*[-–]?[ \t]*Vorentwurf(?:s|es)?)?'  # Schlüsselwort eines Bebauungsplans; „vorhabenbezogener Bebauungsplan-Vorentwurf"
number = ""                    # Nummernformat der Stadt; im Stadtprofil. Leer: keine Bebauungspläne
norms = []                     # [[identifiers.plans.norms]] im Stadtprofil: Schreibweise -> Normalform; ohne passende Regel ohne Leerraum und groß
list_words = ',|und|sowie|bzw\.|oder'  # Liste nach einer Nummer: „Nr. 5481/006 und 5481/007" sind zwei Pläne
number_word = '(?:Nr\.?|Nrn\.|Nummer|No\.)[ \t]*:?'  # „Nr.", „Nummer:" zwischen Schlüsselwort und Nummer
fnp_keyword = '(?:Flächennutzungsplan(?:es|s)?[ \t]*[-–]?[ \t]*[Ää]nderung(?:en|s)?|Flächennutzungsplanänderung(?:en)?|FNP[ \t]*[-–]?[ \t]*[Ää]nderung(?:en)?|FNP)'  # „FNP-Änderung 138", in Anlagenlisten „FNP 194"
fnp_draft = '\((?:Vor)?[Ee]ntwurf\)'  # „Flächennutzungsplanänderung (Entwurf) Nr. 188"
fnp_ordinal = '(?P<n>\d{1,3})\.[ \t]*[Ää]nderung[ \t]+des[ \t]+Flächennutzungsplan(?:es|s)?'  # „die 188. Änderung des Flächennutzungsplans"

[identifiers.amounts]          # Art 3: Euro-Beträge ohne Rolle (die Rolle fiel, Übereinstimmung 0,508, § 4.1); Norm in Euro mit zwei Nachkommastellen. Präzision 0,962, Recall 84/88 (§ 4.1)
units_after = ['€', '(?i:euro?)\b', 'TEUR\b', 'T€', 'T[ \t]?EUR\b']  # „5.000 Euro", „82.000 EUR", „300 T€"
units_before = ['€', 'EUR\b']  # „EUR 2.700", „€ 40.000" (Fassung 1: „Euro" vorn und über den Zeilenwechsel kamen erst mit Fassung 2, die nicht bestand)
thousand_units = ['T€', 'TEUR']  # Einheiten in Tausend Euro, ohne Leerzeichen und groß verglichen: „300 T EUR" = 300 000 €
range_words = 'bis(?:[ \t]+zu)?|und|-|–'  # „5.000 bis 10.000 Euro": die erste Zahl erbt Einheit und Faktor der zweiten
per_words = '/|pro|je'         # „12,50 €/m²", „150 Euro je Kind": Preis je Einheit, attr = je
per_units = ['m²', 'm2', 'qm', 'Quadratmeter', 'Monat', 'Jahr', 'Stunde', 'Std\.', 'Tag', 'Woche', 'Person', 'Kopf', 'Einwohner\w*', 'Kind', 'Platz', 'Teilnehm\w*', 'Nacht', 'Stück', 'Fahrt', 'Ticket', 'Kilometer', 'km', 'Meter', 'Haushalt', 'Schüler\w*', 'Fall', 'Mitglied', 'Wohnung', 'Einheit', 'Monatskarte', 'Abo', 'Termin']

[[identifiers.amounts.multipliers]]  # Faktor zwischen Zahl und Einheit; die Folge ist die der Alternative
pattern = 'Mio\.?|Millionen|Million'   # „2,5 Mio. €"
factor = 1000000
[[identifiers.amounts.multipliers]]
pattern = 'Mrd\.?|Milliarden|Milliarde'  # „1,2 Mrd. Euro"
factor = 1000000000
[[identifiers.amounts.multipliers]]
pattern = 'Tsd\.?|Tausend'     # „40 Tsd. €"
factor = 1000

[identifiers.dates]            # Art 4: Zeitangaben ohne Funktion (die Funktion frist fiel, Präzision 15/30, § 5). Norm nach Codebuch .2: 2024-03-31, 2024-03, 2024-Q3, 2024-H1, 2024~ende, 2021-02~ende, relativ:naechste_sitzung. Präzision 1,000 an 30 Treffern der Runde 2 (§ 4.4)
quarter = 'Quartal'            # „3. Quartal 2024", „III. Quartal 2024"
half_year = 'Halbjahr'         # „1. Halbjahr 2024"
month_qualifiers = ['Anfang', 'Mitte', 'Ende']  # „Ende Februar 2021" -> 2021-02~ende
year_qualifiers = ['Anfang', 'Mitte', 'Ende', 'Frühjahr', 'Frühling', 'Sommer', 'Herbst', 'Winter', 'Jahresende', 'Jahresmitte']  # „Ende 2024" -> 2024~ende, „Frühjahr 2023" -> 2023~fruehjahr
qualifier_norms = { jahresende = "ende", jahresmitte = "mitte", fruehling = "fruehjahr" }  # Umschrift (ä -> ae) eines Zusatzes, der dasselbe meint wie ein anderer
of_the_year = 'des[ \t\n]+Jahres'  # „Ende des Jahres 2023"
range_words = 'und|bis(?:[ \t]+(?:zum|einschließlich))?|-|–'  # „10. und 11. Juni 2023", „22. April bis einschließlich 2. Mai 2025": die erste Angabe ist eine eigene Spanne und erbt Monat und Jahr (R10)

[identifiers.dates.months]     # Monatsname als Muster -> Monat; die Folge ist die der Alternative
"Januar" = 1
"Februar" = 2
"März" = 3
"April" = 4
"Mai" = 5
"Juni" = 6
"Juli" = 7
"August" = 8
"September" = 9
"Oktober" = 10
"November" = 11
"Dezember" = 12
'Jan\.' = 1
'Feb\.' = 2
'Mär\.' = 3
'Apr\.' = 4
'Jun\.' = 6
'Jul\.' = 7
'Aug\.' = 8
'Sept?\.' = 9
'Okt\.' = 10
'Nov\.' = 11
'Dez\.' = 12

[[identifiers.dates.relative]] # eine Zeitangabe ohne Datum; die Folge zählt: eine frühere Regel belegt die Stelle
norm = "relativ:naechste_sitzung"  # „in der nächsten Sitzung", „bis zur nächsten Sitzung" (Spanne ohne „bis zur")
pattern = '(?:(?:in|zu|auf)[ \t\n]+(?:der|einer|den)[ \t\n]+(?:der[ \t\n]+)?|(?<=zur[ \t])|(?<=zur\n))(?:nächsten|kommenden|folgenden|übernächsten)[ \t\n]+Sitzung(?:en)?'
[[identifiers.dates.relative]]
norm = "relativ:nach_sommerpause"
pattern = 'nach[ \t]+der[ \t]+Sommerpause(?:[ \t]+(?:19|20)\d{2})?'
[[identifiers.dates.relative]]
norm = "relativ:vor_sommerpause"
pattern = 'vor[ \t]+der[ \t]+Sommerpause(?:[ \t]+(?:19|20)\d{2})?'
[[identifiers.dates.relative]]
norm = "relativ:frist"         # eine Dauer („innerhalb von drei Monaten", „nach einem Jahr"); der Name ist die Form des Codebuchs, keine Fristfunktion
pattern = '(?:innerhalb[ \t]+(?:von[ \t]+)?|nach[ \t]+)(?:\d+|eines|einem|zwei|drei|vier|sechs|zwölf)[ \t]+(?:Tag|Woche|Monat|Jahr)(?:es|en|e|s)?\b'
[[identifiers.dates.relative]]
norm = "relativ:jahresende"
pattern = 'bis[ \t]+(?:zum[ \t]+)?(?:Jahresende|Ende[ \t]+des[ \t]+Jahres)'

[identifiers.offices]          # Art 6: Ämter aus Kopffeld und Text, „Dezernat NN" aus dem Text (kein Dezernat aus einer Profiltabelle, Synergien § 1). Norm die Amtsnummer aus dem Verzeichnis, sonst der Name. Präzision 0,956, Recall 71/80 (§ 4.4)
head_chars = 6000              # so weit vom Textanfang sucht das Kopffeld
head = ""                      # Kopffeld des federführenden Amts, Gruppe v; im Stadtprofil
head_code = ""                 # Nummer und Name im Kopffeld, Gruppen code und name; im Stadtprofil. Aus ihnen entsteht je Lauf das Ämterverzeichnis
number = '\bAmt(?:es)?[ \t]+(?P<n>\d{2})(?:/(?P<u>\d{1,2}))?(?![\d/])'  # „Amt 66", „Amt 01/17"
number_extra = ""              # eine zweite Nummernform der Stadt, Gruppe n; im Stadtprofil
text = ""                      # eine Einheit, die die Stadt ohne Verzeichnis nennt, Gruppe n; im Stadtprofil
text_norm = ""
word = '(?<![\w-])(?P<name>[A-ZÄÖÜ][a-zäöüß]+(?:-[A-ZÄÖÜa-zäöüß][a-zäöüß]+)*amt)(?P<flex>e?s)?(?![\w-])'  # „Gartenamt", „Umweltamts": jedes Wort auf -amt; Norm die Nummer aus dem Verzeichnis, sonst das Wort
word_not = '^(?:Gesamt|Insgesamt|Fachamt|Ehrenamt|Finanzamt|Schulamt|Schiedsamt)$|^(?:Bundes|Landes)\w*amt$|bundesamt$'  # Wörter auf -amt, die kein Amt der Stadt nennen
bracket = '\((?:Amt[ \t]*)?\d{2}(?:/\d{1,2})?\)'  # „Umweltamt (Amt 19)": die Klammer gehört zur Spanne
committee_before = '(?:Ausschuss(?:es)?|Beirat(?:s|es)?)[ \t\n]+für[ \t\n]+(?:die[ \t]+|den[ \t]+)?$'  # „Ausschuss für Umwelt" nennt ein Gremium, kein Amt
committee_words = '(?i:ausschuss|beirat|rat\b|kommission|vertretung|konferenz|versammlung)'  # Kopffelder, die ein Gremium nennen („Jugendhilfeausschuss"), kommen nicht ins Verzeichnis
code_before = '(?<![\d\w])\d{2}(?:/\d{1,2})?[ \t]*[-–][ \t]*$'  # „64 - Amt für Wohnungswesen" außerhalb des Kopffelds: die Nummer davor kommt in die Spanne und ist die Norm
directory_min_count = 3        # ein Name kommt ins Verzeichnis, wenn ihn mindestens drei Kopffelder tragen
directory_min_chars = 8        # kürzere Namen („Umwelt") sind zu allgemein und wären Fehltreffer im Text ...
directory_word = 'amt'         # ... außer sie enthalten dieses Wort („Sportamt")
department = '\bDezernat(?:es|s)?[ \t]+(?P<n>\d{1,2})(?![\d/.])'  # „Dezernat 06" (12 von 12 richtig, § 4.4); Norm zweistellig
