[analysis]                     # Parameter, die mehr als ein Modul liest
exclude_districts = [1, 10]    # Tabelle 5 der Arbeit rechnet auch ohne die Wahlbezirke 1 und 10 (die zwei höchsten Trefferquoten); leer = keine zweite Regression

# --- Option 05: Gremien aus der Drucksachennummer (docs/plans/05-gremien.md) ---------------------
[bodies]                       # Gremium je Ratsdokument; alle Kürzel und Namen dieser Option stehen hier, keines im Code
# Drucksachennummer KÜRZEL[NR]/laufende Nummer/Jahr[/Nachtrag], etwa BV6/108/2023, RAT/270/2023, OVA/117/2023/1;
# das Muster trifft alle 19 108 Nummern der Referenz (2026-10-11). Die Gruppe code ist das Kürzel, number die
# Nummer dahinter (bei Bezirksvertretungen der Stadtbezirk). Was nicht trifft oder in keiner Tabelle steht, ist
# "unbekannt" und erscheint so mit Anteil auf der Seite, nie als stille Fehlklasse.
reference_pattern = '^(?P<code>[A-ZÄÖÜ]+?)(?P<number>\d{1,2})?/\d+/\d{4}(?:[/-].*)?$'
district_body = "BV"           # Kürzel der Bezirksvertretungen; die Nummer dahinter ist der Stadtbezirk (GO NRW: eine Bezirksvertretung je Stadtbezirk)
district_body_name = "Bezirksvertretung {n}"  # Anzeigename, {n} ist der Stadtbezirk
names_as_of = 2026-10-11       # Stand der Namen unten (OParl-organizations-Seite des Bodys und Sitzungstitel); nur Anzeige, nicht im Fingerprint

[bodies.council]               # der Rat der Stadt, Kürzel -> Name
RAT = "Rat"

[bodies.committees]            # Ausschüsse des Rates, Kürzel -> Name; "" = Name nicht gesichert, die Seite zeigt dann das Kürzel
# aus der OParl-organizations-Seite vom 2026-10-11 (shortName ist genau das Kürzel):
GLA = "Ausschuss für Gleichstellung und Antidiskriminierung"
ADIG = "Ausschuss für Digitalisierung und allgemeine Verwaltungsorganisation"  # bis 2024-09-19, danach "…, Personal und Organisation"
AUS = "Ausschuss für Umwelt-, Klima- und Verbraucherschutz"
"AÖE" = "Ausschuss für öffentliche Einrichtungen, Stadtökologie, Abfallmanagement und Bevölkerungsschutz"
AWIR = "Ausschuss für Wirtschaftsförderung, internationale und regionale Zusammenarbeit"
AWIZ = "Ausschuss für Wirtschaftsförderung und internationale Zusammenarbeit"  # 2020-11-01 bis 2021-03-18, dann AWIR
# aus Dokumenttiteln ("Sitzungstermine des …"):
OVA = "Ordnungs- und Verkehrsausschuss"
APS = "Ausschuss für Planung und Stadtentwicklung"
BAU = "Bauausschuss"
SPOA = "Sportausschuss"
ABA = "Anregungs- und Beschwerdeausschuss"
RPAU = "Rechnungsprüfungsausschuss"
# Kürzel ohne gesicherten Namen (nur plausibel; nach dem Merge von Option 4 aus raw/organizations.json, fragen.md 5.2):
KUA = ""
JHA = ""
SCHUA = ""
AGS = ""
AWM = ""
SEBD = ""
HFA = ""
WALTW = ""
WABTW = ""
WPA = ""
AWTL = ""

[bodies.advisory]              # Beiräte: keine Ausschüsse des Rates; eigene Klasse in der Tabelle, nicht auf der Karte
JURAT = "Jugendrat"            # aus Dokumenttiteln
INTR = "Integrationsrat"       # OParl-organizations-Seite 2026-10-11
BR = "Behindertenrat"          # aus Dokumenttiteln
SENR = "Seniorenrat"           # OParl-organizations-Seite 2026-10-11

# --- Option 06: Gewichtung (docs/plans/06-gewichtung.md). Alle Gewichte liegen in [0, 1]; ein Dokument
# zählt je Wahlbezirk höchstens einmal (Maximum über seine Begriffe mal Dokumentart mal Thema).
[weights]
combined = ["idf", "antraege_halb"]  # Faktoren der Variante "kombiniert" als Produkt: feste Faktoren "idf", "bezirke" oder ein Regelsatz von unten; leer = keine Zeile

[[weights.paper_type]]         # Regelsatz = eine Variante: geordnete Regex-Regeln auf paper_type (ohne Groß/Klein), die erste passende gewinnt, sonst default
name = "antraege_halb"
label = "Anträge, Anfragen, Eingaben halb"  # nur die Beschriftung der Zeile auf der Seite; zählt nicht zum Fingerprint
default = 1.0
rules = [{ pattern = "^z?(antrag|anfrage|haushaltsantrag|eingabe)", weight = 0.5 }]  # deckt 30 Fraktionsvarianten ("Antrag SPD", "zAnfrage REP") mit einem Präfix; A+F Beschluss und Bedarfsbeschluss bleiben Vorlagen

[[weights.paper_type]]
name = "nur_vorlagen"
label = "nur Verwaltungsvorlagen"
default = 1.0
rules = [{ pattern = "^z?(antrag|anfrage|haushaltsantrag|eingabe)", weight = 0.0 }]  # dieselbe Grenze mit Gewicht null

[topics]                       # Themenmodell: TF-IDF und NMF (scikit-learn) über die Texte; je Thema eine Variante thema_NN
k = 20                         # Zahl der Themen; lesbar auf der Seite, 3,8 s auf 19 033 Texten (2026-10-11); 0 schaltet den Schritt topics ab, 99 ist die Obergrenze (die Varianten heißen thema_NN)
min_df = 5                     # ein Wort zählt erst ab 5 Dokumenten (Tippfehler, seltene Namen fallen weg)
max_df = 0.5                   # ein Wort in mehr als der Hälfte der Dokumente ist ein Formularwort
max_features = 20000           # die häufigsten Wörter; mehr ändert die Themen nicht und kostet Zeit
top_words = 10                 # Wörter je Themenlabel; die Wörter beschreiben das Thema, sie benennen es nicht
stop_words = "de"              # Funktionswörter aus der Paketdatei analysis/stopwords_de.txt (ohne sie entsteht ein Thema aus "auch, oder, sich"); "" = keine
max_iter = 200                 # Obergrenze der NMF-Iterationen; mit tol unten konvergiert das Modell nach 120 (2026-10-12)
tol = 0.001                    # Abbruchschwelle: mit 1e-4 läuft NMF in die Obergrenze (200 Iterationen, 6,9 s; konvergiert erst bei 412 und 13,4 s) und gewinnt dabei 0,03 % Rekonstruktionsfehler; 1e-3 konvergiert nach 120 Iterationen in 4,5 s (gemessen 2026-10-12 auf 19 033 Texten)
random_state = 0               # Startwert für NMF; nndsvda ist deterministisch, der Wert steht trotzdem hier

# --- Option 03: Kontrollvariablen (docs/plans/03-kontrollvariablen.md) -----------------------------
# Fremddaten je Raumeinheit (hier der Quartiersatlas der Stadt je Sozialraum) werden über die
# Stimmbezirke auf die Wahlbezirke umgerechnet und als Kontrollvariablen in eine multiple Regression
# der Wahlbeteiligung auf die Trefferquote gesetzt (Tabelle 6 der Berichtsseite). Eine andere Stadt
# tauscht diesen Block; der Code kennt weder „Sozialraum" noch „Quartiersatlas".
[context]
root = "./context"             # im Repo, wird nur gelesen; bootstrap kopiert nach data_root/external/, `georep fetch context_data` holt frisch; "" = keine Kontextdaten
max_missing_weight = 0.1       # Anteil des Gewichts eines Wahlbezirks, der auf Einheiten ohne Wert liegen darf (Sozialraum 071009 hat 2021 keine Daten); darüber EmptyResultError
min_coverage = 0.9             # Anteil der Stimmbezirksfläche, den die Einheiten mindestens bedecken müssen; auf der Referenz 0,9999 (2026-10-12); darunter SchemaError

[context.dataset]              # Namensnennung (dl-de/by-2-0 verlangt Quelle und Datensatz) und Stand; nur Anzeige, nicht im Fingerprint
title = "Quartiersatlas Düsseldorf 2024"
url = "https://opendata.duesseldorf.de/dataset/quartiersatlas-d%C3%BCsseldorf-2024-sozialer-handlungsbedarf-und-fluktuation"
publisher = "Landeshauptstadt Düsseldorf, Amt für Statistik und Wahlen"
license = "Datenlizenz Deutschland – Namensnennung – Version 2.0"
license_url = "https://www.govdata.de/dl-de/by-2-0"
stand = 2021-12-31             # Datenstand laut Datensatzseite; die Wahl ist vom 14.09.2025, die Seite sagt das (Frage 3.4)
fetched = 2026-10-12           # Abrufdatum der Dateien unter root (context/README.md); gilt, solange context_data nie lief

[context.files.table]          # die Tabelle je Raumeinheit
url = "https://opendata.duesseldorf.de/sites/default/files/Daten_QA_2024.csv"
file = "quartiersatlas_2024.csv"

[context.files.units]          # die Flächen der Raumeinheiten; das CRS steht in der Datei (CRS84, lon/lat)
url = "https://opendata.duesseldorf.de/sites/default/files/Sozialr%C3%A4ume_QA_Daten_WGS84_EPSG_4326.geojson"
file = "sozialraeume_2021.geojson"

[context.files.indicators]     # Definitionen der Indikatoren, eine Zeile je Indikator, für den Abschnitt „Abgeleitete Daten"
url = "https://opendata.duesseldorf.de/sites/default/files/Erl%C3%A4uterung_Indikatoren_QA_0.csv"
file = "quartiersatlas_2024_indikatoren.csv"

[context.table]                # Form der Tabelle je Raumeinheit
sep = ";"
encoding = "utf-8"             # anders als die Wahlergebnis-CSV des Portals, die latin-1 trägt
decimal = ","
missing = [".", "x", "-", "#NV"] # "." anonymisiert Werte unter 3 (Hinweis des Portals); x, - und #NV stehen im Sozialraum ohne Daten
key = "SRG_2021_Nr"            # Schlüssel der Einheit, als Text (führende Null)
name = "SRG_2021_Name"
indicator = "Indikator"        # Spalten der Erläuterungsdatei: Name und Definition
definition = "Berechnung"

[context.units]
label = "Sozialräume"          # Name der Raumeinheit auf der Seite
key = "SOZIALRAUM"             # Eigenschaft im GeoJSON mit dem Schlüssel der Einheit

[context.scales.handlungsbedarf] # Stufen des städtischen Index, gleichabständig als Score (Frage 3.2, Annahme gilt); eine andere Stufe ist ein SchemaError
gering = 1
"eher gering" = 2
mittel = 3
"erhöht" = 4                   # in Anführungszeichen: ein nackter TOML-Schlüssel kennt nur [A-Za-z0-9_-]
hoch = 5

# Variablen je Wahlbezirk. kind: value = eine Spalte der Tabelle, sum = Summe mehrerer Spalten, ordinal = Stufe
# über eine Skala, district = Spalte der Wählertabelle (wahlbezirke_waehler) mal factor. indicator nennt die
# Zeile der Erläuterungsdatei mit der Definition. Einheiten der Tabelle werden mit den Wahlberechtigten je
# Stimmbezirk und dem Flächenanteil gewichtet gemittelt.
[[context.variables]]
name = "hb_score"
label = "Sozialer Handlungsbedarf"
unit = "Score 1 bis 5"
kind = "ordinal"
columns = ["Sozialer_HB"]
scale = "handlungsbedarf"
indicator = "Sozialer Handlungsbedarf"

[[context.variables]]
name = "fluktuation_score"
label = "Handlungsbedarf Fluktuation"
unit = "Score 1 bis 5"
kind = "ordinal"
columns = ["HB_Fluktuation"]
scale = "handlungsbedarf"
indicator = "Handlungsbedarf im Themenfeld Fluktuation"

[[context.variables]]
name = "anteil_65plus"
label = "Anteil 65 Jahre und älter"
unit = "% der Einwohner"
kind = "sum"
columns = ["65_bis_u80_Ant", "ue80_Ant"]
indicator = "Bevoelkerung nach Alter und Geschlecht"

[[context.variables]]
name = "anteil_u18"
label = "Anteil unter 18 Jahren"
unit = "% der Einwohner"
kind = "sum"
columns = ["u6_Ant", "6_bis_u18_Ant"]
indicator = "Bevoelkerung nach Alter und Geschlecht"

[[context.variables]]
name = "fluktuation"
label = "Fluktuationsrate"
unit = "je 1 000 Einwohner"
kind = "value"
columns = ["Fluktuationsrate"]
indicator = "Fluktuationsrate"

[[context.variables]]
name = "wohndauer"
label = "Durchschnittliche Wohndauer"
unit = "Monate"
kind = "value"
columns = ["Durchschn_Wohndauer_Monate"]
indicator = "Wohndauer"

[[context.variables]]
name = "mindestsicherung"
label = "Mindestsicherungsquote"
unit = "% der Einwohner"
kind = "value"
columns = ["Mindestsicherungsquote"]
indicator = "Mindestsicherungsquote"

[[context.variables]]
name = "migrationshintergrund"
label = "Anteil mit Migrationshintergrund"
unit = "% der Einwohner"
kind = "value"
columns = ["Migrationshintergrund_Ant"]
indicator = "Personen mit Migrationshintergrund"

[[context.variables]]
name = "einpersonen_hh"
label = "Anteil Einpersonenhaushalte"
unit = "% der Haushalte"
kind = "value"
columns = ["EinpersonenHH_Ant"]
indicator = "Einpersonenhaushalte"

[[context.variables]]
name = "cdu"
label = "Stimmenanteil CDU"
unit = "% der Wähler"
kind = "district"
columns = ["CDU_anteil"]
factor = 100

[[context.variables]]
name = "gruene"
label = "Stimmenanteil Grüne"
unit = "% der Wähler"
kind = "district"
columns = ["GRUENE_anteil"]
factor = 100

[[context.variables]]
name = "spd"
label = "Stimmenanteil SPD"
unit = "% der Wähler"
kind = "district"
columns = ["SPD_anteil"]
factor = 100

[[context.variables]]
name = "afd"
label = "Stimmenanteil AfD"
unit = "% der Wähler"
kind = "district"
columns = ["AfD_anteil"]
factor = 100

[context.models]               # sparsam bei n = 41: ein Hauptmodell, ein Parteimodell, jede Variable einzeln (Frage 3.1, Annahme)
y_scale = 100                  # Wahlbeteiligung in Prozent, wie Tabelle 5
main = ["trefferquote", "hb_score", "anteil_65plus", "fluktuation"]                  # B: k = 4
parties = ["trefferquote", "hb_score", "anteil_65plus", "fluktuation", "cdu", "afd"] # C: die zwei Parteianteile mit der geringsten Korrelation untereinander (r = -0,09); alle sechs ergäben VIF bis 76
single = ["hb_score", "fluktuation_score", "anteil_65plus", "anteil_u18", "fluktuation", "wohndauer", "mindestsicherung", "migrationshintergrund", "einpersonen_hh", "cdu", "gruene", "spd", "afd"] # Tabelle 6b: Trefferquote plus je eine Variable

# --- Option 04: Urheber und Parteien
# Der OParl-Server der ITK Rheinland liefert für Düsseldorf keine Urheberfelder (0 von 19 108
# Rohobjekten, auch nicht auf der Seite vom 2026-10-09 bei einem „Antrag FDP"). Der Urheber steht
# stattdessen im paperType, im Titel und im Textkopf; die Muster dafür stehen hier, nie im Code
# (Vorbereitung für Option 10: eine zweite Kommune bringt andere paperType-Werte mit).
# Reihenfolge der Quellen: oparl > paper_type > name > text; die erste mit Treffer gewinnt.
[originators]
# Die 9 933 Verwaltungsvorlagen: paperType ohne Urheber, Zahlen vom 2026-10-11 über alle 19 108 Dokumente
admin_types = [
    "Beschlussvorlage",                      # 4 001
    "Bezirksvertretung Informationsvorlage", # 2 699
    "Bezirksvertretung Beschlussvorlage",    # 1 474
    "Informationsvorlage",                   # 1 327
    "Berichtsvorlage",                       # 177
    "A+F Beschluss",                         # 145, Ausschuss für Anregungen und Beschwerden
    "Bedarfsbeschluss",                      # 78
    "Beschlussvorlage RPA",                  # 32, Rechnungsprüfungsamt
]
citizen_types = ["Eingabe nach 24GO", "Eingabe nach 24 GO"]  # 73 + 51 Bürgeranträge nach § 24 GO NRW; weder Verwaltung noch Mandatsträger
motion_prefixes = ["Haushaltsantrag", "Antrag", "Anfrage", "zAnfrage"]  # längste zuerst, sonst bleibt bei „Haushaltsantrag CDU/Grüne" ein „haushalts" stehen
fraction_markers = ["frak\\w{0,2}ion", "interfraktionell", "überfraktionell", "ratsgruppe"]  # erst damit wird der Titel befragt; „die cdu beantragt" in einer Verwaltungsvorlage soll nicht zählen. frak\w{0,2}ion deckt den Tippfehler der Quelle „Antrag der CDU-Frakion" (BV7/018/2025, Stichprobe vom 2026-10-12)
joint_markers = ["interfraktionell", "überfraktionell", "fraktionen"]  # Fraktion ohne nennbare Partei: 220 Dokumente („Interfraktioneller Antrag der Ratsfraktionen von …" nennt sie, andere nicht)
person_markers = [
    "bezirksvertreter", "ratsherr", "ratsfrau", "bürgermitglied", "bezirksbürgermeister",
    "herrn? ", "frau ",        # „herrn? " deckt „Antrag von Herrn Butzke" und „(Antrag Herr Wolf …)"; das Leerzeichen hält „Herren" und „Frauenberatung" draußen
]                              # 746 Dokumente: „Anfrage der Bezirksvertreterin Claudia Drossel"
# Zwei Leserichtungen im Textkopf: „(anfrage cdu-fraktion vom 28. juli 2023)" und
# „(interfraktioneller antrag)". Im ersten Muster steht .{0,80} und nicht [^.]{0,80}, weil die
# Abkürzungen der Namen Punkte tragen („(anfrage frau dr.dr.hagen, fdp-fraktion, …)", Stichprobe
# vom 2026-10-12); die Schranke von 80 Zeichen hält den Treffer trotzdem lokal.
text_markers = [
    "(antrag|anfrage).{0,80}?(fraktion|ratsfraktion|interfraktionell|überfraktionell)",
    "(interfraktionell|überfraktionell)\\w*.{0,20}?(antrag|anfrage)",
]
# Schwaches Tor für den Titel, erst nach den Personenmarkern befragt: eine Antragsklammer, die
# eine Partei ohne das Wort „Fraktion" nennt („(Antrag BÜNDNIS 90/DIE GRÜNEN)", BV3/065/2021).
# Steht ein Mandatsträger in der Klammer („(Antrag Herr Lemmer-Freie Wähler)"), gewinnt die Klasse
# Person, damit es gleich bleibt, ob der Titel „Herrn Salinger; AfD" oder die Klammer sagt.
name_party_markers = ["\\((antrag|anfrage)[^)]{0,60}\\)"]
text_head_chars = 600          # so viele Zeichen des Texts nach „betrifft"; der Volltext würde Zitate treffen („die cdu-fraktion beantragt" in einer Verwaltungsvorlage)
text_window_chars = 80         # Fenster links und rechts um den Treffer; „(anfrage frau irmer, spd-fraktion, vom 2. august 2023)" braucht beide Seiten

# Die sechs Parteien mit Stimmenspalte (columns.results.parties); patterns kleingeschrieben,
# organizations sind OParl-Organisations-URLs der Seite vom 2026-10-11 (greifen, sobald der Server
# originatorOrganization liefert; Suffix reicht, verglichen wird mit str.endswith).
[[originators.parties]]
key = "CDU"
label = "CDU"
short = "CDU"
patterns = ['\bcdu\b']
organizations = ["/organizations/gr/44"]  # CDU-Ratsfraktion
[[originators.parties]]
key = "GRUENE"
label = "Bündnis 90/Die Grünen"
short = "Grüne"
patterns = ['grüne', 'gruene', 'bündnis ?90', 'bü ?90']  # Schreibvarianten im Titel, auch „BÜNDNINS 90"
organizations = ["/organizations/gr/42"]  # Ratsfraktion BÜNDNIS 90/DIE GRÜNEN
[[originators.parties]]
key = "SPD"
label = "SPD"
short = "SPD"
patterns = ['\bspd\b']
organizations = ["/organizations/gr/400204"]  # Ratsfraktion SPD/Volt (ab 2020-11-01)
[[originators.parties]]
key = "FDP"
label = "FDP"
short = "FDP"
patterns = ['\bfdp\b']
organizations = ["/organizations/gr/49"]  # FDP-Ratsfraktion
[[originators.parties]]
key = "Die_Linke"
label = "Die Linke"
short = "Linke"
patterns = ['\blinke\b']
organizations = ["/organizations/gr/66"]  # Ratsfraktion Die Linke
[[originators.parties]]
key = "AfD"
label = "AfD"
short = "AfD"
patterns = ['\bafd\b']                    # trifft auch die Schreibvariante „AFD" („Haushaltsantrag AFD", 2 Dokumente), weil kleingeschrieben verglichen wird
organizations = ["/organizations/gr/400198", "/organizations/gr/162"]  # AfD-Ratsfraktion; gr/162 ist das Einzelmandat bis 2020-10-31

# Fraktionen und Gruppen ohne Stimmenspalte im Wahlergebnis: sie zählen als Klasse „Fraktion"
# (747 Dokumente), bekommen aber keine Hochburg-Kennzahl, weil es kein <Partei>_anteil gibt.
[[originators.groups]]
key = "T_FW"
label = "Tierschutz/Freie Wähler"
short = "T/FW"
patterns = ['tierschutz', 'freie wähler', 'freie waehler']
organizations = ["/organizations/gr/400202", "/organizations/gr/400238"]  # Gruppe bis 2025-10-31, danach Ratsgruppe Freie Wähler Tierschutz PARTEI
[[originators.groups]]
key = "PARTEI"
label = "Die PARTEI"
short = "PARTEI"
patterns = ['die partei', 'partei-klima', 'klima-fraktion', 'klimafraktion']  # „DIE PARTEI-Klima-Fraktion", „Die Partei-KlimaFraktion"
organizations = ["/organizations/gr/400205"]
[[originators.groups]]
key = "VOLT"
label = "Volt"
short = "Volt"
patterns = ['\bvolt\b']
organizations = []             # Volt sitzt in der Ratsfraktion SPD/Volt, hat also keine eigene Organisation
