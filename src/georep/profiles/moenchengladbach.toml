# --- Punkt 58: das Gremium je Dokument aus der Beratungsfolge -------------------------------------
#
# Mönchengladbachs Drucksachennummern tragen kein Kürzel (``0682/XI`` ist laufende Nummer und
# Wahlperiode), darum bleibt ``reference_pattern`` leer und die Nummer sagt hier nichts. Die
# **Beratungsfolge** sagt alles: alle 2 895 Dokumente der Periode tragen eine, und sie nennt 27
# verschiedene Organisationen (gemessen 2026-10-14). Deren Namen und Kürzel kommen aus
# ``raw/organizations.json`` (ein Abruf am 2026-10-14, 122 Organisationen); gelistet und
# klassifiziert hat sie `georep --profile moenchengladbach learn-bodies`, das sie mit
# ``classification`` und ``shortName`` des Servers ausgibt. Aus den Nummern ist hier **nichts zu
# lernen** -- die Zuordnung unten ist darum aus den Namen gelesen und nicht aus Daten abgestimmt.
# Die Kürzel folgen dem ``shortName`` des Servers, wo der eines ist: 13 sind zeichengleich (HA,
# AFBW, AUM, APBS, ASB, ASGSG, JHA, ABV, AFSB, AK, AFOK, IR, RPA), drei unterscheiden sich nur in
# der Schreibung (RAT, SENR, JUPA), und **elf sind frei gewählt**, weil der ``shortName`` dort ein
# Name mit Leerzeichen ist oder abgeschnitten ankommt: BV1 bis BV4 („BV Nord" …), NATB
# („Naturschutzbeirat"), ABB („Beschwerdeausschuss"), WAKW („WahlA Kommunal"), WPA
# („Wahlprüfungsausschus", so abgeschnitten im Katalog), WAIR („Wahlausschuss IR"), WABTW („WahlA
# Bundestag") und WALTW („WA-LtW22").
[bodies]
district_body = "BV"           # Kürzel der vier Bezirksvertretungen; die Nummer dahinter ist der Stadtbezirk (GO NRW: eine je Stadtbezirk)
district_body_name = "Bezirksvertretung {n}"  # greift nur ohne Eintrag in district_body_names
names_as_of = 2026-10-14       # Stand der Namen: der Abruf von organizations; nur Anzeige, nicht im Fingerprint

# Die Bezirksvertretungen heißen hier nach der Himmelsrichtung und nicht nach einer Nummer; welche
# Nummer zu welcher gehört, sagen die Daten. Die Stimmbezirksnummer trägt den Stadtbezirk an der
# ersten Stelle (``city_district_from_precinct``), und die Dokumente, deren Beratungsfolge **genau
# eine** Bezirksvertretung nennt und die mindestens einen Treffer haben, treffen mehrheitlich
# Wahlbezirke ihres eigenen Stadtbezirks. Basis sind 167 solcher Dokumente mit 683
# Dokument-Bezirk-Paaren (gemessen 2026-10-14; Zeile = die genannte Bezirksvertretung, Spalte =
# Stadtbezirk des getroffenen Wahlbezirks):
#
#               Nord   Ost  Süd  West   Summe  Dokumente
#   BV Nord      144    51   20    29     244     44      Diagonale 59 %
#   BV Ost        22    91   32     4     149     42                61 %
#   BV Süd        23    27   68    13     131     26                52 %
#   BV West       28    34    8    89     159     55                56 %
#
# Die Diagonale ist in jeder Zeile **und** in jeder Spalte die größte Zelle; mit der Tabelle ist
# das nachzusehen und nicht zu glauben. Dazu passt die Geographie: Stadtbezirk 1 sind Hardt, Venn,
# Eicken und die Altstadt (Nord), 2 Neuwerk und Giesenkirchen (Ost), 3 Rheydt und Odenkirchen
# (Süd), 4 Rheindahlen und Wickrath (West).
[bodies.district_body_names]   # Kürzel -> Anzeigename, wo die Bezirksvertretung keine Nummer trägt
BV1 = "Bezirksvertretung Nord"
BV2 = "Bezirksvertretung Ost"
BV3 = "Bezirksvertretung Süd"
BV4 = "Bezirksvertretung West"

