# Profil Mönchengladbach: die zweite Stadt, Kommunalwahl 2025, Ratsdokumente 2020 bis 2025.
#
# Alle Angaben am 2026-10-11 und 2026-10-12 an den Quellen nachgesehen (docs/plans/01-staedte.md,
# § 3.2). Mönchengladbach ist die einzige der vier Kommunen am OParl-Server der ITK Rheinland, die
# Stimmbezirksflächen als Open Data veröffentlicht; das Wahlergebnis kommt aus der
# votemanager-Präsentation der ITK Rheinland, dieselbe Datei in demselben Format wie für jede
# andere Kommune dieses Betreibers.

profile = "moenchengladbach"   # eigener Unterordner unter data_root und cache_root; die PDF-Dateinamen der OParl-Bodies kollidieren sonst
reference_root = "./reference/moenchengladbach"  # das Paket des vollen Laufs vom 2026-10-13, seit dem 2026-10-14 im Repo (Punkt 56; README dort mit Zahlen und Pruefsummen)

[city]
slug = "moenchengladbach"
name = "Mönchengladbach"
genitive = "Mönchengladbachs"
adjective = "Mönchengladbacher"
ags = "05116000"               # Schlüssel der votemanager-Dateien
publisher = "Stadt Mönchengladbach"
council = "Stadtrat"
election = "Ratswahl 2025"

[report]
ris_url = "https://ris-oparl.itk-rheinland.de/"
data_note = "aus dem Paket dieser Stadt"
notes = [
    "Die Stimmbezirksflächen stammen aus dem Datensatz „Wahlen“ vom 08.06.2022 (Landtagswahl 2022); 175 der 179 Urnen-Stimmbezirke der Kommunalwahl 2025 kommen darin vor, alle 33 Wahlbezirkspräfixe. Gerechnet wird je Wahlbezirk, kleine Neuzuschnitte innerhalb eines Wahlbezirks fallen damit heraus.",
    "Wahlbezirke heißen hier wie Stadtteile („Venn“, „Hardt“); die Ausschlussliste nimmt die Stadtteilnamen trotzdem heraus, weil ein Stadtteil mehr umfasst als der gleichnamige Wahlbezirk.",
]

