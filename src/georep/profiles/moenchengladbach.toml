# --- Option 04 und Punkt 59: Urheber und Parteien --------------------------------------------------
#
# Anders als in Düsseldorf steht der Urheber hier **in der Dokumentart**, aber ohne die Fraktion zu
# nennen: alle 16 Dokumentarten dieser Periode sind eindeutig einer Klasse zuzuordnen (gemessen am
# 2026-10-14 an reference/moenchengladbach/raw/papers.jsonl, Summe 2 895). Darum stehen hier keine
# Antragspräfixe, keine Fraktions-, Personen- oder Textmarker: jede Art trifft eine der vier Listen,
# und keine der markerbasierten Quellen wird je befragt. Die Partei kommt bei einem Fraktionsantrag
# aus dem Titel („Fraktionsantrag von DIE LINKE und DIE FRAKTION") oder aus dem Briefkopf des Texts
# („spd-ratsfraktion mönchengladbach fraktion bündnis 90/die grünen mönchengladbach …").
# Der OParl-Server füllt die Urheberfelder auch hier nicht (0 von 2 895); die Quelle `oparl` greift
# ohne Codeänderung, sobald er sie füllt, und die Organisations-URLs unten stehen dafür bereit.
[originators]
admin_types = [                # 2 278 Dokumente: Vorlagen der Verwaltung und ihrer Betriebe
    "1.1 - Beratungsvorlage",            # 1 144
    "2.1 - Berichtsvorlage",             # 946
    "6.5 - Beratungsvorlage Nat. Beirat", # 28, Beirat der unteren Naturschutzbehörde
    "6.3 - Beratungsvorlage Sondergremien", # 29
    "2.2 - Berichtsvorlage BV",          # 19, Bezirksvertretung
    "8.3 - GMMG Berichtsvorlage",        # 19
    "8.4 - GMMG Berichtsvorlage BetrA",  # 27, Betriebsausschuss des Gebäudemanagements
    "8.1 - GMMG Beratungsvorlage",       # 27
    "8.2 - GMMG Beratungsvorlage BetrA", # 10
    "4 - Änderungsvorlage",              # 12; alle zwölf sind Nachträge („3373/X-1") zu Vorlagen der Verwaltung, der Textkopf nennt den Fachbereich. Der Änderungsantrag einer Fraktion heißt hier „3 - Fraktionsantrag"
    "1.2 - Beratungsvorlage BV",         # 8
    "6.2 - Berichtsvorlage Sondergremien", # 6
    "7.1 - EWMG Beratungsvorlage",       # 2, Entwicklungsgesellschaft der Stadt
    "7.2 - EWMG Berichtsvorlage",        # 1
]
citizen_types = []             # diese Stadt führt keine Dokumentart für Eingaben nach § 24 GO NRW
# Punkt 63: hinter dem letzten „hier:" nennt der Titel seinen eigenen Gegenstand, davor den Antrag,
# auf den er sich bezieht („Evaluation und Ausbau Rats-TV Fraktionsantrag DIE LINKE; hier: Antrag
# der Ratsfraktionen von SPD, Bündnis 90/Die Grünen und FDP"). 142 der 581 Fraktionsanträge tragen
# den Marker, drei nannten ohne ihn die Partei des zitierten Antrags (0590/X, 0591/X, 3732/X).
title_split_markers = ["hier ?:"]
fraction_types = ["3 - Fraktionsantrag"]   # 581 Dokumente; die Art nennt die Klasse, die Partei steht im Titel oder im Briefkopf
person_types = ["6.1 - Mitgliederantrag"]  # 36; Anträge einzelner Mitglieder der Sondergremien — 10 nennen in Titel oder Textkopf den Seniorenrat, 3 den Integrationsrat, 2 das Jugendparlament, die übrigen kein Gremium (gezählt 2026-10-14; wer der Antragsteller ist, sagt keines, darum die Klasse Person ohne Namen)

# Die acht Fraktionen des Rates aus raw/organizations.json (Abruf vom 2026-10-14,
# `classification = "Fraktion"`), Namen wörtlich, und was sie in der Auswertung bedeuten:
#
#   name                      shortName             id         Periode                 hier
#   CDU                       CDU                   gr/105     ab 1999-10-01           CDU
#   SPD                       SPD                   gr/112     ab 1999-10-01           SPD
#   BÜNDNIS 90/DIE GRÜNEN     GRÜNE                 gr/108     ab 1999-10-01           GRUENE
#   FDP / VOLT                FDP / VOLT            gr/106     ab 1999-10-01           FDP, Gruppe VOLT
#   AfD MG                    AfD MG                gr/166     ab 2014-06-01           AfD
#   DIE LINKE / DIE PARTEI    DIE LINKE/DIE PARTEI  gr/127     ab 2009-10-21           Die_Linke, Gruppe PARTEI
#   Die FRAKTION              Die FRAKTION          gr/226     2020-11-01 bis 2025-10-31  Gruppe FRAKTION
#   Fraktionslos              (leer)                gr/216     ohne Angabe             keine Zeile
#
# „Fraktionslos" ist der Sammelplatz für Mandate ohne Fraktion und kein Urheber, der sich in einem
# Briefkopf nennt: das Wort steht in keinem Titel und in keinem Textkopf dieser Periode (gemessen
# 2026-10-14). Eine Zeile mit einem Muster, das nichts trifft, wäre eine Behauptung ohne Beleg.
[[originators.parties]]
key = "CDU"
label = "CDU"
short = "CDU"
patterns = ['\bcdu\b']         # trifft „cdu-ratsfraktion" und den Briefkopf „fraktion@cdu-mg.de"
