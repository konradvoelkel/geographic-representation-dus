[topics]                       # Option 06 und Punkt 45: Themenmodell und die Saat je Ausschuss
seed = "none"                  # Review 2026-10-14, konsequent zu classify.enabled = false: mit der Saat bekamen acht Ausschüsse ein eigenes Thema, gesät aus 11 bis 21 Dokumenten mit Text, und ihre Namen standen danach als Zeilen in der Sensitivitätstabelle der Seite -- eine Zuordnung, die nach mehr aussieht, als 650 Texte aus 2 895 Dokumenten tragen (welche davon der Server ausliefert, entscheidet er selbst). Freie Themen sagen hier dasselbe, ohne einen Ausschuss zu behaupten

[classify]                     # Punkt 45: der passende Ausschuss je Dokument
