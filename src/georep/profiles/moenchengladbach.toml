[classify]                     # Punkt 45: der passende Ausschuss je Dokument
enabled = false                # Mönchengladbach hat Ausschüsse (oben), aber nur 650 der 2 895 Dokumente tragen Text, und welche das sind, entscheidet das Ratsinformationssystem (2 213 Hauptdateien antworten mit 404). Ein Klassifikator auf dieser Teilmenge wäre an einer nicht zufälligen Stichprobe gemessen; die Entscheidung gehört zu einem eigenen Schritt, nicht zu Punkt 58
