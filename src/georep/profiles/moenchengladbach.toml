[[originators.parties]]
key = "AfD"
label = "AfD"
short = "AfD"
patterns = ['\bafd\b']
organizations = ["/organizations/gr/166"]  # AfD MG

# Gruppen ohne Stimmenspalte im Wahlergebnis (columns.results.parties führt D1 bis D6): sie zählen
# als Klasse „Fraktion", bekommen aber keine Hochburg-Kennzahl, weil es kein <Partei>_anteil gibt.
[[originators.groups]]
key = "FRAKTION"
label = "Die FRAKTION"
short = "FRAKTION"
patterns = ['\bdie fraktion\b']    # „ratsgruppe die fraktion mönchengladbach", „die fraktion bv ost"; die Wortgrenze hält „die Fraktionsvorsitzende" draußen (1785/X, Zentrumspartei). Sieben Fundstellen dieser Periode nennen die Gruppe, eine nicht (gemessen 2026-10-14)
organizations = ["/organizations/gr/226"]
[[originators.groups]]
key = "PARTEI"
label = "Die PARTEI"
short = "PARTEI"
patterns = ['die partei']      # „die partei-ratsfraktion"; sitzt mit DIE LINKE in einer Fraktion
organizations = []             # die Organisation gr/127 trägt beide Namen und steht bei Die_Linke
[[originators.groups]]
key = "VOLT"
label = "Volt"
short = "Volt"
patterns = ['\bvolt\b']        # in dieser Periode in keinem Titel und keinem Textkopf (0 Treffer); die Zeile hält die Zuordnung der Fraktion FDP / VOLT fest
organizations = []             # dito: gr/106 steht bei FDP
