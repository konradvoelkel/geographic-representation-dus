parties = { CDU = "D1", SPD = "D2", GRUENE = "D3", AfD = "D4", FDP = "D5", Die_Linke = "D6" }
party_names = { GRUENE = "Bündnis 90/Die Grünen", Die_Linke = "Die Linke" }

