# Profil Düsseldorf: die Stadt der Arbeit, Kommunalwahl 2025, Ratsdokumente 2020 bis 2025.
#
# Diese Datei liegt zwischen defaults.toml und ./settings*.toml (siehe georep.settings). Alles
# Stadtspezifische steht hier, damit der Code keine Stadt kennt; jede Zahl trägt ihre Begründung.
# Ein neues Profil ist eine Kopie dieser Datei mit anderer AGS, anderem Body, anderer Entität,
# anderen URLs und anderer Ausschlussliste (docs/runbook-stadt.md).

profile = "duesseldorf"        # Unterordner unter data_root und cache_root, wie jede Stadt: der Slug (Frage 1.7, beantwortet 2026-10-13; decisions.md Punkt 52). Die veröffentlichte Adresse bleibt, weil `georep publish` die erste Stadt an die Wurzel von data_root/site/ legt

# Punkt 68: die Paper der Hauptperiode kommen aus dem Altformat der Arbeit, ihre Texte seit dem
# 2026-11-18 aus den PDFs, neu gelesen mit pypdf 7.1.0 (Konrads Entscheidung; 19 091 von 19 092,
# einer behält den Text der Arbeit). bootstrap legt das Paket über die Texte der Referenz; die
# Golden-Master-Tests gegen die Arbeit nehmen es mit as_in_the_thesis zurück, und jede Periode mit
# eigenem Schnappschuss setzt den Schlüssel wieder leer. Fundament F1: dazu der Rohtext derselben
# PDFs (19 091 von 19 092; das AES-verschlüsselte PDF hat keinen), damit eine Kette ohne PDFs ihn
# hat; auch ihn nehmen die Perioden zurück.
[bootstrap]
texts = "snapshots/duesseldorf-texte/cache/text/texts.parquet"
raw_texts = "snapshots/duesseldorf-rohtexte/cache/text/rohtexte.parquet"

[city]
slug = "duesseldorf"           # Ordnername im veröffentlichten Ordner und Dateiname dieses Profils
name = "Düsseldorf"
genitive = "Düsseldorfs"
adjective = "Düsseldorfer"
ags = "05111000"               # amtlicher Gemeindeschlüssel; Schlüssel der votemanager-Dateien
publisher = "Landeshauptstadt Düsseldorf"
council = "Stadtrat"
election = "Ratswahl 2025"

[report]
ris_url = "https://ris-oparl.itk-rheinland.de/"
data_note = "aus dem Datensatz der Arbeit (Stand November 2025)"  # steht im Kopf, solange kein eigener Abruf gelaufen ist
monitoring_url = "2025/"       # Option 07: der Abschnitt „Laufende Wahlperiode" verlinkt die Unterseite des Profils duesseldorf-2025. Relativ zur Stadtseite, denn dort legen sie `pages.yml` und `deploy/bin/georep-monitor.sh` ab (seit dem Schnappschuss snapshots/2025 im Repo, 2026-10-14); die beiden Periodenprofile setzen den Schlüssel wieder leer, sonst verlinkte eine Unterseite sich selbst oder ins Nichts
# Sätze, die nur für diese Stadt in „Methode und Grenzen" stehen. Typografische Anführungszeichen
# „…“: ein ASCII-" würde den TOML-String beenden, und als Daten escapt Jinja es zu &#34;.
notes = [
    "Begriffe wie „Hofgarten“ oder „Königsallee“ stehen in vielen Dokumenten, die nicht vom Bezirk handeln.",
    "Die Spalte „ohne Ausreißer“ der Arbeit weicht von der Neuberechnung ab, vermutlich ein früherer Datenstand; die Zahlen hier sind die Neuberechnung aus den veröffentlichten Daten.",
]

# Die Quellen, wie sie im Fuß der Seite stehen: Lizenz wörtlich, mit Prüfdatum der Datensatzseite.
[[report.sources]]
name = "Ratswahl 2025, Ergebnis je Stimmbezirk"
publisher = "Landeshauptstadt Düsseldorf, Open-Data-Portal"
url = "https://opendata.duesseldorf.de/"
license = "Datenlizenz Deutschland Namensnennung 2.0"
license_url = "https://www.govdata.de/dl-de/by-2-0"
checked = 2026-10-11

[[report.sources]]
name = "Stimmbezirkseinteilung 2025"
publisher = "Landeshauptstadt Düsseldorf, Open-Data-Portal"
url = "https://opendata.duesseldorf.de/"
license = "Datenlizenz Deutschland – Zero – Version 2.0"
license_url = "https://www.govdata.de/dl-de/zero-2-0"
checked = 2026-10-11

[[report.sources]]
name = "Ratsdokumente der Wahlperiode 2020 bis 2025"
publisher = "Ratsinformationssystem der Landeshauptstadt Düsseldorf (OParl)"
url = "https://ris-oparl.itk-rheinland.de/"
license = ""                   # kein Lizenzhinweis am Endpunkt; die Seite nennt nur die Kennungen
checked = 2026-10-11

# Punkt 47: die Arbeit, auf der diese Stadtseite aufsetzt. Stadtspezifisch und darum hier, nicht in
# report/literatur.toml: dort stehen nur Einträge, die für jede Kommune gelten.
[[report.literature]]
key = "bartzsch-2026"
authors = "Lukas Bartzsch"
# Kein Titel: er steht nirgends. Das Repositorium der Arbeit hat keine Beschreibung, sein README sagt
# nur, dass das Projekt der Analyse und Darstellung geografischer Daten dient (am 2026-10-13
# gelesen). Ein formulierter Titel in einem <cite> waere eine Behauptung; die Seite schreibt
# stattdessen "[Titel nachzutragen]" (Review 2026-10-13).
year = 2026
venue = "Heinrich-Heine-Universität Düsseldorf, Bachelorarbeit"
url = "https://github.com/lubar102/geographic-representation-dus"  # der Quelltext der Arbeit; die Arbeit selbst ist nicht öffentlich
accessed = 2026-10-13
pending = true                 # Titel und Betreuung stehen nirgends und sind bei Lukas zu erfragen
note = "Der Ursprung dieser Seite: Fragestellung, Wörterbuch je Wahlbezirk, Suche über die Ratsdokumente und die Regression gegen die Wahlbeteiligung stammen aus dieser Arbeit, und dieses Programm ist ein Umbau ihres Quelltextes, der als Repositorium geographic-representation-dus öffentlich ist. Es reproduziert ihre Zahlen, solange die eigenen Methodikregeln abgeschaltet sind; Titel, Monat der Einreichung und Betreuung sind nachzutragen, denn die Arbeit selbst ist nicht öffentlich und ihr Repositorium nennt sie nicht."

# Die zweite Quelle, die die Arbeit nennt, und die einzige Lücke der Liste. Sie steht hier und nicht
# in report/literatur.toml, weil sie nur über das Literaturverzeichnis dieser Arbeit existiert; ohne
# Jahr und ohne Link ist sie nur mit pending = true gültig (LiteratureEntry in georep.settings).
[[report.literature]]
key = "koeln-ratsdokumente"
authors = "Autor nachzutragen"
title = "Untersuchung zu Parteien und Stadtteilbezügen in den Ratsdokumenten der Stadt Köln"
venue = "Herausgeber und Jahr nachzutragen aus dem Literaturverzeichnis der Arbeit"
pending = true
note = "Die Arbeit zitiert eine Kölner Untersuchung zu Parteien und Ratsdokumenten; sie ist am 2026-10-13 nicht auffindbar. Gesucht wurde in OpenAlex und Crossref (Ratsinformationssystem, Ratsdokumente, Köln, Text Mining, geografische Repräsentation), auf arXiv, in Hochschulrepositorien und auf GitHub, und im öffentlichen Quelltext der Arbeit steht kein Literaturverzeichnis — die Zitation ist nur aus der Arbeit selbst zu holen. Die nächste belegte Verwandte ist Harmening u. a. 2025 weiter unten, die zwölf deutsche Großstädte mit demselben Verfahren untersucht."

[publish]
cities = ["duesseldorf", "moenchengladbach"]  # Reihenfolge der Veröffentlichung; die erste liegt an der Wurzel, jede weitere unter ihrem Slug. Mönchengladbach steht hier, seit sein Profil existiert; sein Paket liegt seit dem 2026-10-14 unter reference/moenchengladbach/ (Punkt 56), `georep publish` baut also die Vergleichsseite.

