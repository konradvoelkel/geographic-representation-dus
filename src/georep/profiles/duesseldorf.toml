[analysis]
exclude_districts = [1, 10]    # Tabelle 5 der Arbeit rechnet auch ohne die Wahlbezirke 1 und 10 (die zwei höchsten Trefferquoten); leer = keine zweite Regression

[topics]                       # Punkt 45: die Stoppwörter des Themenmodells kommen aus [originators] und [bodies] unten; hier stehen nur die Ausnahmen
# Die Quellen nehmen jedes Wort aus den Namen, Mustern und Kürzeln mit; drei davon sind
# Sachwörter dieser Stadt und sollen Themenwörter bleiben (geprüft am 2026-10-12 und 2026-10-13
# an der Referenz):
#   klima       aus "Die PARTEI-Klima-Fraktion" ([[originators.groups]])
#   tierschutz  aus "Tierschutz/Freie Wähler" (dito)
#   bau         aus dem Kürzel BAU des Bauausschusses ([bodies.committees]); "bau" steht in 1101
#               von 19 033 Dokumenten (5,8 %) und ist dort das Bauen, nicht der Ausschuss
# Nicht zurückgeholt, weil sie wirklich das Gremium nennen: "rat" (RAT, 3751 Dokumente, 19,7 %)
# und "aus" (AUS, 9320 Dokumente -- das Wort steht ohnehin in der deutschen Paketliste).
stop_keep = ["klima", "tierschutz", "bau"]

[columns]                      # Feldnamen der Quellen; bis Phase 2 in drei Modulen hart kodiert
district_id = "Kommunalwahlbezirk Nr."
district_name = "Kommunalwahlbezirk Name"
precinct_id = "Stimm-/ Wahlbezirk"

[columns.results]              # Wahlergebnis-CSV des Open-Data-Portals
sep = ";"
encoding = "latin-1"
district = "Kommunalwahlbezirk"
eligible = "Wahlberechtigte_insgesamt"
voters = "Waehler"
precinct = "gebietnr"          # Stimmbezirk, vierstellig; Schlüssel zu „Stimm-/ Wahlbezirk" im GeoJSON (Option 03, Crosswalk über Stimmbezirksflächen)
parties = { CDU = "CDU_Stimmen", GRUENE = "GRUENE_Stimmen", SPD = "SPD_Stimmen", FDP = "FDP_Stimmen", Die_Linke = "Die_Linke_Stimmen", AfD = "AfD_Stimmen" }
party_names = { GRUENE = "Bündnis 90/Die Grünen", Die_Linke = "Die Linke" }  # Option 01: Anzeigenamen auf der Seite und in der Spaltendoku
city_district = "Stadtbezirk" # Option 05: Stadtbezirk je Stimmbezirk, stimmt für alle 306 Stimmbezirke mit "Stadtbezirk Nr." des GeoJSON überein (2026-10-11)
precinct_name = ""             # Option 02: Gebietsname je Zeile; darin steht der postal_marker der Briefwahlbezirke
eligible_postal = ""           # Option 02: Wahlberechtigte mit Wahlschein je Stimmbezirk, Verteilschlüssel der Briefwähler
postal_marker = ""             # Option 02: Namensbestandteil der Briefwahlbezirke (ohne Geometrie), etwa "Briefwahl"

[bodies]                       # Gremium je Ratsdokument; alle Kürzel und Namen dieser Option stehen hier, keines im Code
# Drucksachennummer KÜRZEL[NR]/laufende Nummer/Jahr[/Nachtrag], etwa BV6/108/2023, RAT/270/2023, OVA/117/2023/1;
# das Muster trifft alle 19 108 Nummern der Referenz (2026-10-11). Die Gruppe code ist das Kürzel, number die
# Nummer dahinter (bei Bezirksvertretungen der Stadtbezirk). Was nicht trifft oder in keiner Tabelle steht, ist
# "unbekannt" und erscheint so mit Anteil auf der Seite, nie als stille Fehlklasse.
reference_pattern = '^(?P<code>[A-ZÄÖÜ]+?)(?P<number>\d{1,2})?/\d+/\d{4}(?:[/-].*)?$'
district_body = "BV"           # Kürzel der Bezirksvertretungen; die Nummer dahinter ist der Stadtbezirk (GO NRW: eine Bezirksvertretung je Stadtbezirk)
district_body_name = "Bezirksvertretung {n}"  # Anzeigename, {n} ist der Stadtbezirk
names_as_of = 2026-10-14       # Stand der Namen unten (OParl-organizations-Seite des Bodys, Sitzungstitel und, seit dem 2026-10-14, die Texte der POA- und ACI-Dokumente); nur Anzeige, nicht im Fingerprint
# Punkt 58: die Beratungsfolge je Dokument als zweite Quelle des Gremiums. Der Korpus der
# Hauptperiode kommt aus dem Altformat der Arbeit und trägt sie nicht; der Vollabruf der Metadaten
# vom 2026-10-14 (122 Seiten, 35 Minuten) hat sie geholt, und das Paket im Repo friert sie ein
# (snapshots/duesseldorf-beratungsfolge/README.md mit Zahlen und Prüfsumme). bootstrap kopiert die
# Datei nach raw/, gelesen wird nur die Kopie. Jede andere Periode trägt die Folge in ihrem eigenen
# raw/papers.jsonl und setzt den Schlüssel wieder leer.
consultations = "snapshots/duesseldorf-beratungsfolge/raw/beratungsfolge.parquet"

[bodies.council]               # der Rat der Stadt, Kürzel -> Name
RAT = "Rat"

[bodies.committees]            # Ausschüsse des Rates, Kürzel -> Name; "" = Name nicht gesichert, die Seite zeigt dann das Kürzel
# aus der OParl-organizations-Seite vom 2026-10-11 (shortName ist genau das Kürzel):
GLA = "Ausschuss für Gleichstellung und Antidiskriminierung"
ADIG = "Ausschuss für Digitalisierung und allgemeine Verwaltungsorganisation"  # bis 2024-09-19, danach "…, Personal und Organisation"
AUS = "Ausschuss für Umwelt-, Klima- und Verbraucherschutz"
"AÖE" = "Ausschuss für öffentliche Einrichtungen, Stadtökologie, Abfallmanagement und Bevölkerungsschutz"
AWIR = "Ausschuss für Wirtschaftsförderung, internationale und regionale Zusammenarbeit"
AWIZ = "Ausschuss für Wirtschaftsförderung und internationale Zusammenarbeit"  # 2020-11-01 bis 2021-03-18, dann AWIR
# aus Dokumenttiteln ("Sitzungstermine des …"):
OVA = "Ordnungs- und Verkehrsausschuss"
APS = "Ausschuss für Planung und Stadtentwicklung"
BAU = "Bauausschuss"
SPOA = "Sportausschuss"
ABA = "Anregungs- und Beschwerdeausschuss"
RPAU = "Rechnungsprüfungsausschuss"
# Punkt 58 (Review 2026-10-14): zwei Ausschüsse, die nur in einer anderen Periode vorkommen und
# darum in der Tabelle fehlten -- und deren Organisationen deshalb nicht in [bodies.organizations]
# stehen durften (ein Alias ins Nichts ist ein Settings-Fehler). Beide Namen sind belegt:
POA = "Personal- und Organisationsausschuss"  # 51 Nummern der Periode 2014 bis 2020; der Name steht 19-mal in den Texten dieser Dokumente ("Sitzungstermine des Personal- und Organisationsausschusses"), Organisation gr/26
ACI = "Ausschuss für Chancengerechtigkeit und Integration"  # 55 Nummern der laufenden Periode; der Name steht im Titel von ACI/003/2025 ("Wahl einer / eines Vorsitzenden des Ausschusses für Chancengerechtigkeit und Integration"), Organisation gr/400237
# Kürzel ohne gesicherten Namen (nur plausibel; nach dem Merge von Option 4 aus raw/organizations.json, fragen.md 5.2):
KUA = ""
JHA = ""
SCHUA = ""
AGS = ""
AWM = ""
SEBD = ""
HFA = ""
WALTW = ""
WABTW = ""
WPA = ""
AWTL = ""

[bodies.advisory]              # Beiräte: keine Ausschüsse des Rates; eigene Klasse in der Tabelle, nicht auf der Karte
JURAT = "Jugendrat"            # aus Dokumenttiteln
INTR = "Integrationsrat"       # OParl-organizations-Seite 2026-10-11
BR = "Behindertenrat"          # aus Dokumenttiteln
SENR = "Seniorenrat"           # OParl-organizations-Seite 2026-10-11

# Die Nummernform vor 2019 (Punkt 57). Bis ins Jahr 2019 hieß eine Drucksache
# "<Amtsnummer>/ <laufende Nummer>/<Jahr>" ("61/ 12/2014"), also ohne Gremiumskürzel: 18 018 der
# 22 215 Nummern der Wahlperiode 2014 bis 2020, die übrigen 4 197 tragen schon die heutige Form.
# Eindeutig ein Gremium sind daraus genau die zehn Köpfe unten: "17X" ist die Bezirksvertretung des
# Stadtbezirks X, "170" die zehnte. Nachgewiesen am 2026-10-14 an den Dokumenttexten des Pakets
# snapshots/2014-2020 -- von 10 008 der 10 705 Dokumente, deren Text eine Bezirksvertretung nennt,
# nennt er in 9 999 Fällen (99,91 %) genau diese; die Gegenprobe mit dem heutigen Kürzel BVn
# derselben Periode trifft zu 99,89 %, die Zuordnung ist also so gut wie die, die der Parser schon
# benutzt. Jeder Kopf zeigt außerdem in allen seinen Dokumenten auf dieselbe consultation-
# Organisation (gr/32 bis gr/41), und zwar auf zehn aufeinanderfolgende.
# Die 22 echten Amtsnummern (7 313 Dokumente, "01", "61", "66", ...) stehen hier *nicht*: ein Amt
# ist kein Gremium, seine Vorlage geht an den zuständigen Ausschuss, und dessen Name steckt nicht
# in der Nummer. Sie bleiben "unbekannt", sichtbar mit Anteil auf der Seite.
# Die Hauptperiode und die laufende Periode merken davon nichts: dort trifft das Muster jede Nummer
# (19 108 bzw. 4 095 von 4 095), und diese Tabelle wird nur befragt, wenn es nicht trifft.
[bodies.aliases]               # Kopf der Nummer (alles vor dem ersten /) -> Kürzel
171 = "BV1"
172 = "BV2"
173 = "BV3"
174 = "BV4"
175 = "BV5"
176 = "BV6"
177 = "BV7"
178 = "BV8"
179 = "BV9"
170 = "BV10"                   # der zehnte Stadtbezirk, einstellig geschrieben

# Punkt 58: die Beratungsfolge als zweite Quelle des Gremiums. Die Tabelle ist **gelernt und nicht
# geraten**: `georep --profile duesseldorf learn-bodies` nimmt die Dokumente, deren Folge genau
# eine Organisation nennt und deren Drucksachennummer ein Kürzel trägt, und lässt sie abstimmen.
# Am 2026-10-14 ergaben das 35 Organisationen aus 17 047 Dokumenten der Hauptperiode mit einer
# Reinheit von 16 902/17 047 = 99,1 %; die Zahlen je Zeile stehen daneben (Dokumente mit genau
# dieser Organisation, davon Stimmen für dieses Kürzel). Dieselbe Rechnung auf der Periode 2014 bis
# 2020 (30 Organisationen, 99,8 %) und auf der laufenden (32, 99,3 %) widerspricht in **keiner**
# der 29 beziehungsweise 30 gemeinsamen Zeilen -- die Abbildung ist eine Eigenschaft der Stadt und
# nicht der Periode, und darum steht sie hier und nicht in einem Periodenprofil.
#
# Der Schlüssel sind die beiden letzten Segmente der Organisations-URL; eine volle URL wäre auch
# erlaubt (georep.prep.bodies.organization_key). Die Abbildung ist **nicht umkehrbar**: mehrere
# Organisationen zeigen auf dasselbe Kürzel (gr/14 und gr/400214 auf AUS, gr/10 und gr/400213 auf
# AÖE, gr/400211 und gr/400232 auf ADIG -- der Server hat die Gremien 2020 und 2024 neu angelegt),
# und mehrere Kürzel zeigen auf dieselbe Organisation (RPAU und WPA auf die des Rates, BAU auf die
# von SEBD; daher die 84,3 % von gr/20 und die 66,5 % von gr/17). Für diese Richtung ist das
# gleichgültig: gefragt wird immer „welches Gremium nennt diese Organisation". GLA gehört seit
# gr/400242 nicht mehr dazu -- es hat seit der laufenden Periode eine eigene Organisation.
#
# Nicht dabei: gr/27 (1 Dokument der Hauptperiode, 21 der alten, keines davon mit eindeutiger
# Folge) -- welches Gremium das ist, sagen die Daten nicht, und ein Eintrag wäre geraten.
[bodies.organizations]         # Organisation der Beratungsfolge -> Kürzel
"gr/6" = "RAT"                 # 2062 eindeutige Dokumente, 2002 als RAT (die übrigen RPAU, OVA, KUA)
"gr/32" = "BV1"                # 1381, davon 1380
"gr/40" = "BV9"                # 1272, davon 1272
"gr/39" = "BV8"                # 1252, davon 1250
"gr/33" = "BV2"                # 1194, davon 1193
"gr/38" = "BV7"                # 1147, davon 1147
"gr/37" = "BV6"                # 1098, davon 1097
"gr/36" = "BV5"                # 962, davon 962
