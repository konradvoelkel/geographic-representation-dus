# --- Option 06: Gewichtung (docs/plans/06-gewichtung.md). Alle Gewichte liegen in [0, 1]; ein Dokument
# Fremddaten je Raumeinheit (hier der Quartiersatlas der Stadt je Sozialraum) werden über die
# Stimmbezirke auf die Wahlbezirke umgerechnet und als Kontrollvariablen in eine multiple Regression
# der Wahlbeteiligung auf die Trefferquote gesetzt (Tabelle 6 der Berichtsseite). Eine andere Stadt
# tauscht diesen Block; der Code kennt weder „Sozialraum" noch „Quartiersatlas".
[context]
root = "./context"             # im Repo, wird nur gelesen; bootstrap kopiert nach data_root/external/, `georep fetch context_data` holt frisch; "" = keine Kontextdaten
max_missing_weight = 0.1       # Anteil des Gewichts eines Wahlbezirks, der auf Einheiten ohne Wert liegen darf (Sozialraum 071009 hat 2021 keine Daten); darüber EmptyResultError
min_coverage = 0.9             # Anteil der Stimmbezirksfläche, den die Einheiten mindestens bedecken müssen; auf der Referenz 0,9999 (2026-10-12); darunter SchemaError

[context.dataset]              # Namensnennung (dl-de/by-2-0 verlangt Quelle und Datensatz) und Stand; nur Anzeige, nicht im Fingerprint
title = "Quartiersatlas Düsseldorf 2024"
url = "https://opendata.duesseldorf.de/dataset/quartiersatlas-d%C3%BCsseldorf-2024-sozialer-handlungsbedarf-und-fluktuation"
publisher = "Landeshauptstadt Düsseldorf, Amt für Statistik und Wahlen"
license = "Datenlizenz Deutschland – Namensnennung – Version 2.0"
license_url = "https://www.govdata.de/dl-de/by-2-0"
stand = 2021-12-31             # Datenstand laut Datensatzseite; die Wahl ist vom 14.09.2025, die Seite sagt das (Frage 3.4)
fetched = 2026-10-12           # Abrufdatum der Dateien unter root (context/README.md); gilt, solange context_data nie lief

[context.files.table]          # die Tabelle je Raumeinheit
url = "https://opendata.duesseldorf.de/sites/default/files/Daten_QA_2024.csv"
file = "quartiersatlas_2024.csv"

[context.files.units]          # die Flächen der Raumeinheiten; das CRS steht in der Datei (CRS84, lon/lat)
url = "https://opendata.duesseldorf.de/sites/default/files/Sozialr%C3%A4ume_QA_Daten_WGS84_EPSG_4326.geojson"
file = "sozialraeume_2021.geojson"

[context.files.indicators]     # Definitionen der Indikatoren, eine Zeile je Indikator, für den Abschnitt „Abgeleitete Daten"
url = "https://opendata.duesseldorf.de/sites/default/files/Erl%C3%A4uterung_Indikatoren_QA_0.csv"
file = "quartiersatlas_2024_indikatoren.csv"

[context.table]                # Form der Tabelle je Raumeinheit
sep = ";"
encoding = "utf-8"             # anders als die Wahlergebnis-CSV des Portals, die latin-1 trägt
decimal = ","
missing = [".", "x", "-", "#NV"] # "." anonymisiert Werte unter 3 (Hinweis des Portals); x, - und #NV stehen im Sozialraum ohne Daten
key = "SRG_2021_Nr"            # Schlüssel der Einheit, als Text (führende Null)
name = "SRG_2021_Name"
indicator = "Indikator"        # Spalten der Erläuterungsdatei: Name und Definition
definition = "Berechnung"

[context.units]
label = "Sozialräume"          # Name der Raumeinheit auf der Seite
key = "SOZIALRAUM"             # Eigenschaft im GeoJSON mit dem Schlüssel der Einheit

[context.scales.handlungsbedarf] # Stufen des städtischen Index, gleichabständig als Score (Frage 3.2, Annahme gilt); eine andere Stufe ist ein SchemaError
gering = 1
"eher gering" = 2
mittel = 3
"erhöht" = 4                   # in Anführungszeichen: ein nackter TOML-Schlüssel kennt nur [A-Za-z0-9_-]
hoch = 5

# Variablen je Wahlbezirk. kind: value = eine Spalte der Tabelle, sum = Summe mehrerer Spalten, ordinal = Stufe
# über eine Skala, district = Spalte der Wählertabelle (wahlbezirke_waehler) mal factor. indicator nennt die
# Zeile der Erläuterungsdatei mit der Definition. Einheiten der Tabelle werden mit den Wahlberechtigten je
# Stimmbezirk und dem Flächenanteil gewichtet gemittelt.
[[context.variables]]
name = "hb_score"
label = "Sozialer Handlungsbedarf"
unit = "Score 1 bis 5"
kind = "ordinal"
columns = ["Sozialer_HB"]
scale = "handlungsbedarf"
indicator = "Sozialer Handlungsbedarf"

[[context.variables]]
name = "fluktuation_score"
label = "Handlungsbedarf Fluktuation"
unit = "Score 1 bis 5"
kind = "ordinal"
columns = ["HB_Fluktuation"]
scale = "handlungsbedarf"
indicator = "Handlungsbedarf im Themenfeld Fluktuation"

[[context.variables]]
name = "anteil_65plus"
label = "Anteil 65 Jahre und älter"
unit = "% der Einwohner"
kind = "sum"
columns = ["65_bis_u80_Ant", "ue80_Ant"]
indicator = "Bevoelkerung nach Alter und Geschlecht"

[[context.variables]]
name = "anteil_u18"
label = "Anteil unter 18 Jahren"
unit = "% der Einwohner"
kind = "sum"
columns = ["u6_Ant", "6_bis_u18_Ant"]
indicator = "Bevoelkerung nach Alter und Geschlecht"

[[context.variables]]
name = "fluktuation"
label = "Fluktuationsrate"
unit = "je 1 000 Einwohner"
kind = "value"
columns = ["Fluktuationsrate"]
indicator = "Fluktuationsrate"

[[context.variables]]
name = "wohndauer"
label = "Durchschnittliche Wohndauer"
unit = "Monate"
kind = "value"
columns = ["Durchschn_Wohndauer_Monate"]
indicator = "Wohndauer"

[[context.variables]]
name = "mindestsicherung"
label = "Mindestsicherungsquote"
unit = "% der Einwohner"
kind = "value"
columns = ["Mindestsicherungsquote"]
indicator = "Mindestsicherungsquote"

[[context.variables]]
name = "migrationshintergrund"
label = "Anteil mit Migrationshintergrund"
unit = "% der Einwohner"
kind = "value"
columns = ["Migrationshintergrund_Ant"]
indicator = "Personen mit Migrationshintergrund"

[[context.variables]]
name = "einpersonen_hh"
label = "Anteil Einpersonenhaushalte"
unit = "% der Haushalte"
kind = "value"
columns = ["EinpersonenHH_Ant"]
indicator = "Einpersonenhaushalte"

[[context.variables]]
name = "cdu"
label = "Stimmenanteil CDU"
unit = "% der Wähler"
kind = "district"
columns = ["CDU_anteil"]
factor = 100

[[context.variables]]
name = "gruene"
label = "Stimmenanteil Grüne"
unit = "% der Wähler"
kind = "district"
columns = ["GRUENE_anteil"]
factor = 100

[[context.variables]]
name = "spd"
label = "Stimmenanteil SPD"
unit = "% der Wähler"
kind = "district"
columns = ["SPD_anteil"]
factor = 100

[[context.variables]]
name = "afd"
label = "Stimmenanteil AfD"
unit = "% der Wähler"
kind = "district"
columns = ["AfD_anteil"]
factor = 100

[context.models]               # sparsam bei n = 41: ein Hauptmodell, ein Parteimodell, jede Variable einzeln (Frage 3.1, Annahme)
y_scale = 100                  # Wahlbeteiligung in Prozent, wie Tabelle 5
main = ["trefferquote", "hb_score", "anteil_65plus", "fluktuation"]                  # B: k = 4
parties = ["trefferquote", "hb_score", "anteil_65plus", "fluktuation", "cdu", "afd"] # C: die zwei Parteianteile mit der geringsten Korrelation untereinander (r = -0,09); alle sechs ergäben VIF bis 76
single = ["hb_score", "fluktuation_score", "anteil_65plus", "anteil_u18", "fluktuation", "wohndauer", "mindestsicherung", "migrationshintergrund", "einpersonen_hh", "cdu", "gruene", "spd", "afd"] # Tabelle 6b: Trefferquote plus je eine Variable

# --- Option 04: Urheber und Parteien
# Der OParl-Server der ITK Rheinland liefert für Düsseldorf keine Urheberfelder (0 von 19 108
# Rohobjekten, auch nicht auf der Seite vom 2026-10-09 bei einem „Antrag FDP"). Der Urheber steht
# stattdessen im paperType, im Titel und im Textkopf; die Muster dafür stehen hier, nie im Code
# (Vorbereitung für Option 10: eine zweite Kommune bringt andere paperType-Werte mit).
# Reihenfolge der Quellen: oparl > paper_type > name > text; die erste mit Treffer gewinnt.
[originators]
# Die 9 933 Verwaltungsvorlagen: paperType ohne Urheber, Zahlen vom 2026-10-11 über alle 19 108 Dokumente
admin_types = [
    "Beschlussvorlage",                      # 4 001
    "Bezirksvertretung Informationsvorlage", # 2 699
    "Bezirksvertretung Beschlussvorlage",    # 1 474
    "Informationsvorlage",                   # 1 327
    "Berichtsvorlage",                       # 177
    "A+F Beschluss",                         # 145, Ausführungs- und Finanzierungsbeschluss eines Bauvorhabens (Vorhaben 11 und 14, 2026-11-23)
    "Bedarfsbeschluss",                      # 78
    "Beschlussvorlage RPA",                  # 32, Rechnungsprüfungsamt
    # Punkt 60: die Dokumentart der Wahlperiode 2014 bis 2020. Damals hieß jede Vorlage der
    # Verwaltung so (8 337 Dokumente, 37,5 % jener Periode), heute heißt keine mehr so; die
    # Hauptperiode und die laufende Periode kennen den Wert nicht. Dass er die Verwaltung meint,
    # sagt der Gegenbegriff derselben Taxonomie: „Vorlage aus der Politik". Die 197 Dokumente, die
    # bis zum 2026-10-14 über Titel oder Textkopf zu einer Fraktion wurden, sind damit richtig
    # Verwaltung -- es waren Vorlagen, die einen Fraktionsantrag zitieren.
    "Verwaltungsvorlage",                    # 8 337 in der Periode 2014 bis 2020, 0 sonst
]
citizen_types = [
    "Eingabe nach 24GO",                     # 73
    "Eingabe nach 24 GO",                    # 51; Bürgeranträge nach § 24 GO NRW, weder Verwaltung noch Mandatsträger
    "Bezirksvertretung Eingabe nach 24Go",   # 2 in der Periode 2014 bis 2020, 0 sonst
]
motion_prefixes = ["Haushaltsantrag", "Antrag", "Anfrage", "zAnfrage"]  # längste zuerst, sonst bleibt bei „Haushaltsantrag CDU/Grüne" ein „haushalts" stehen
fraction_markers = ["frak\\w{0,2}ion", "interfraktionell", "überfraktionell", "ratsgruppe"]  # erst damit wird der Titel befragt; „die cdu beantragt" in einer Verwaltungsvorlage soll nicht zählen. frak\w{0,2}ion deckt den Tippfehler der Quelle „Antrag der CDU-Frakion" (BV7/018/2025, Stichprobe vom 2026-10-12)
joint_markers = ["interfraktionell", "überfraktionell", "fraktionen"]  # Fraktion ohne nennbare Partei: 220 Dokumente („Interfraktioneller Antrag der Ratsfraktionen von …" nennt sie, andere nicht)
person_markers = [
    "bezirksvertreter", "ratsherr", "ratsfrau", "bürgermitglied", "bezirksbürgermeister",
    "herrn? ", "frau ",        # „herrn? " deckt „Antrag von Herrn Butzke" und „(Antrag Herr Wolf …)"; das Leerzeichen hält „Herren" und „Frauenberatung" draußen
]                              # 746 Dokumente: „Anfrage der Bezirksvertreterin Claudia Drossel"
# Zwei Leserichtungen im Textkopf: „(anfrage cdu-fraktion vom 28. juli 2023)" und
# „(interfraktioneller antrag)". Im ersten Muster steht .{0,80} und nicht [^.]{0,80}, weil die
# Abkürzungen der Namen Punkte tragen („(anfrage frau dr.dr.hagen, fdp-fraktion, …)", Stichprobe
# vom 2026-10-12); die Schranke von 80 Zeichen hält den Treffer trotzdem lokal. Die Lookbehinds
# halten die Verbform draußen: „der beantragenden fraktionen" ist kein Antrag einer Fraktion
# (BV3/134/2025, Review 2026-10-12). Eine Wortgrenze täte das auch, verlöre aber die
# Zusammensetzungen („haushaltsantrag der cdu-fraktion", „antragsstellende liste und fraktion")
# und die Fälle, in denen die PDF-Extraktion die Leerzeichen gefressen hat
# („anfragefraktionbündnis90/diegrünen", BV5/054/2022): sechs Dokumente gemessen.
text_markers = [
    "(?<!be)(?<!ge)(antrag|anfrage).{0,80}?(fraktion|ratsfraktion|interfraktionell|überfraktionell)",
    "(interfraktionell|überfraktionell)\\w*.{0,20}?(antrag|anfrage)",
]
# Der Vorlagenkopf der Wahlperiode 2014 bis 2020 (Punkt 60). Damals trug jede Vorlage aus der
# Politik denselben Briefkopf — „vorlage 173/ 85/2014 seite 1 von 2 rsd vorlage x öffentlich nicht
# öffentlich  fraktion die linke  der bezirksvertretung 3  an den bezirksvorsteher …" —, und der
# Urheber steht darin zwischen „nicht öffentlich" und dem Gremium.
# Der Anker ist genau diese Formularzeile; sie kommt in der Hauptperiode und in der laufenden
# Periode **nicht ein einziges Mal** vor (0 von 19 108 und 0 von 4 095, gemessen 2026-10-14), weil
# dort der Text erst hinter „betrifft" beginnt. Darum steht das Muster hier im Stadtprofil und
# nicht in einem Periodenprofil: es ist die Vorlagenform dieser Stadt in einer älteren Schreibung,
# so wie [bodies.aliases] ihre ältere Nummernform ist (Punkt 57).
# Das Wort „fraktion" muss im Kopf stehen, bevor das Muster greift: ohne es wäre „leon brink
# mitglied des jugendrates" eine Fraktion. Die Anrede „an herrn bezirksvorsteher" verbietet es
# umgekehrt, hier nach Personen zu suchen — der Empfänger stünde sonst als Urheber da (776
# Dokumente gemessen).
# Es steht in letterhead_markers und nicht in text_markers, weil es ein **Briefkopf** ist und
# darum vor der Dokumentart gilt (Punkt 62): 47 Anträge jener Periode liegen unter
# „Verwaltungsvorlage" und tragen diesen Kopf. Die Bedingung dafür ist gemessen — die Zeile trifft
# keine der 161 Verwaltungsvorlagen, die einen Fraktionsantrag nur zitieren, keine der beiden
# Eingaben nach § 24 GO NRW und keines der 28 Dokumente mit einem Mandatsträger im Titel: ihr
# Text beginnt hinter „betrifft", und die Formularzeile liegt davor.
letterhead_markers = [
    "rsd\\s*vorlage\\s*x?\\s*öffentlich\\s*nicht\\s*öffentlich.{0,80}?(\\w*fraktion|interfraktionell|überfraktionell|ratsgruppe)",
]
# Schwaches Tor für den Titel, erst nach den Personenmarkern befragt: eine Antragsklammer, die
# eine Partei ohne das Wort „Fraktion" nennt („(Antrag BÜNDNIS 90/DIE GRÜNEN)", BV3/065/2021).
# Steht ein Mandatsträger in der Klammer („(Antrag Herr Lemmer-Freie Wähler)"), gewinnt die Klasse
# Person, damit es gleich bleibt, ob der Titel „Herrn Salinger; AfD" oder die Klammer sagt.
name_party_markers = ["\\((antrag|anfrage)[^)]{0,60}\\)"]
text_head_chars = 600          # so viele Zeichen des Texts nach „betrifft"; der Volltext würde Zitate treffen („die cdu-fraktion beantragt" in einer Verwaltungsvorlage)
text_window_chars = 80         # Fenster links und rechts um den Treffer; „(anfrage frau irmer, spd-fraktion, vom 2. august 2023)" braucht beide Seiten

# Die sechs Parteien mit Stimmenspalte (columns.results.parties); patterns kleingeschrieben,
# organizations sind OParl-Organisations-URLs der Seite vom 2026-10-11 (greifen, sobald der Server
# originatorOrganization liefert; Suffix reicht, verglichen wird mit str.endswith).
[[originators.parties]]
key = "CDU"
label = "CDU"
short = "CDU"
patterns = ['\bcdu\b']
organizations = ["/organizations/gr/44"]  # CDU-Ratsfraktion
[[originators.parties]]
key = "GRUENE"
label = "Bündnis 90/Die Grünen"
short = "Grüne"
patterns = ['grüne', 'gruene', 'bündnis ?90', 'bü ?90']  # Schreibvarianten im Titel, auch „BÜNDNINS 90"
organizations = ["/organizations/gr/42"]  # Ratsfraktion BÜNDNIS 90/DIE GRÜNEN
[[originators.parties]]
key = "SPD"
label = "SPD"
short = "SPD"
patterns = ['\bspd\b']
organizations = ["/organizations/gr/400204"]  # Ratsfraktion SPD/Volt (ab 2020-11-01)
[[originators.parties]]
key = "FDP"
label = "FDP"
short = "FDP"
patterns = ['\bfdp\b']
organizations = ["/organizations/gr/49"]  # FDP-Ratsfraktion
[[originators.parties]]
key = "Die_Linke"
label = "Die Linke"
short = "Linke"
patterns = ['\blinke\b']
organizations = ["/organizations/gr/66"]  # Ratsfraktion Die Linke
[[originators.parties]]
key = "AfD"
label = "AfD"
short = "AfD"
patterns = ['\bafd\b']                    # trifft auch die Schreibvariante „AFD" („Haushaltsantrag AFD", 2 Dokumente), weil kleingeschrieben verglichen wird
organizations = ["/organizations/gr/400198", "/organizations/gr/162"]  # AfD-Ratsfraktion; gr/162 ist das Einzelmandat bis 2020-10-31

# Fraktionen und Gruppen ohne Stimmenspalte im Wahlergebnis: sie zählen als Klasse „Fraktion"
# (747 Dokumente), bekommen aber keine Hochburg-Kennzahl, weil es kein <Partei>_anteil gibt.
[[originators.groups]]
key = "T_FW"
label = "Tierschutz/Freie Wähler"
short = "T/FW"
patterns = ['tierschutz', 'freie wähler', 'freie waehler']
organizations = ["/organizations/gr/400202", "/organizations/gr/400238"]  # Gruppe bis 2025-10-31, danach Ratsgruppe Freie Wähler Tierschutz PARTEI
[[originators.groups]]
key = "PARTEI"
label = "Die PARTEI"
short = "PARTEI"
patterns = ['die partei', 'partei-klima', 'klima-fraktion', 'klimafraktion']  # „DIE PARTEI-Klima-Fraktion", „Die Partei-KlimaFraktion"
organizations = ["/organizations/gr/400205"]
[[originators.groups]]
key = "VOLT"
label = "Volt"
short = "Volt"
patterns = ['\bvolt\b']
organizations = []             # Volt sitzt in der Ratsfraktion SPD/Volt, hat also keine eigene Organisation

# --- Option 02: Zeitreihe (docs/plans/02-zeitreihe.md, § 2)

# --- Fundament F6: OParl Sitzungen und Personen (docs/runbook-sitzungen.md)
[council]                      # am 2026-11-23 aus dem Body-Objekt gelesen; meetings und people mit je einer Probe abgerufen, von consultations nur ein Einzelobjekt (docs/runbook-sitzungen.md)
meetings_endpoint = "https://ris-oparl.itk-rheinland.de/Oparl/bodies/0015/meetings"
consultations_endpoint = "https://ris-oparl.itk-rheinland.de/Oparl/bodies/0015/consultations"
persons_endpoint = "https://ris-oparl.itk-rheinland.de/Oparl/bodies/0015/people"  # der Server nennt die Liste people, nicht persons

# --- Vorhaben 15: Dokumentfunktion und gemeinsame Anträge (docs/plans/15-funktion.md) -------------
# Die Tabellen der Dokumentarten aller drei Perioden stehen hier im Stadtprofil, nicht in den
# Periodenprofilen: die Vorlagenform gehört der Stadt (wie Punkt 57 und 60), und deep_merge ersetzt
# Listen. Die Wörter der Ratssprache (Antrag, Anfrage, Resolution …) kommen aus defaults.toml.
# Zahlen vom 2026-11-23 über alle drei Perioden (Messdokument § 3.2 und § 3.3).
[functions]
enabled = true                 # Schritte functions und cosponsors (Vorhaben 15, Stufe 2)
types = { "Beschlussvorlage" = "vollzug/beschlussvorlage", "Bezirksvertretung Beschlussvorlage" = "vollzug/beschlussvorlage", "Beschlussvorlage RPA" = "vollzug/rechnungspruefung", "Bedarfsbeschluss" = "vollzug/bau", "A+F Beschluss" = "vollzug/bau", "Informationsvorlage" = "information/informationsvorlage", "Bezirksvertretung Informationsvorlage" = "information/informationsvorlage", "Berichtsvorlage" = "information/berichtsvorlage", "Eingabe nach 24GO" = "initiative/eingabe", "Eingabe nach 24 GO" = "initiative/eingabe", "Bezirksvertretung Eingabe nach 24Go" = "initiative/eingabe" }  # die Vorlagen der Verwaltung und die Eingaben nach § 24 GO NRW; „A+F Beschluss" ist der Ausführungs- und Finanzierungsbeschluss eines Bauvorhabens
type_prefixes = { "haushaltsantrag" = "initiative/haushaltsantrag", "zanfrage" = "kontrolle/anfrage", "zantrag" = "initiative/antrag", "anfrage" = "kontrolle/anfrage", "antrag" = "initiative/antrag" }  # „Antrag CDU/Grüne", „Haushaltsantrag Die Linke", „zAnfrage REP"; nach 2020 hat damit jede Dokumentart eine Zeile, die Restklasse ist dort 0
# Zwei Wörter dieser Stadt zur Ratssprache aus defaults.toml (Review 2026-11-24, M3): der
# Schreibfehler „pürfantrag" der Quelle und der Dringlichkeitsbeschluss nach § 60 GO NRW, der in
# 6 Titeln von 2014 bis 2020 „60er-Beschluss" heißt. deep_merge ersetzt Listen, darum steht die ganze
# Liste hier; dass sie die aus defaults.toml plus diese Wörter bleibt, prüft
# tests/unit/test_functions_settings.py.
review_title = ['prüfauftrag', 'prüf-?antrag', '(?<![a-zäöüß])prüfung (der|des|von|einer|eines|ob)', 'zu prüfen', 'pürfantrag']
enforcement = [
    { instrument = "haushalt", patterns = ['haushaltssatzung', 'haushaltsplan', 'nachtragshaushalt', 'jahresabschluss', 'gesamtabschluss', 'wirtschaftsplan', 'stellenplan'] },
    { instrument = "satzung", patterns = ['satzung', 'ordnung der', 'gebührenordnung', 'verordnung'] },
    { instrument = "bauleitplanung", patterns = ['bebauungsplan', 'flächennutzungsplan', '(?<![a-zäöüß])plan nr', 'vorhabenbezogene'] },
    { instrument = "besetzung", patterns = ['(?<![a-zäöüß])(neu|nach|um)?wahl (von|der|des|eines|einer|zum|zur)', 'bestellung (von|eines|einer|der|des)', 'benennung', 'entsendung', 'abberufung', 'besetzung'] },
    { instrument = "dringlichkeit", patterns = ['dringlichkeitsentscheidung', 'dringliche[rn]? entscheidung', 'dringlichkeitsbeschluss', '60er-beschluss'] },
]
# Die beiden Sammelarten der Periode 2014 bis 2020: ihre Art nennt die Funktion nicht (9 601 und
# 8 337 Dokumente). Aus der Politik zuerst das Titelwort, dann das erste Instrumentwort im Textkopf
# hinter dem Briefkopf; aus der Verwaltung der Briefkopf der Politik, sonst das erste Merkmal im
# Textkopf (Kenntnisnahme gegen Entscheidung), sonst Titelwörter, sonst die ersten 3 000 Zeichen.
# Die Restklasse (1 231 Dokumente, 5,5 % jener Periode) liegt ganz hier: 269 ohne Text, 145 mit
# einer Anlage am Anfang (§ 3.4).
collection_political = ["Vorlage aus der Politik"]
collection_admin = ["Verwaltungsvorlage"]
text_instrument = [
    '(?<![a-zäöüß])((?:[a-zäöüß]*-?)?(?:antrag|anfrage)|resolution|informationsvorlage|mitteilung|beschlussdarstellung|dringlichkeitsbeschluss)(?![a-zäöüß])',
]  # „… an den bezirksvorsteher … 11.09.2014  antrag quartier rund um den bilker bahnhof"; das Instrumentwort im Text trifft das im Titel in 3 974 von 3 995 Dokumenten (99,5 %, § 3.5)
text_words = [
    { pattern = '.*anfrage', function = "kontrolle/anfrage" },
    { pattern = '.*antrag', function = "initiative/antrag" },  # Änderungs-, Haushalts-, Prüfantrag verfeinern die Titelmuster aus defaults.toml
    { pattern = 'resolution', function = "symbol/resolution" },
    { pattern = 'informationsvorlage|mitteilung', function = "information/informationsvorlage" },
    { pattern = 'beschlussdarstellung|dringlichkeitsbeschluss', function = "vollzug/beschlussvorlage" },
]
text_notice = ['informationsvorlage', 'zur kenntnis', 'kenntnis ?nahme', 'nimmt [^.]{0,200}?kenntnis', 'teilt (die verwaltung )?(wie folgt )?mit', 'hierzu teilt', 'berichtsvorlage', 'sachstandsbericht']
text_decision = [
    'beschließt', 'beschliesst', 'beschlossen', 'empfiehlt', 'genehmigt', 'stimmt [^.]{0,80}?zu', '(?<![a-zäöüß])wählt', 'bestellt', 'benennt', 'entsendet', 'ermächtigt', 'beauftragt', 'bewilligt',
    'beschlussvorschlag', 'beschlussempfehlung', 'stellt [^.]{0,80}?fest', 'erteilt', 'setzt [^.]{0,60}?fest',
]  # an den 11 657 Beschluss-, Informations- und Berichtsvorlagen nach 2020, deren Art die Funktion nennt, trifft die Regel 95,9 % (§ 3.5); der häufigste Fehler ist eine Beschlussvorlage, deren Text zuerst „zur Kenntnis" sagt
text_decision_head = ['beschlussdarstellung']
title_information = ['informationsvorlage', 'mitteilung', '(?<![a-zäöüß])mdv(?![a-zäöüß])', 'sachstand', 'bericht(?!igung)', 'sitzungstermine', 'stellungnahmen', 'beschlusskontrolle', '(?<![a-zäöüß])ergebnisse', '(?<![a-zäöüß])information']
title_decision = ['beschluss(?!kontrolle)', 'satzung', 'bebauungsplan', 'flächennutzungsplan', '(?<![a-zäöüß])plan nr', 'genehmigung', 'vergabe', 'bestellung', 'wahl (der|des|von)']
# Der Briefkopf einer Vorlage aus der Politik in der Form von 2014 bis 2020 (Punkt 60 und 62): der
# Verfasserblock steht zwischen „nicht öffentlich" und dem Gremium, der Anrede oder dem Datum
# („… nicht öffentlich  spd - fraktion  cdu - fraktion  der bezirksvertretung 8  an den
# bezirksbürgermeister …"). Hier ohne das Wort „fraktion", anders als in letterhead_markers oben:
# die Funktion fragt nur, ob ein Dokument aus der Politik kommt.
letterhead = ['rsd\s*vorlage\s*x?\s*öffentlich\s*nicht\s*öffentlich']
letterhead_end = ['(der|des) (bezirksvertretung|rates|ausschuss|integrationsrat|jugendrat)', '(?<![a-zäöüß])an (den|die|das|herrn|frau)(?![a-zäöüß])', '\d{1,2}\.\s?\d{1,2}\.\s?\d{4}']
# Fraktionen aus mehreren Parteischlüsseln (Frage 9.3: aus raw/organizations.json, sobald F6 sie für
# diese Stadt abruft). Die Daten stehen an den Organisationen in [originators] oben.
[[functions.fractions]]
key = "SPD+VOLT"               # Ratsfraktion SPD/Volt (gr/400204), ab 2020-11-01; ohne die Zeile wäre „SPD – Volt" die stärkste Kante ab 2025
parties = ["SPD", "VOLT"]
valid_from = 2020-11-01
[[functions.fractions]]
key = "T_FW+PARTEI"            # Ratsgruppe Freie Wähler Tierschutz PARTEI (gr/400238), nach der Gruppe T_FW bis 2025-10-31
parties = ["T_FW", "PARTEI"]
valid_from = 2025-11-01

# --- Vorhaben 15: Ratsmehrheiten der Stadt (stadtweit; 24 und 28 lesen sie mit) -----------------
# Eine Annahme mit Quelle (Messdokument § 3.9 und Frage 9.2): die Vereinbarung der Partner, gesammelt
# von Vorhaben 25 (docs/plans/25-quellen.md, § 2; die Texte liegen nur lokal), und Drucksachen, in
# denen der Korpus die Mehrheit selbst nennt. Nicht aus den gemeinsamen Anträgen abgeleitet.
# Gültig je Wahlperiode des Rates. Nach den Wahlen 2020 und 2025 begann sie am 1. November (die
# Ratsfraktion SPD/Volt und die Ratsgruppe der laufenden Periode beginnen an diesem Tag, das
# Einzelmandat der AfD und die Gruppe T_FW enden am 31. Oktober davor, [originators] oben);
# Dokumente zwischen Wahl und 31. Oktober stammen also noch vom alten Rat und seiner Mehrheit. Für
# 2014 ist der Tag nicht nachgesehen: die erste Zeile beginnt mit dem Profil duesseldorf-2014 am
# Wahltag, und bis Ende Juni 2014 steht dort kein Fraktionsdokument in Rat oder Ausschuss (nachgezählt
# 2026-11-24, 204 Dokumente). Ein Wechsel innerhalb einer Wahlperiode ist nicht geprüft (Frage 9.9).
[[majorities.terms]]
period = "2014-2020"
parties = ["SPD", "GRUENE", "FDP"]
valid_from = 2014-05-25        # Beginn des Profils duesseldorf-2014 (Ratswahl 2014), nicht der Beginn der Wahlperiode, siehe oben
valid_to = 2020-10-31
agreement = "Kooperationsvereinbarung 2014 – 2020 für die Landeshauptstadt Düsseldorf von SPD, Bündnis 90/Die Grünen und FDP („Ampel“)"
agreement_date = "2014"        # ohne Tag; 174/ 112/2014 vom 2014-10-20 zitiert sie schon
evidence = ["174/ 112/2014", "01/ 2/2015", "BV7/263/2020"]  # 48 Dokumente nennen Ampelmehrheit oder Ampel-Kooperation; die Ampel sind genau diese drei, wie die drei stärksten Kanten in Rat und Ausschüssen zeigen (§ 3.10)
[[majorities.terms]]
period = "2020-2025"
parties = ["CDU", "GRUENE"]
valid_from = 2020-11-01
valid_to = 2025-10-31
agreement = "Gestaltungsbündnis für ein zukunftsfestes Düsseldorf: Kooperationsvereinbarung zwischen CDU Düsseldorf und Bündnis 90/Die Grünen Düsseldorf"
agreement_date = "2021-01"     # „Düsseldorf, Januar 2021"; die Unterzeichnung meldet die Rheinische Post am 2021-01-19
evidence = ["RAT/241/2021", "AWM/046/2021", "RAT/324/2023"]  # 18 Dokumente mit „schwarz-grüne Ratsmehrheit" oder „Kooperation von CDU und Grünen", dazu 520 der Dokumentarten „… CDU/Grüne"
[[majorities.terms]]
period = "2025-"
parties = ["CDU", "GRUENE"]
valid_from = 2025-11-01
agreement = "Gemeinsam für Düsseldorf: Verantwortung übernehmen, Fortschritt gestalten. Koalitionsvertrag zwischen CDU Düsseldorf und Bündnis 90/Die Grünen Düsseldorf"
agreement_date = "2025-12"     # „Düsseldorf, Dezember 2025" (Datei vom 2025-11-30); zusammen 51 von 92 Sitzen
evidence = ["RAT/073/2026", "RAT/120/2026"]  # 4 Dokumente mit „Ratsmehrheit aus CDU und Grünen" oder „schwarz-grüne Ratsmehrheit", dazu 56 der Dokumentarten „… CDU/Grüne"

# --- Vorhaben 14: Vorgänge (docs/plans/14-vorgaenge.md; Rückfallregel, § 5.1)
[procedures]
enabled = true                 # die Schritte references und procedures; erben alle drei Perioden
# Messdokument § 3.6: „Stellungnahme" allein ist zu breit (IHK, ver.di, Abwägung nach BauGB: 663
# Anlagen über alle Dokumentarten), darum nur die der Verwaltung; „anrwort" steht siebenmal als
# „Anrwort der Verwaltung" an alten Drucksachen. Häufigste Namen an Anfragen: „Antwort der
# Verwaltung" 1 293, „Beantwortung" 156, „Antworten der Verwaltung zu NN/ NN/NNNN" 88.
answer_attachment = '(^|[^a-zäöü])(be)?antwort|verwaltungsantwort|anrwort|stellungnahme (der |des )?(verwaltung|dezernat|amt)'
# Am 2019-07-03 bekamen alle Anlagen älterer Drucksachen dieses Datum: 28 451 Anlagen, die
# Umstellung des Ratsinformationssystems; es ist kein Antwortdatum (§ 3.6).
attachment_dates_invalid = [2019-07-03]
attachments = "snapshots/duesseldorf-anlagen/raw/anlagen.parquet"  # alle drei Perioden; je Profil zählen die eigenen Drucksachen

# Die Formen der Drucksachennummer (§ 3.1); jede der 45 418 Düsseldorfer Nummern trifft genau eine.
[[procedures.forms]]
name = "heute"                 # KÜRZEL[NR]/laufende Nummer/Jahr[/Nachtrag], etwa BV6/108/2023, OVA/117/2023/1
reference = '(?P<code>[A-ZÄÖÜ]+)(?P<number>\d{1,2})?/(?P<serial>\d+)/(?P<year>\d{4})(?:\s*[/-]+\s*(?P<suffix>\d+))?'
text = '(?<![a-zäöüß])(?P<code>[a-zäöüß]+)\s?(?P<number>\d{0,2})\s?/\s?(?P<serial>\d{1,4})\s?/\s?(?P<year>\d{4})(?!\d)(?:\s?/\s?(?P<suffix>\d{1,2})(?![\d.,]))?'
key = "{code}{number}/{serial}/{year}"
glued = true                   # pypdf klebt Wörter: „vorlagebv6/002/2023" (169 Verweise im Text, 1 im Titel)
[[procedures.forms]]
name = "bis 2019"              # Punkt 57: <Amt>/ <laufende Nummer>/<Jahr>[ - Nachtrag], etwa 61/ 12/2014
reference = '(?P<head>\d{2,3})/\s*(?P<serial>\d+)/(?P<year>\d{4})(?:\s*[-/]\s*(?P<suffix>\d+))?'
text = '(?<![\d.,/])(?P<head>\d{2,3})/\s{0,2}(?P<serial>\d{1,4})/(?P<year>\d{4})(?!\d)(?:\s?-\s?(?P<suffix>\d{1,2})(?![\d.,]))?'
key = "{head}/{serial}/{year}"

# Dokumentart -> Rolle im Vorgang (§ 2, Tabelle „Dokumentarten"); die erste passende Regel gilt,
# der Rest ist „sonst". Gelesen wird die getrimmte, kleingeschriebene Dokumentart.
[[procedures.kinds]]
role = "anfrage"
paper_type = '^(anfrage|zanfrage)'
[[procedures.kinds]]
role = "antrag"
paper_type = '^(antrag|zantrag|haushaltsantrag)|fraktionsantrag|mitgliederantrag'
[[procedures.kinds]]               # bis 2019 waren Antrag und Anfrage eine Art; der Titel trennt sie
role = "anfrage"
paper_type = '^vorlage aus der politik$'
title = 'anfrage'
title_not = 'antrag'
[[procedures.kinds]]
role = "antrag"
paper_type = '^vorlage aus der politik$'
title = 'antrag'
[[procedures.kinds]]               # ohne „Anfrage" und „Antrag" im Titel (5 239 Dokumente, Frage 9.6)
role = "politik"
paper_type = '^vorlage aus der politik$'
[[procedures.kinds]]
role = "bedarf"
paper_type = '^bedarfsbeschluss$'
[[procedures.kinds]]               # Ausführungs- und Finanzierungsbeschluss eines Bauvorhabens, keine Antwort (§ 2)
role = "af"
paper_type = '^a\+f beschluss$'
[[procedures.kinds]]
role = "information"
paper_type = 'informationsvorlage|berichtsvorlage'
[[procedures.kinds]]
role = "vorlage"
paper_type = 'änderungsvorlage|beschlussvorlage|beratungsvorlage|^verwaltungsvorlage$'
[[procedures.kinds]]
role = "eingabe"
paper_type = '^eingabe|eingabe nach'

# Die Nachbarperioden derselben Stadt, aus ihren Paketen: eine Kante darf über die Wahl gehen
# (2 599 der Düsseldorfer Kanten, Messdokument § 3.3, Frage 9.2). Jedes Profil liest die anderen;
# die eigenen Drucksachen kommen aus dem eigenen Korpus. Die Hauptperiode als Nachbar liest die
# Metadaten aus paper_objects.json, dem Altformat ohne Texte: dieselben 19 108 Paper mit denselben
# Feldern wie paper_with_text.json (geprüft am 2026-11-24), in einem Zehntel der Zeit.
[[procedures.related]]
profile = "duesseldorf-2014"
papers = "snapshots/2014-2020/raw/papers.jsonl"
texts = "snapshots/2014-2020/cache/text/texts.parquet"
[[procedures.related]]
profile = "duesseldorf"
papers = "reference/raw/paper_objects.json"
texts = "snapshots/duesseldorf-texte/cache/text/texts.parquet"
[[procedures.related]]
profile = "duesseldorf-2025"
papers = "snapshots/2025/raw/papers.jsonl"
texts = "snapshots/2025/cache/text/texts.parquet"

# --- Vorhaben 18: Einbettungen, Ähnlichkeit, Suche (docs/plans/18-einbettungen.md) --------------
# Gemessen an dieser Periode; die Perioden erben den Schalter. Was die Stücke bestimmt, steht
# stadtneutral in defaults.toml, die Präfixe des Modells unter [ml.embedding].
[embeddings]
enabled = true                 # Schritte embeddings (nur `georep run --models`) und neighbors
neighbors_package = "snapshots/duesseldorf-aehnlich/raw/aehnliche_dokumente_paket.parquet"  # die zehn ähnlichen Dokumente je Korpus-ID, ohne Vektoren (snapshots/duesseldorf-aehnlich/README.md); bootstrap legt sie nach raw/, neighbors nimmt sie, wo es keine Dokumentvektoren gibt (Pages)

# --- Vorhaben 17: Zeit und Neuigkeiten (docs/plans/17-zeit.md) ---------------------------------
# Die Wahltage der Kommunalwahlen in NRW (Landeswahlleiterin NRW: Kommunalwahlen am 25. Mai 2014,
# 13. September 2020 und 14. September 2025). Sie trennen die drei Datensätze der Stadt
# (duesseldorf-2014 beginnt am Wahltag 2014, die Hauptperiode am Wahltag 2020, duesseldorf-2025 am
# Tag danach) und machen 2019/20 und 2024/25 zu Vorwahljahren (H17.1). Die Periodenprofile erben
# den Block; die Tests über alle drei rechnet duesseldorf-vergleich.
[cycles]
enabled = true                 # Schritte cycles und vocabulary in jedem Profil der Stadt
elections = [2014-05-25, 2020-09-13, 2025-09-14]
instrument_types = { zanfrage = "anfrage", zantrag = "antrag" }  # S1.5: die Dokumentarten „zAnfrage …" und „zAntrag …" dieser Stadt (2014 bis 2020, vereinzelt danach), zu den Präfixen aus defaults.toml
# --- Vorhaben 22: Bedarf und Aufmerksamkeit (docs/plans/22-bedarf.md, § 6, § 8 und § 10) ----------
# Die Quellen stehen in defaults.toml (bundes- und landesweit, Gemeinde = city.ags); hier schaltet die
# Stadt ein und nennt das Paket mit ihren Auszügen, die Klassen des passenden Ausschusses und die
# Hypothesen, die vor der ersten Rechnung festgelegt wurden (Commit 67f7250, 2026-11-23). hb_score,
# anteil_u18 und mindestsicherung sind Variablen des Quartiersatlas oben ([[context.variables]]).
[context.need]
enabled = true                 # Schritte need und, mit context.need.fetch, need_data (Netz)
package = "snapshots/duesseldorf-bedarf"  # georep pack --need; bootstrap kopiert nach external/bedarf/
explore = [                    # weitere Paare aus § 3.5, explorativ; Lärm und Kitas kommen in Stufe 2 nicht mit (Frage 22.2)
  ["unfaelle_rad_fuss", "anteil_verkehr"],
  ["unfaelle_je_1000", "dok_verkehr_je_1000_ew"],
  ["mindestsicherung", "dok_je_1000_ew"],
  ["miete_qm", "dok_je_1000_ew"],
  ["hb_score", "wahlbeteiligung"],
  ["hb_score", "anteil_verkehr"],
  ["hb_score", "sozialindex_schulen"],
  ["sozialindex_schulen", "dok_je_1000_ew"],
  ["unfaelle_je_1000", "hb_score"],
]

[context.need.classes]         # Klassen des Ausschussklassifikators (Option 05); später aus Vorhaben 19, wenn es gebaut wird
traffic = ["OVA"]              # Ordnungs- und Verkehrsausschuss; auf der Seite „Ordnung und Verkehr" (Frage 22.11)
youth = ["JHA", "SCHUA"]       # Jugendhilfeausschuss, Schulausschuss

[[context.need.hypotheses]]    # Messdokument § 8: einseitig, rho > 0
name = "H1"
need = "unfaelle_je_1000"
attention = "anteil_verkehr"
alternative = "greater"
fixed = "67f7250"
robust_need = ["unfaelle_scharf_je_1000", "unfaelle", "unfaelle_je_km2"]  # scharf zugeordnet, absolut, je km²
robust_without = [1, 10]       # § 8: alle drei auch ohne die Wahlbezirke 1 und 10, vorab festgelegt

[[context.need.hypotheses]]    # zweiseitig: rho > 0 „Aufmerksamkeit folgt dem Bedarf", rho < 0 „ungleiche Aufmerksamkeit"
name = "H2"
need = "hb_score"
attention = "dok_je_1000_ew"
alternative = "two-sided"
fixed = "67f7250"
robust_attention = ["trefferquote"]  # die Kennzahl der Seite, je Wahlberechtigtem
robust_control = "log_begriffe"      # partiell bei fester Wörterbuchgröße
robust_without = [1, 10]

[[context.need.hypotheses]]    # einseitig, rho > 0
name = "H3"
need = "anteil_u18"
attention = "anteil_jugend"
alternative = "greater"
fixed = "67f7250"
robust_without = [1, 10]
