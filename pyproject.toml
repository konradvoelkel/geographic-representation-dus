[project]
name = "georep"
version = "0.14.0"
description = "Geografische Repräsentation in Ratsdokumenten: Ortsmarker je Wahlbezirk, Treffer in OParl-Dokumenten, Zusammenhang mit der Wahlbeteiligung"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Lukas Bartzsch" }, { name = "Konrad Völkel" }]
requires-python = ">=3.14"
dependencies = [
    # Pipeline
    "flashtext>=2.7",
    "loguru>=0.7.3",
    "numpy>=2.2.5",
    "polars>=2,<3",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "pypdf>=6.6.2",
    "pyyaml>=6.0.3",
    "requests>=2.32.4",
    "scipy>=1.16.2",
    "shapely>=2.1.2",
    "pyproj>=3.7",
    "requests-cache>=1.2",
    "deal>=4.24.6",
    "jinja2>=3.1",
    "scikit-learn>=1.9",
    "pyshp>=3.1",
]

[project.scripts]
georep = "georep.cli:main"

[dependency-groups]
dev = [
    "crosshair-tool>=0.0.111",
    "hypothesis>=6.168",
    "mypy>=2.4",
    "nox>=2025.5",
    "pytest>=9.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1",
    "pytest-gremlins>=1.11.4",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17",
    "snakeviz>=2.2.2",
    "syrupy>=5",
    "types-pyyaml",
    "types-requests",
    "types-shapely>=2.1.0.20260728",
]
notebook = [
    "jupyterlab",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Das Notebook bleibt bis Phase 2, wie abgegeben; dann zieht die Mathematik ins Modul.
extend-exclude = [".idea", "*.ipynb"]

[tool.ruff.lint]
# Die fuenf Gruppen des eipy-Skripts; SIM, RUF, ANN kommen dazu, sobald diese sauber sind.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Zeilenlaenge meldet der Formatter, nicht der Linter

[tool.ruff.lint.isort]
known-first-party = ["src", "georep"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"] # assert False ist in Tests in Ordnung

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# Das deal-Plugin prüft die Lambda-Signaturen der Verträge gegen die Funktion (Phase 6).
plugins = ["deal.mypy"]
python_version = "3.14"
strict = true
# Basis src -> georep.*, Basis . -> tests.*; so heisst src/georep/io.py nur georep.io.
explicit_package_bases = true
mypy_path = ["src", "."]
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src/georep", "tests"]

[[tool.mypy.overrides]]
# Ohne Stubs und ohne py.typed, Stand 2026-10-12: flashtext (letzte Version 2018, hinter dem
# Matcher-Protokoll), scipy (linregress, pearsonr, spearmanr), sklearn (nur TfidfVectorizer und
# NMF in analysis/topics.py; scikit-learn 1.9.1 liefert kein py.typed) und shapefile (pyshp 3.1.6
# hat Annotationen, aber keine py.typed-Marke; gelesen wird es nur in prep/precincts.py).
module = ["flashtext.*", "scipy.*", "sklearn.*", "shapefile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
markers = [
    "slow: laeuft ueber den vollen Referenzkorpus (Sekunden bis Minuten)",
    "network: braucht echte Endpunkte; nie in CI",
    "bench: Laufzeit mit pytest-benchmark gegen die gespeicherte Baseline; nur in nox -s bench",
]

[tool.coverage.run]
source = ["georep"]

[tool.coverage.report]
skip_covered = true
show_missing = true
