# Baut die Berichtsseite aus den Referenzdaten (bootstrap, run; kein Netzabruf) und lädt data/site
# nach GitHub Pages. Quelle in den Repo-Einstellungen: Pages, Source „GitHub Actions" (Konrads Handgriff).
# Actions per SHA gepinnt wie in ci.yml; Push per SSH, das gh-Token hat keinen workflow-Scope.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - run: uv run georep bootstrap
      - run: uv run georep run
      # Option 02: die zweite Wahlperiode und der Vergleich, sobald ihr Schnappschuss im Repo
      # liegt (docs/plans/02-zeitreihe.md, Stufe H). Ohne ihn baut der Workflow wie bisher nur
      # die Hauptperiode; der Abschnitt „Zwei Wahlperioden" fehlt dann einfach.
      - name: Zweite Periode und Vergleich, wenn der Schnappschuss da ist
        run: |
          if [ ! -d snapshots/2014-2020 ]; then
            echo "snapshots/2014-2020 fehlt: nur die Hauptperiode"
            exit 0
          fi
          uv run georep --settings settings.2014.toml bootstrap || exit 1
          uv run georep --settings settings.2014.toml run || exit 1
          uv run georep --settings settings.vergleich.toml run || exit 1
          rm -rf data/site/2014-2020 || exit 1
          cp -r data/2014-2020/site data/site/2014-2020 || exit 1
      - run: ls -la data/site data/site/data && uv run georep status
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: data/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
