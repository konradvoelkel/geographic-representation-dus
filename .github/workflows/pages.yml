# Baut die Berichtsseite aus den Referenzdaten (bootstrap, run; kein Netzabruf), stellt mit
# `georep publish` data/site zusammen und lädt den Ordner nach GitHub Pages. Jede Stadt rechnet
# unter ihrem Slug (data/<slug>/site/, decisions.md Punkt 52); erst `publish` legt die erste Stadt
# an die Wurzel, darum bleibt die veröffentlichte Adresse dieselbe. Die Unterseite einer zweiten
# Periode gehört in den Ordner ihrer Stadt, nicht nach data/site: sonst nähme die Kopie der
# Stadtseite sie nicht mit. Pfade kommen aus `georep paths`, nirgends zweimal.
# Quelle in den Repo-Einstellungen: Pages, Source „GitHub Actions" (Konrads Handgriff).
# Actions per SHA gepinnt wie in ci.yml; Push per SSH, das gh-Token hat keinen workflow-Scope.
# Seit die Datenpakete im Repo liegen (Punkt 56), bricht ein Fehler in **irgendeinem** Block den
# ganzen Deploy ab, und das ist Absicht: die Daten sind da, also ist ein fehlgeschlagener Teil ein
# Fehler und keine fehlende Eingabe. Die drei `if [ ! -d … ]`-Wachen bleiben trotzdem stehen --
# sie sind die Zusage, dass ein Klon ohne ein Paket die uebrigen Seiten weiter baut.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - run: uv run georep bootstrap
      - run: uv run georep run
      # Option 02: die zweite Wahlperiode und der Vergleich, sobald ihr Schnappschuss im Repo
      # liegt (docs/plans/02-zeitreihe.md, Stufe H). Ohne ihn baut der Workflow wie bisher nur
      # die Hauptperiode; der Abschnitt „Zwei Wahlperioden" fehlt dann einfach.
      - name: Zweite Periode und Vergleich, wenn der Schnappschuss da ist
        run: |
          if [ ! -d snapshots/2014-2020 ]; then
            echo "snapshots/2014-2020 fehlt: nur die Hauptperiode"
            exit 0
          fi
          uv run georep --profile duesseldorf-2014 bootstrap || exit 1
          uv run georep --profile duesseldorf-2014 run || exit 1
          uv run georep --profile duesseldorf-vergleich run || exit 1
          # Der Abschnitt „Zwei Wahlperioden" verlinkt <profil>/ relativ zur Stadtseite, also
          # gehört die Unterseite in deren Ordner; publish nimmt sie mit.
          # Die Ausgabe von `paths` geht in RUNNER_TEMP, nicht in den Klon: dort raeumt der
          # Runner selbst auf, und kein Lauf legt Dateien neben die Quellen.
          uv run georep paths >"$RUNNER_TEMP/main.paths" || exit 1
          uv run georep --profile duesseldorf-2014 paths >"$RUNNER_TEMP/period.paths" || exit 1
          MAIN=$(sed -n 's/^site=//p' "$RUNNER_TEMP/main.paths")
          PERIOD=$(sed -n 's/^site=//p' "$RUNNER_TEMP/period.paths")
          PROFILE=$(sed -n 's/^profile=//p' "$RUNNER_TEMP/period.paths")
          [ -n "$MAIN" ] && [ -n "$PERIOD" ] && [ -n "$PROFILE" ] || exit 1
          rm -rf "$MAIN/$PROFILE" || exit 1
          cp -r "$PERIOD" "$MAIN/$PROFILE" || exit 1
      # Option 07: die laufende Periode, sobald ihr Schnappschuss im Repo liegt
      # (snapshots/2025/README.md). Derselbe Handgriff wie fuer die zweite Periode; der Link auf
      # diese Unterseite steht als report.monitoring_url im Stadtprofil, die Hauptseite oben trägt
      # ihn also schon. Der Schnappschuss ist der Erstabruf und veraltet mit jedem Lauf des
      # Monitors (deploy/README.md); Pages zeigt seinen Stand, die Seite nennt ihr Abrufdatum.
      - name: Laufende Periode, wenn ihr Schnappschuss da ist
        run: |
          if [ ! -d snapshots/2025 ]; then
            echo "snapshots/2025 fehlt: keine Unterseite der laufenden Periode"
            exit 0
          fi
          uv run georep --profile duesseldorf-2025 bootstrap || exit 1
          uv run georep --profile duesseldorf-2025 run || exit 1
          uv run georep paths >"$RUNNER_TEMP/main.paths" || exit 1
          uv run georep --profile duesseldorf-2025 paths >"$RUNNER_TEMP/monitor.paths" || exit 1
          MAIN=$(sed -n 's/^site=//p' "$RUNNER_TEMP/main.paths")
          PERIOD=$(sed -n 's/^site=//p' "$RUNNER_TEMP/monitor.paths")
          PROFILE=$(sed -n 's/^profile=//p' "$RUNNER_TEMP/monitor.paths")
          [ -n "$MAIN" ] && [ -n "$PERIOD" ] && [ -n "$PROFILE" ] || exit 1
          rm -rf "$MAIN/$PROFILE" || exit 1
          cp -r "$PERIOD" "$MAIN/$PROFILE" || exit 1
      # Option 01: die zweite Stadt baut nur mit, wenn ihr Paket unter reference/<slug>/ liegt;
      # sonst meldet publish sie als "kein Lauf" und die Vergleichsseite entfällt (Exit 0).
      - name: Zweite Stadt, wenn ihr Paket da ist
        run: |
          if [ -d reference/moenchengladbach ]; then
            uv run georep --profile moenchengladbach bootstrap || exit 1
            uv run georep --profile moenchengladbach run || exit 1
          fi
      # --strict-budget macht den Lauf rot, wenn eine veroeffentlichte Seite ueber
      # report.page_budget_bytes liegt (Punkt 50): von Hand ist das eine Notiz, hier eine Zusage.
      # Geprueft werden alle Seiten im Zielordner, auch die Unterseiten und vergleich.html.
      - name: Stadtseiten und Vergleich veroeffentlichen
        run: uv run georep publish --strict-budget
      - run: ls -la data/site data/site/data
      # Je Profil eine Zeile: der Settings-Fingerprint ist global, und die Hauptseite baut zuletzt
      # das Vergleichsprofil -- ein `georep status` mit dem Standardprofil meldete darum jeden
      # Schritt als "offen: Settings geändert" und sagte nichts (Review 2026-10-14).
      - name: Frische je Profil
        run: |
          for profile in duesseldorf-vergleich duesseldorf-2014 duesseldorf-2025 moenchengladbach; do
            echo "--- $profile"
            uv run georep --profile "$profile" status || exit 1
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: data/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
