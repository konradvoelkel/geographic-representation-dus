# Der wiederkehrende Qualitaetslauf: crosshair ueber die Vertraege und eine gezielte
# Mutationssitzung. Beides ist kein Gate (docs/decisions.md, Punkt 12): es laeuft nicht bei jedem
# Push, sondern einmal die Woche und von Hand, und es faellt nur rot, wenn ein Werkzeug einen
# echten Befund hat -- crosshair bei einem Gegenbeispiel, gremlins bei einem Abbruch.
# Kein Netz (alle Tests arbeiten gegen die Fixtures), kein Pages-Schritt.
#
# Laufzeit, gemessen am 2026-10-13 auf dem GitHub-Runner (Lauf 38435284676, von Hand gestartet):
#   verify   9 min 39 s mit 31 Zielen (lokal 580 s; crosshair begrenzt jede Bedingung auf 20 s)
#   alone    5 min 15 s (97 Dateien einzeln plus die Suite rueckwaerts; lokal 228 s)
#   mutate  14 min 53 s fuer `nox -s mutate -- fast --gremlin-workers=2` (lokal 539 s)
# Zusammen mit Checkout und `uv sync` 30 min; `timeout-minutes: 45` laesst 15 min Luft. Reisst ein
# Lauf sie, faellt der Mutationsschritt weg und verify plus alone bleiben -- die Mutationssitzung ist
# ohnehin kein Gate.
#
# WICHTIG: die Session mutate laeuft **je Modul eine eigene Sitzung** mit genau den Testdateien
# des Moduls (noxfile.py, MUTATION_SCOPE). Das ist keine Bequemlichkeit: die abdeckungsgefuehrte
# Testauswahl von gremlins liefert hier keine Daten, und ohne sie laeuft jeder Mutant gegen alle
# uebergebenen Tests. Eine Sitzung mit `tests/unit tests/property tests/golden` als Auswahl war
# deshalb nach 240 s noch nicht beim ersten Mutanten (Review 2026-10-13).
#
# `fast` ist die Abkuerzung fuer die acht Module, die unter 90 s brauchten. Nicht dabei, mit
# gemessener Zahl: report/publish.py (197 s), analysis/parties.py (168 s), analysis/ols.py
# (166 s), crosswalk.py (141 s), report/comparison.py (116 s) und analysis/topics.py (jeder
# Mutant rechnet NMF). Sie bleiben dem Lauf von Hand.
# Actions per SHA gepinnt wie in ci.yml; Workflow-Dateien gehen nur per SSH ins Repo, das
# gh-Token hat keinen workflow-Scope.
name: quality

on:
  schedule:
    # Montags um 04:17 UTC: ausserhalb der Stosszeiten der Runner, und die Minute ist krumm,
    # damit der Lauf nicht mit jedem anderen Cron zusammenfaellt.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - name: Vertraege mit crosshair pruefen
        run: uv run nox -s verify
      - name: Reihenfolgeunabhaengigkeit der Tests
        run: uv run nox -s alone
      - name: Gezielte Mutationssitzung
        # `fast` waehlt die acht Module unter 90 s; der Schalter geht an pytest weiter.
        run: uv run nox -s mutate -- fast --gremlin-workers=2
      # Kein Artefakt-Upload: der Konsolenbericht steht im Log, und eine weitere Action waere eine
      # weitere Lieferkette (PLAYBOOK, Supply-Chain-Pinning). Wer die JSON-Datei will, laesst die
      # Sitzung lokal laufen; `coverage/gremlins/` ist gitignored.
