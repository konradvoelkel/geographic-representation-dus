# Vorhaben 18: die 50 Suchfragen der Messung, vorab festgelegt am 2026-11-23 (Messdokument § 3.1).
#
# Geschrieben aus der Sicht von Fraktionsmitarbeitern aller Parteien, bevor ein Verfahren
# (BM25, Einbettung, Mischung) auf eine Frage lief. Vorher gelesen: 80 zufällige Titel des
# Korpus (Seed 7) als Eindruck der Themen; keine Frage ist an einem Treffer geprüft.
#
# id      fest, a01 bis a50; Teil des Schlüssels nur über `anfrage`
# anfrage was das Verfahren sieht, wörtlich
# bedarf  was der Fragende sucht; sehen nur die Kodierer (Spalte `bedarf` im Auftrag), nie ein
#         Verfahren. Höchstens 300 Zeichen, kein Ratstext
# form    wort:        Stichwort im Wortlaut der Verwaltung, das in einschlägigen Dokumenten so
#                      steht (Flexion und Zusammensetzung dürfen abweichen)
#         umschrieben: Umgangssprache, Synonym oder Oberbegriff; die einschlägigen Dokumente sagen
#                      es meist anders (Radweg, Schutzstreifen, Fahrradstraße für „Radverkehr")
#         frage:       ein ganzer Satz, wie er in ein Suchfeld getippt wird
# art     thema | ort | vorhaben

