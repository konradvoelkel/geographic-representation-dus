# Codebuch für Vorhaben 13 „Dubletten und Dokumentfamilien" (Stufe 1, vorläufiges Format bis F4).
# Messdokument: docs/plans/13-dubletten.md, § 4. Stichprobe: stichprobe.csv (IDs, Stufe, Größe der Stufe, Jaccard; kein Text),
# Ausschnitte lokal unter messdaten/kodierung/13-dubletten/aufgaben.jsonl, nie im Repo.

vorhaben = "13-dubletten"
version = 1
datum = "2026-11-23"
einheit = "Dokumentpaar"
frage = """
Sind die beiden Ratsdokumente dasselbe Dokument oder Fassungen derselben Sache, sodass eine
Zählung „wie oft kommt ein Ort in den Ratsdokumenten vor" sie nur einmal zählen sollte?
"""
anleitung = """
Lies Titel, Drucksachennummer, Datum, Art, Gremium und die beiden Ausschnitte (Anfang des Texts,
höchstens 1 500 Zeichen; `zeichen` nennt die volle Länge). Entscheide nach dem Inhalt, nicht nach
dem Aufbau: zwei Texte aus demselben Formular oder derselben Vorlage sind nicht deshalb gleich.
„Sache" heißt: dasselbe Vorhaben, derselbe Ort oder dieselbe Frage, derselbe Berichtszeitraum,
dieselbe Förderung. Wähle genau eine Option. Wenn der Ausschnitt nicht reicht, entscheide nach
dem, was Titel, Datum und Ausschnitt zusammen am wahrscheinlichsten machen, und sage es in der
Begründung. Du siehst keine Zahl des Verfahrens, und du sollst keine suchen.
"""
# Antwort je Paar, eine JSON-Zeile: {"paar": "p001", "code": "<code>", "begruendung": "<ein Satz>"}
antwort_felder = ["paar", "code", "begruendung"]

[[optionen]]
code = "gleich"
name = "gleich"
definition = """
Derselbe Text zur selben Sache. Unterschiede höchstens in Kopf und Rahmen: Drucksachennummer,
Datum, adressiertes Gremium (etwa eine andere Bezirksvertretung), Sitzungstermin, Seitenzahlen,
Satz und Formatierung, Tippfehler.
"""
beispiel = """
BV5/136/2024 und BV2/221/2024 „Sachstandsbericht zum Lärmaktionsplan IV": dieselbe
Informationsvorlage der Verwaltung an zwei Bezirksvertretungen. Ebenso ein Antrag, der unverändert
in einer späteren Sitzung wieder eingebracht wird (BV8/214/2024 und BV8/032/2025).
"""

[[optionen]]
code = "fast_gleich"
name = "fast gleich, gleiche Sache"
definition = """
Weitgehend derselbe Text zur selben Sache, mit inhaltlichen Änderungen: eine ergänzte oder
geänderte Fassung (Nummer mit /1, /2), ein ergänzter oder gestrichener Absatz, ein geänderter
Beschlussvorschlag, aktualisierte Zahlen oder Termine zur selben Maßnahme, eine Wiedervorlage mit
Ergänzung, zwei Anträge derselben Antragsteller zum selben Ort in kaum veränderter Fassung.
"""
beispiel = """
KUA/123/2024 und KUA/123/2024/1 „Weiterentwicklung der Wochenendöffnungen von
Stadtteilbüchereien": die zweite Fassung derselben Beschlussvorlage.
"""

[[optionen]]
code = "aehnlich_andere_sache"
name = "ähnlich, andere Sache"
definition = """
Gleicher Aufbau, gleiche Vorlage oder viel gemeinsamer Standardtext, aber eine andere Sache: ein
anderer Berichtszeitraum eines wiederkehrenden Berichts, ein anderer Ort oder ein anderes Objekt
derselben Maßnahmenart, ein anderer Zuschussempfänger desselben Förderformulars, eine andere
Person bei einer Wahl oder Ersatzwahl, derselbe Musterantrag für einen anderen Stadtbezirk mit
eigenem Ort.
"""
beispiel = """
RAT/143/2024 und RAT/099/2025 „Beschlusskontrolle des Rates": derselbe Bericht für verschiedene
Zeiträume. BV6/093/2024 und BV6/200/2024 „Baumfällungen im Stadtbezirk 6": dieselbe
Mitteilungsform für verschiedene Kalenderwochen und Bäume.
"""

[[optionen]]
code = "verschieden"
name = "verschieden"
definition = """
Die Texte haben außer Floskeln (Briefkopf, Anrede, Grußformel, Rechtsbehelfsbelehrung, Standardsätze
zu Finanzen oder Klima) nichts gemeinsam; sie behandeln verschiedene Sachen in verschiedener Form.
"""
beispiel = """
Ein Antrag zu einer Bushaltestelle und eine Informationsvorlage zu einem Kita-Neubau, die nur den
Kopf der Bezirksvertretung teilen.
"""

[praezision]
# Für die Präzision der Familien zählt ein Paar als richtig, wenn es eine dieser Optionen trägt.
richtig = ["gleich", "fast_gleich"]
# Die strenge Lesart (nur unveränderte Texte) steht daneben.
richtig_streng = ["gleich"]
# Gewichtung: Paare tragen das Gewicht grundgesamtheit / gezogen ihrer Stufe (stichprobe.csv).
# Vorab festgelegt (13-dubletten.md, § 5): τ* ist die kleinste Grenze der Stufen, für die die
# gewichtete Präzision über alle Paare mit J ≥ τ* mindestens 0,95 ist; erreicht keine sie, gilt
# das Kriterium als verfehlt.
schwellen = [0.70, 0.80, 0.85, 0.90, 0.95]
mindestpraezision = 0.95
