[text]
source = "raw"                 # der Ausschnitt ist die Eingabe der Modelle aus dem Rohtext (Abschnitte aus Vorhaben 11)
chars = 8500                   # Abschnittstext höchstens 8 000 Zeichen und vier Kopfzeilen
title = true
