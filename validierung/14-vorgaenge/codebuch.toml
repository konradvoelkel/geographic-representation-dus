# Codebuch Vorhaben 14 „Vorgänge". Fassung 2026-11-23.2 nach der Kodierung der ersten 150 Kanten
# (Messdokument docs/plans/14-vorgaenge.md, § 3.9). Fassung .1, nach der labels.csv kodiert ist,
# liegt in Commit 8941650 (`git show 8941650:validierung/14-vorgaenge/codebuch.toml`).
# Vorläufiges Format: F4 baut den Rahmen (`georep validate`); die Fragen bleiben. Stichproben:
# stichprobe.csv (Runde 1, .1), stichprobe-2.csv (Bestätigung, .2), nur IDs; Kodieraufgaben mit
# Ausschnitten lokal unter messdaten/kodierung/14-vorgaenge/ (aufgaben.jsonl, aufgaben-2.jsonl).

[meta]
vorhaben = "14-vorgaenge"
version = "2026-11-23.2"
einheit = """Eine Kante zwischen zwei Drucksachen derselben Stadt: B (die spätere, nennende) nennt A \
(die frühere, genannte) mit ihrer Drucksachennummer im Titel, im Text oder im Namen einer Anlage, \
oder B ist ein Nachtrag zu A (dieselbe Nummer mit Zusatz wie /1 oder -1)."""
stichprobe = "Runde 1: 150 Kanten, Seed 14 (stichprobe.csv); Bestätigung: 100 starke Kanten der Fassung .2, Seed 14-2, ohne die 150 (stichprobe-2.csv)"
kodierer = """Zwei unabhängige Kodier-Agenten, die einander nicht sehen, und ein Schlicht-Agent nur für \
die Uneinigkeiten (plan-vorverarbeitung-2026-11.md, § 2.6 und F4). Kein menschlicher Goldstandard."""
material = """Je Dokument: Drucksachennummer, Titel, Dokumentart, Datum, Gremium, Namen der Anlagen und \
der Textanfang (bis 1 500 Zeichen; der Textstore ist kleingeschrieben und ohne Zeilenumbrüche). Dazu \
die Fundstelle in B: 300 Zeichen links und rechts der genannten Nummer, mit Start und Ende des \
Treffers im Ausschnitt. Bei Nachträgen ohne Nennung fehlt die Fundstelle."""
nicht_gezeigt = "Der Kantentyp, den das Verfahren vergibt (F4: ohne die Ausgabe des zu prüfenden Verfahrens)."
aenderungen = """.2 gegenüber .1: (1) Sammelvorlagen und Beschlusskontrollen mit eigener Zeile zu A sind \
dieselbe Sache und umsetzung, eine bloße Aufzählung früherer Beschlüsse nicht; (2) ein \
Grundsatzbeschluss ist dieselbe Sache, wo B ihn ausführt, nicht, wo B ihn als Rahmen zitiert; (3) eine \
Finanzierungsquelle und ein Beleg in Fußnote, Quellenliste oder mit „vgl." sind keine selbe Sache; (4) \
nachfrage umfasst die Frage nach dem Stand von A, auch wenn A ein Antrag oder Beschluss ist; (5) \
fortsetzung umfasst den Antrag auf eine in A erfragte oder geprüfte Maßnahme und den Folgebericht; (6) \
aenderung umfasst den späteren Beschluss, der A inhaltlich ändert, und die abschließende Antwort nach \
einer Zwischennachricht; (7) für die Rolle zählt, was A und B inhaltlich sind, nicht das Feld \
Dokumentart; (8) bei Sammelanträgen genügt, dass B genau einen Punkt von A aufgreift; (9) ein \
Zitierfehler in B (die Nummer existiert, beschreibt aber etwas anderes) ist nummer_gemeint = nein."""

[[fragen]]
id = "nummer_gemeint"
frage = "Meint die Fundstelle in B die Drucksache A?"
optionen = ["ja", "nein", "keine_fundstelle"]
anleitung = """ja: an der Fundstelle steht die Nummer von A als Verweis auf eine Drucksache (Vorlage, \
Antrag, Anfrage, Beschluss), auch in anderer Schreibweise (ohne führende Nullen, mit Leerzeichen, \
an ein Wort geklebt). nein: die Zeichenfolge ist etwas anderes, das nur so aussieht — ein Datum \
(„01/12/2014"), eine Bebauungsplan- oder Haushaltsnummer, eine Aktenzahl außerhalb des \
Ratsinformationssystems — oder sie meint eine andere Drucksache: passt das, was B unter der Nummer \
beschreibt, erkennbar nicht zu Titel und Text von A, ist es nein (Zitierfehler in B). \
keine_fundstelle: die Aufgabe hat keinen Ausschnitt (Nachtrag über die Nummer); dann nur die beiden \
anderen Fragen."""

[[fragen]]
id = "selbe_sache"
frage = "Gehören A und B zur selben Sache — würde jemand, der die Akte von A führt, B darin erwarten?"
optionen = ["ja", "nein", "unklar"]
anleitung = """ja: B antwortet auf A, fragt zu A oder zu dessen Stand nach, setzt A um, berichtet \
über A, ändert, ergänzt oder ersetzt A, oder führt dieselbe Maßnahme einen Schritt weiter (etwa vom \
Bedarfs- zum Ausführungsbeschluss desselben Bauvorhabens, oder von einer Anfrage zur Machbarkeit zum \
Antrag auf genau diese Maßnahme). Maßstab ist die Sache, nicht das Gremium: dieselbe Sache kann in \
zwei Gremien laufen.

Grenzfälle, entschieden in Fassung .2:
- Sammelvorlage (Beschlusskontrolle, Veränderungsverzeichnis, Ergebnis der Haushaltsberatungen, \
Liste offener Anträge): ja, wenn B zu A eine eigene Zeile mit Sachstand, Entscheidung oder Antwort \
führt; nein, wenn B frühere Beschlüsse nur aufzählt (etwa im Kopf „Beschlusslage" oder „bisherige \
Beschlüsse" einer Vorlage zu etwas anderem).
- Grundsatz- oder Rahmenbeschluss: ja, wenn B genau den Auftrag aus A ausführt oder A den Gegenstand \
von B nennt; nein, wenn B A nur als Rahmen, Begründungskette oder Textbaustein zitiert, wie jeder \
Einzelbeschluss desselben Programms es täte.
- Finanzierung: nein, wenn B A nur als Quelle der Mittel nennt („finanziert über den Beschluss …").
- Beleg: nein, wenn B A nur in einer Fußnote, Quellenliste oder mit „vgl." als Beleg für eine \
allgemeine Aussage nennt und sonst eine andere Sache behandelt.
- Sammelantrag mit vielen Punkten: ja, wenn B genau einen Punkt von A aufgreift.
- nein immer, wenn nummer_gemeint = nein.
unklar: der Ausschnitt reicht für keine der beiden Antworten; nicht raten."""

[[fragen]]
id = "beziehung"
frage = "Welche Rolle hat B gegenüber A? Genau eine Option, die engste, die passt."
optionen = ["antwort", "nachfrage", "umsetzung", "aenderung", "fortsetzung", "bezug", "kein_bezug", "unklar"]
anleitung = """Die Rolle beschreibt B aus der Sicht von A. Für die Rolle zählt, was A und B \
inhaltlich sind, nicht das Feld Dokumentart (eine als „Anfrage" eingestellte Drucksache, die einen \
Antrag stellt, ist ein Antrag). Passen mehrere, gilt die erste der Liste — auch dann, wenn B die eine \
Rolle in der Begründung und die andere im Beschlussvorschlag erfüllt. Fragen und Antworten der \
Verwaltung erkennt man an Formeln wie „die Verwaltung beantwortet die Anfrage wie folgt", „zu Frage \
1", „Beantwortung der Anfrage"; eine Nachfrage an „Nachfrage zur Antwort", „Rückfrage", „wie ist der \
Stand"."""

[fragen.definitionen]
antwort = "A ist eine Anfrage, B beantwortet sie ganz oder teilweise, auch Zusatzfragen aus der Sitzung oder mit einer Zwischennachricht."
nachfrage = "B ist eine Anfrage und fragt nach A, nach der Antwort auf A oder nach dem Stand der Umsetzung von A; A kann eine Anfrage, ein Antrag, ein Beschluss oder eine Vorlage sein."
umsetzung = "A ist ein Antrag, Beschluss oder eine Eingabe, B berichtet über Umsetzung, Prüfung oder Erledigung oder legt A zur Entscheidung vor — auch als eigene Zeile einer Sammelvorlage (Beschlusskontrolle)."
aenderung = "B ändert, ergänzt oder ersetzt A: Änderungs- oder Ergänzungsantrag, Nachtrag, Ergänzungs- oder Neufassungsvorlage, ein späterer Beschluss, der A inhaltlich ändert (Mittel umwidmet, Frist verlängert), oder die abschließende Antwort, wenn A die Zwischennachricht ist."
fortsetzung = "B führt dieselbe Maßnahme in einem späteren Schritt weiter: Bedarfs- → Ausführungsbeschluss, Offenlage → Satzungsbeschluss, Folgebericht zu einem Bericht, Antrag auf eine in A erfragte oder geprüfte Maßnahme."
bezug = "B gehört zur selben Sache, aber keine der Rollen oben trifft (B nennt A als Vorgeschichte derselben Sache)."
kein_bezug = "B nennt A nur am Rand, als Rahmen, Finanzierungsquelle oder Beleg, oder meint A nicht (dann ist selbe_sache = nein)."
unklar = "Der Ausschnitt reicht nicht."

# Nur für die Auswertung (F4, `score`); steht nicht in den Kodieraufgaben. Kantentyp des
# Verfahrens (Fassung .2) -> Rollen der Frage `beziehung`, die als richtig zählen.
[auswertung]
kantenpraezision = "Anteil selbe_sache = ja unter ja und nein; unklar wird gezählt und berichtet, nicht gewertet. Gesamtzahl gewichtet mit den Schichtgrößen der jeweiligen Stichprobe."
rollenpraezision = "je Kantentyp: Anteil beziehung in der Erwartung unten, unter den Kanten mit selbe_sache = ja"
uebereinstimmung = "Krippendorffs alpha zwischen den beiden Kodierern je Frage (nominal); Stufe 3 verlangt alpha >= 0,8"

[auswertung.erwartet]
antwort = ["antwort"]
nachfrage = ["nachfrage"]
umsetzung = ["umsetzung"]
kontrolle = ["umsetzung"]
aenderung = ["aenderung"]
nachtrag = ["aenderung"]
bau = ["fortsetzung"]
fortsetzung = ["fortsetzung"]
bezug = ["antwort", "nachfrage", "umsetzung", "aenderung", "fortsetzung", "bezug"]
