# Installieren: uvx pre-commit install. Nicht mit --all-files ueber data/ laufen lassen.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # context/ und snapshots/ bleiben aussen vor: die Portaldateien sind unveraendert
      # gespeichert, ihre SHA-256 stehen im README daneben, und die CSV endet ohne Zeilenumbruch.
      - id: trailing-whitespace
        exclude: ^(reference/|snapshots/|context/|tests/fixtures/)
      - id: end-of-file-fixer
        exclude: ^(reference/|snapshots/|context/|tests/fixtures/)
      - id: check-added-large-files
        # Die Datenpakete sind Absicht und gross: sozialraeume_2021.geojson 2 130 KB,
        # snapshots/2014-2020/cache/text/texts.parquet 19 MB (docs/decisions.md, Punkte 26 und 56).
        # Ausgenommen statt die Schwelle anzuheben, damit sie fuer alles andere greift; dass in den
        # Paketen nichts Unerwuenschtes liegt, prueft tests/unit/test_data_packages.py.
        args: [--maxkb=1024]
        exclude: ^(reference/|snapshots/|context/)
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
